<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>轉址至員工待辦</title>
    <script>
      (function () {
        var q = location.search || '';
        var h = location.hash || '';
        location.replace('/modules/projects/employee-todo/' + q + h);
      })();
    </script>
    <meta
      http-equiv="refresh"
      content="0;url=/modules/projects/employee-todo/"
    />
  </head>
  <body>
    <p>
      正式派工已改到
      <a id="et-redirect" href="/modules/projects/employee-todo/"
        >新網址</a
      >，正在轉過去…
    </p>
    <script>
      document.getElementById('et-redirect').href =
        '/modules/projects/employee-todo/' +
        (location.search || '') +
        (location.hash || '');
    </script>
  </body>
</html>
