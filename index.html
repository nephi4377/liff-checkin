<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添心設計 | 整合主控台 (SPA)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        .spinner { border-top-color: #3498db; animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1); }
        .card-overdue { animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red { 0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } }
    .collapsible-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-in-out; }
    /* 為了讓燈箱的 v-if/v-show 動畫更流暢 */
    .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Vue 應用程式的掛載點 -->
    <div id="app"></div>

    <!-- 公開知識頁入口：避免把 GEO 頁包在 SPA iframe/hash 中，直接前往可索引 canonical 頁。 -->
    <script>
        (function redirectPublicKnowledgeRoute() {
            const path = (window.location.hash || '').split('?')[0].toLowerCase();
            if (path === '#/sqaq2' || path === '#/faq-new' || path === '#/knowledge') {
                window.location.replace('./modules/info/SQAQ2.html');
            }
            if (path === '#/cases' || path === '#/case') {
                window.location.replace('./modules/info/cases/');
            }
        })();
    </script>

    <!-- 引入 Vue 3 (生產版) 和我們的應用程式主腳本 -->
    <script>
        var FRONTEND_VERSION = 'v26.08.25.1'; // 新增 SQAQ2 公開知識頁直達入口
    </script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="./shared/js/hub_ref_cache.js?v=2"></script>
    <script type="module" src="./spa/app.js?v=26.08.29.1"></script>
</body>
</html>
