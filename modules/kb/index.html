<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>公司知識庫 | 添心設計</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .spinner { border-top-color: #0284c7; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
<!--
  公司知識庫（#/kb）— 只能從「整合主控台」內開啟。
  身分：向最外層主控台索取 LIFF ID token（request_hub_liff_token → hub_liff_token，同會計模組），
        每次呼叫 API 都帶 Authorization: Bearer <token>；權限（≥2、非離職；廠商報價需 ≥3）由 TX34 上的知識庫 API 向 LINE＋員工資料驗證。
  網址上的 uid／permission 參數僅供顯示，不作為授權依據。
  API 位址：shared/js/config.js 的 CONFIG.KB_API_BASE。
-->
<div class="max-w-3xl mx-auto p-4 sm:p-6">
    <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-lg bg-sky-100 text-sky-700 flex items-center justify-center text-xl">📚</div>
        <div>
            <h1 class="text-xl font-bold">公司知識庫</h1>
            <p class="text-xs text-gray-500">依公司資料回答（案場施工回報、報價／簽約／選材文件、公司 SOP）。答案由 AI 整理，重要數字請核對來源。</p>
        </div>
    </div>

    <div id="status" class="mb-4 text-sm rounded-lg border px-3 py-2 bg-white border-gray-200 text-gray-600">
        <span class="inline-block align-middle w-4 h-4 mr-2 border-2 border-gray-200 rounded-full spinner"></span>正在確認身分…
    </div>

    <form id="ask-form" class="hidden bg-white rounded-xl border border-gray-200 shadow-sm p-4 mb-4">
        <label for="q" class="block text-sm font-semibold mb-1">你的問題</label>
        <textarea id="q" rows="3" maxlength="500" required
            class="w-full border border-gray-300 rounded-lg p-2 text-base focus:outline-none focus:ring-2 focus:ring-sky-400"
            placeholder="例如：785 最近的施工進度？782 報價單總價多少？"></textarea>
        <div class="flex flex-wrap items-center justify-between gap-2 mt-2">
            <label class="text-sm text-gray-600">模式
                <select id="mode" class="ml-1 border border-gray-300 rounded-md px-2 py-1 text-sm">
                    <option value="auto" selected>自動（依問題選模型）</option>
                    <option value="fast">快速</option>
                    <option value="smart">精準（較慢，適合比較／計算）</option>
                </select>
            </label>
            <div class="flex items-center gap-3">
                <span id="count" class="text-xs text-gray-400">0 / 500</span>
                <button id="submit" type="submit" class="bg-sky-600 text-white font-semibold px-4 py-2 rounded-lg hover:bg-sky-700 disabled:opacity-50">🔍 提問</button>
            </div>
        </div>
    </form>

    <div id="history" class="space-y-4"></div>
</div>

<script type="module">
import { CONFIG } from '../../shared/js/config.js';

const API = String(CONFIG.KB_API_BASE || '').replace(/\/+$/, '');
const POLL_MS = 2000;
const MAX_WAIT_MS = 10 * 60 * 1000;
const $ = (id) => document.getElementById(id);

function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function setStatus(html, tone) {
    const tones = {
        info: 'bg-white border-gray-200 text-gray-600',
        ok: 'bg-green-50 border-green-200 text-green-800',
        warn: 'bg-amber-50 border-amber-200 text-amber-800',
        err: 'bg-red-50 border-red-200 text-red-700'
    };
    const el = $('status');
    el.className = 'mb-4 text-sm rounded-lg border px-3 py-2 ' + (tones[tone] || tones.info);
    el.innerHTML = html;
}

/* ---------- 向主控台索取 LIFF token（同 accounting_api.js 的作法） ---------- */
function hubTarget() {
    try { if (window.top && window.top !== window) return window.top; } catch (e) {}
    return (window.parent && window.parent !== window) ? window.parent : null;
}
function requestTokenOnce() {
    const target = hubTarget();
    if (!target) return Promise.resolve('');
    return new Promise((resolve) => {
        let done = false;
        const timer = setTimeout(() => { if (!done) { done = true; window.removeEventListener('message', onMsg); resolve(''); } }, 4000);
        function onMsg(e) {
            if (e.origin !== window.location.origin) return;          // 只接受同網站主控台的回覆
            if (!e.data || e.data.type !== 'hub_liff_token' || done) return;
            done = true; clearTimeout(timer); window.removeEventListener('message', onMsg);
            resolve(e.data.token || '');
        }
        window.addEventListener('message', onMsg);
        try { target.postMessage({ type: 'request_hub_liff_token' }, window.location.origin); }
        catch (err) { clearTimeout(timer); window.removeEventListener('message', onMsg); resolve(''); }
    });
}
async function getToken() {
    for (let i = 0; i < 4; i++) {
        const t = await requestTokenOnce();
        if (t) return t;
        if (i < 3) await new Promise((r) => setTimeout(r, 800));
    }
    return '';
}

class ApiError extends Error {
    constructor(status, message) { super(message); this.status = status; }
}
async function api(path, opts = {}) {
    const token = await getToken();
    if (!token) throw new ApiError(401, '登入憑證已過期，請關閉後從 LINE 重新開啟主控台');
    let res;
    try {
        res = await fetch(API + path, {
            method: opts.method || 'GET',
            headers: Object.assign({
                'Authorization': 'Bearer ' + token,
                'ngrok-skip-browser-warning': '1'
            }, opts.body ? { 'Content-Type': 'application/json' } : {}),
            body: opts.body ? JSON.stringify(opts.body) : undefined,
            cache: 'no-store'
        });
    } catch (e) {
        throw new ApiError(0, '連不到知識庫主機（公司電腦可能關機或網路中斷），請稍後再試');
    }
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) {
        const msg = (data && data.detail && typeof data.detail === 'string') ? data.detail : ('知識庫主機回應異常（HTTP ' + res.status + '）');
        throw new ApiError(res.status, msg);
    }
    return data;
}

/* ---------- 畫面 ---------- */
function renderCard(item) {
    const r = item.result || {};
    const srcs = (r.sources || []).map((s) => `
        <details class="border border-gray-100 rounded-md px-2 py-1">
            <summary class="cursor-pointer text-xs text-gray-700">[${esc(s.n)}] ${esc(s.source)}${s.section ? ' — ' + esc(s.section) : ''}</summary>
            <p class="text-xs text-gray-500 mt-1 whitespace-pre-wrap">${esc(s.excerpt)}</p>
        </details>`).join('');
    let body;
    if (item.state === 'done') {
        body = `
            ${r.fallback ? `<p class="text-xs text-amber-700 mb-2">⚠️ ${esc(r.fallback)}</p>` : ''}
            <div class="whitespace-pre-wrap leading-relaxed">${esc(r.answer)}</div>
            ${srcs ? `<p class="text-sm font-semibold mt-3 mb-1">📎 參考來源</p><div class="space-y-1">${srcs}</div>` : ''}
            <p class="text-[11px] text-gray-400 mt-2">${esc(r.model)}${r.route_label ? '（' + esc(r.route_label) + '）' : ''}${r.total_s != null ? '｜' + esc(r.total_s) + ' 秒' : ''}</p>`;
    } else if (item.state === 'error') {
        body = `<p class="text-red-700 text-sm">❌ ${esc(item.error)}</p>`;
    } else {
        body = `<p class="text-sm text-gray-500"><span class="inline-block align-middle w-4 h-4 mr-2 border-2 border-gray-200 rounded-full spinner"></span>${esc(item.progress || '送出中…')}</p>`;
    }
    return `<div class="bg-white rounded-xl border border-gray-200 shadow-sm p-4">
        <p class="font-semibold mb-2">❓ ${esc(item.question)}</p>${body}</div>`;
}
const history = [];
function renderHistory() { $('history').innerHTML = history.map(renderCard).join(''); }

async function ask(question, mode) {
    const item = { question, state: 'pending', progress: '送出中…' };
    history.unshift(item); renderHistory();
    $('submit').disabled = true;
    try {
        const job = await api('/api/ask', { method: 'POST', body: { question, mode } });
        const t0 = Date.now();
        while (Date.now() - t0 < MAX_WAIT_MS) {
            await new Promise((r) => setTimeout(r, POLL_MS));
            const st = await api('/api/jobs/' + encodeURIComponent(job.job_id));
            if (st.status === 'done') { item.state = 'done'; item.result = st.result; break; }
            if (st.status === 'error') { item.state = 'error'; item.error = st.error || '處理失敗'; break; }
            const secs = Math.round((Date.now() - t0) / 1000);
            item.progress = st.status === 'queued'
                ? `排隊中（第 ${st.position || 1} 位）… ${secs} 秒`
                : `AI 查資料並整理回答中…（複雜問題約 20~90 秒）${secs} 秒`;
            renderHistory();
        }
        if (item.state === 'pending') { item.state = 'error'; item.error = '等候逾時，請稍後再試'; }
    } catch (e) {
        item.state = 'error'; item.error = e.message || String(e);
    } finally {
        $('submit').disabled = false;
        renderHistory();
    }
}

async function init() {
    if (!API) { setStatus('知識庫尚未設定連線位址（CONFIG.KB_API_BASE）。', 'warn'); return; }
    if (!hubTarget()) { setStatus('請從 LINE「整合主控台」開啟知識庫（主控台 → 知識庫）。', 'warn'); return; }
    try {
        const me = await api('/api/me');
        setStatus(`✅ ${esc(me.display_name || '已登入')}，可以開始提問。${me.index_built_at ? '<span class="text-xs text-gray-500 ml-1">（資料更新：' + esc(me.index_built_at) + '）</span>' : ''}`, 'ok');
        $('ask-form').classList.remove('hidden');
        $('q').focus();
    } catch (e) {
        setStatus('❌ ' + esc(e.message), e.status === 403 ? 'warn' : 'err');
    }
}

$('q').addEventListener('input', () => { $('count').textContent = $('q').value.length + ' / 500'; });
$('ask-form').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const q = $('q').value.trim();
    if (!q) return;
    ask(q, $('mode').value);
    $('q').value = ''; $('count').textContent = '0 / 500';
});
init();
</script>
</body>
</html>
