<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>歷史記帳紀錄</title>
  <!-- cache-bust 2026-10-06-recent-timeout：近期收支掃表加速；排序仍只依 recorded_at；≥3 全部人 -->
  <link rel="stylesheet" href="../../shared/css/accounting_layout.css?v=6" />
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="../../shared/js/operator_context.js?v=4"></script>
  <script src="../../shared/js/accounting_api.js?v=88"></script>
  <script src="../../shared/js/accounting_cache.js?v=34"></script>
  <script src="../../shared/js/accounting_lightbox.js?v=19"></script>
  <script src="../../shared/js/accounting_ui.js?v=32"></script>
  <script src="../../shared/js/accounting_nav.js?v=2"></script>
  <script src="../../shared/js/accounting_boot.js?v=15"></script>
  <style>
    h2 { margin: 0 0 4px; }
    .sub { color: #555; font-size: 14px; margin: 0 0 12px; line-height: 1.45; }
    .card {
      background: #fff; border-radius: 12px; padding: 14px;
      margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
      box-sizing: border-box; min-width: 0;
    }
    label { display: block; margin-top: 0; font-weight: 600; font-size: 13px; }
    .hidden { display: none !important; }
    .nav { margin-bottom: 12px; font-size: 14px; }
    .nav a { color: #1a73e8; text-decoration: none; }
    .hint { font-size: 12px; color: #777; margin-top: 4px; line-height: 1.4; }

    .hist-head {
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; margin-bottom: 10px; flex-wrap: wrap;
    }
    .hist-head strong { font-size: 15px; }

    #historyFilters {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 12px;
      margin: 0 0 10px;
    }
    #historyFilters > * { min-width: 0; }
    #historyFilters .full { grid-column: 1 / -1; }
    #historyFilters input,
    #historyFilters select {
      width: 100%; max-width: 100%; min-width: 0;
      padding: 8px; margin-top: 4px; box-sizing: border-box;
      border: 1px solid #ccc; border-radius: 8px; font-size: 15px;
    }
    .hist-actions {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 2px;
    }
    .btn-ghost {
      width: auto; flex: 0 0 auto; padding: 8px 12px; font-size: 14px;
      background: #e8eaed; color: #333; border: none; border-radius: 8px;
      cursor: pointer; margin-top: 0; white-space: nowrap;
    }
    .btn-primary-hist {
      background: #1a73e8; color: #fff;
    }

    /* 「只看我記的」：整列開關，與正式站舊版（checkbox 擠查詢鈕）明顯不同 */
    .hist-mine-toggle {
      grid-column: 1 / -1;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      width: 100%; box-sizing: border-box;
      margin: 0 0 4px; padding: 14px 16px;
      border: 2px solid #dadce0; border-radius: 12px;
      background: #fff; cursor: pointer; text-align: left;
      font-family: inherit; min-height: 56px;
    }
    .hist-mine-toggle.is-on {
      border-color: #1a73e8; background: #e8f0fe;
      box-shadow: inset 4px 0 0 #1a73e8;
    }
    .hist-mine-toggle .hist-mine-copy { min-width: 0; flex: 1 1 auto; }
    .hist-mine-toggle .hist-mine-title {
      display: block; font-size: 16px; font-weight: 800; color: #202124; line-height: 1.3;
    }
    .hist-mine-toggle .hist-mine-sub {
      display: block; margin-top: 4px; font-size: 12px; color: #5f6368; line-height: 1.4; font-weight: 500;
    }
    .hist-mine-toggle .hist-mine-state {
      flex: 0 0 auto; min-width: 3.2em; padding: 8px 12px; border-radius: 999px;
      font-size: 14px; font-weight: 800; text-align: center;
      background: #e8eaed; color: #5f6368;
    }
    .hist-mine-toggle.is-on .hist-mine-state {
      background: #1a73e8; color: #fff;
    }
    .hist-mine-toggle:focus {
      outline: none; box-shadow: 0 0 0 3px rgba(26,115,232,.35);
    }
    .hist-mine-toggle.is-on:focus {
      box-shadow: inset 4px 0 0 #1a73e8, 0 0 0 3px rgba(26,115,232,.35);
    }

    #historyStatus {
      font-size: 13px; color: #555; margin: 0 0 10px; line-height: 1.45;
      padding: 8px 10px; background: #f8fafc; border-radius: 8px;
      border: 1px solid #e8eaed;
    }
    #historyStatus.is-empty { color: #8a5a00; background: #fff8e8; border-color: #f0d9a8; }
    #historyStatus.is-error { color: #8b1a1a; background: #fdecea; border-color: #f5c6c2; }
    #historyStatus.is-ok { color: #1e3a5f; }

    .hist-workspace {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      align-items: start;
    }
    .hist-list-card, .hist-detail-card { margin-bottom: 0; }

    #historyList { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

    .hist-item {
      border: 1px solid #e8eaed; border-radius: 10px; padding: 10px 12px; background: #fafafa;
      font-size: 13px; line-height: 1.45; cursor: pointer; text-align: left; width: 100%;
      box-sizing: border-box; font-family: inherit; min-width: 0;
    }
    .hist-item:hover, .hist-item:focus { border-color: #1a73e8; background: #f5f9ff; outline: none; }
    .hist-item.is-open { border-color: #1a73e8; background: #fff; box-shadow: 0 1px 4px rgba(26,115,232,.12); }
    .hist-item .hist-top {
      display: flex; flex-wrap: nowrap; gap: 8px; align-items: baseline;
      justify-content: space-between; min-width: 0;
    }
    .hist-item .hist-top-left {
      display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; min-width: 0;
    }
    .hist-item .hist-type { font-weight: 700; }
    .hist-item .hist-type.income { color: #137333; }
    .hist-item .hist-type.expense { color: #c5221f; }
    .hist-item .hist-amt { font-weight: 700; font-size: 15px; flex: 0 0 auto; white-space: nowrap; }
    .hist-item .hist-meta {
      color: #555; margin-top: 4px;
      overflow: hidden; text-overflow: ellipsis;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .hist-item .hist-loc {
      color: #777; font-size: 12px; margin-top: 4px;
      font-family: ui-monospace, monospace; word-break: break-all;
    }
    .hist-item .hist-hint { color: #1a73e8; font-size: 12px; margin-top: 6px; }

    .hist-detail {
      margin-top: 10px; padding-top: 10px; border-top: 1px solid #e8eaed;
      font-size: 13px; line-height: 1.5; color: #333;
    }
    .hist-detail dl,
    #historyDetailBody dl {
      margin: 0;
      display: grid;
      grid-template-columns: minmax(4.5em, 6.5em) minmax(0, 1fr);
      gap: 6px 10px;
    }
    .hist-detail dt,
    #historyDetailBody dt { color: #777; font-weight: 600; margin: 0; }
    .hist-detail dd,
    #historyDetailBody dd { margin: 0; word-break: break-word; min-width: 0; }
    .hist-detail-status { color: #666; font-size: 12px; margin: 0 0 8px; }
    .hist-att-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
    .hist-att-thumbs { display: flex; flex-wrap: wrap; gap: 6px; }
    .hist-att-thumbs button {
      border: 1px solid #dadce0; border-radius: 8px; padding: 0; background: #fff;
      width: 56px; height: 56px; overflow: hidden; cursor: pointer;
    }
    .hist-att-thumbs img { width: 56px; height: 56px; object-fit: cover; display: block; }

    .hist-edit-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .hist-edit-form {
      margin-top: 12px; padding: 12px; border: 1px solid #dadce0; border-radius: 10px;
      background: #f8fafc;
    }
    .hist-edit-form label { margin-top: 8px; }
    .hist-edit-form label:first-child { margin-top: 0; }
    .hist-edit-form input, .hist-edit-form select, .hist-edit-form textarea {
      width: 100%; max-width: 100%; box-sizing: border-box;
      padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px;
    }
    .hist-edit-form textarea { min-height: 64px; resize: vertical; }
    .hist-edit-form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .hist-edit-form .hist-edit-msg { font-size: 13px; margin: 8px 0 0; }
    .hist-edit-form .hist-edit-msg.is-ok { color: #137333; }
    .hist-edit-form .hist-edit-msg.is-err { color: #c5221f; }
    .btn-edit-primary {
      background: #1a73e8; color: #fff; border: none; border-radius: 8px;
      padding: 8px 12px; font-size: 14px; cursor: pointer;
    }
    .btn-edit-primary:disabled { opacity: .5; cursor: default; }
    .btn-flag-warn {
      background: #fef7e0; color: #b06000; border: 1px solid #f9ab00;
      border-radius: 8px; padding: 8px 12px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .btn-delete-danger {
      background: #fce8e6; color: #c5221f; border: 1px solid #f28b82;
      border-radius: 8px; padding: 8px 12px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .hist-flag-badge {
      display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px;
      border-radius: 6px; background: #fef7e0; color: #b06000; margin-left: 6px;
    }
    .hist-item.is-flagged { border-color: #f9ab00; background: #fffbf0; }
    .hist-mod-msg { font-size: 13px; margin: 8px 0 0; }
    .hist-mod-msg.is-ok { color: #137333; }
    .hist-mod-msg.is-err { color: #c5221f; }

    .hist-detail-placeholder {
      margin: 0; color: #777; font-size: 14px; line-height: 1.5;
    }
    .hist-detail-card-title {
      font-size: 15px; font-weight: 700; margin: 0 0 10px;
    }

    /* 手機：詳情嵌在列內；側欄隱藏 */
    .hist-detail-card { display: none; }
    .hist-item .hist-detail.hidden { display: none !important; }

    @media (max-width: 559px) {
      #historyFilters { grid-template-columns: 1fr; }
    }

    /* 桌機：列表＋側欄詳情 */
    @media (min-width: 900px) {
      .hist-workspace {
        grid-template-columns: minmax(0, 1.1fr) minmax(280px, 0.9fr);
        gap: 14px;
      }
      .hist-detail-card {
        display: block;
        position: sticky;
        top: 12px;
        max-height: calc(100vh - 24px);
        overflow: auto;
      }
      /* 桌機用側欄，列內詳情收起 */
      .hist-item .hist-detail,
      .hist-item .hist-hint { display: none !important; }
    }
  </style>
</head>
<body class="acct-page acct-page-form acct-page-browse">
  <div id="loading">載入中…</div>
  <div id="app" class="hidden acct-main">
    <p class="nav"><a href="index.html">← 會計功能選單</a></p>
    <h2>歷史記帳紀錄</h2>
    <p class="sub" id="userLine">—</p>
    <p class="sub" id="pageModeHint">權限 ≥3 可查<strong>區間內全部人</strong>的帳。預設近 7 天；列表<strong>只依新增時間（你按下送出的時間）</strong>新→舊，<strong>不是交易日</strong>。「只看我記的」為選用篩選（暫不強制）。點一筆可看案號、圖片集。權限：標註錯誤 ≥3；刪除已標註 ≥4；修改記帳需 &gt;4。</p>

    <div class="card" id="historyFiltersCard">
      <div class="hist-head">
        <strong>查詢條件</strong>
        <button type="button" class="btn-ghost" id="historyRefreshBtn">重新整理</button>
      </div>
      <div id="historyFilters">
        <button type="button" class="hist-mine-toggle" id="historyMineToggle"
          aria-pressed="false" title="選用：只顯示本人記入的帳（預設關＝看全部）">
          <span class="hist-mine-copy">
            <span class="hist-mine-title">只看我記的（選用）</span>
            <span class="hist-mine-sub" id="historyMineSub">關閉中：顯示區間內全部人記入的帳。需要時再開啟只看本人。</span>
          </span>
          <span class="hist-mine-state" id="historyMineState" aria-hidden="true">關</span>
        </button>
        <input type="checkbox" id="historyMineOnly" class="hidden" tabindex="-1" aria-hidden="true" />
        <div>
          <label for="histDateFrom">記帳時間起</label>
          <input id="histDateFrom" type="date" />
        </div>
        <div>
          <label for="histDateTo">記帳時間迄</label>
          <input id="histDateTo" type="date" />
        </div>
        <div>
          <label for="histType">類型</label>
          <select id="histType">
            <option value="">全部</option>
            <option value="收入">收入</option>
            <option value="支出">支出</option>
          </select>
        </div>
        <div>
          <label for="histAmount">金額（選填）</label>
          <input id="histAmount" type="number" inputmode="numeric" placeholder="完全相符" />
        </div>
        <div class="full">
          <label for="histKeyword">關鍵字（對象／事由／備註）</label>
          <input id="histKeyword" type="text" placeholder="例：廠商名、訂金" autocomplete="off" />
        </div>
        <div class="full">
          <p class="hint" style="margin:0 0 8px">近 7／30 天<strong>只顯示有「新增時間」戳記</strong>的帳（你送出的時間），不是交易日；列表依新增時間新到舊。戳記上線前的舊列不會出現在此區間。</p>
          <div class="hist-actions">
            <button type="button" class="btn-ghost btn-primary-hist" id="historySearchBtn">查詢</button>
            <button type="button" class="btn-ghost" id="historyClearBtn">重設為近 7 天</button>
            <button type="button" class="btn-ghost" id="historyExpand30Btn">近 30 天</button>
          </div>
        </div>
      </div>
    </div>

    <div class="hist-workspace">
      <div class="card hist-list-card" id="historyListCard">
        <div class="hist-head">
          <strong>紀錄列表</strong>
          <span class="hist-loc" style="font-weight:600;color:#174ea6">依新增時間</span>
        </div>
        <p id="historyStatus" class="is-ok">載入中…</p>
        <div id="historyList"></div>
      </div>
      <aside class="card hist-detail-card" id="historyDetailCard" aria-live="polite">
        <p class="hist-detail-card-title">明細</p>
        <p class="hist-detail-placeholder" id="historyDetailPlaceholder">點左側一筆看案號、備註與圖片集。</p>
        <div id="historyDetailBody" class="hidden"></div>
      </aside>
    </div>
  </div>

  <script>
    (function () {
      var sessionRef = null;
      var openHistoryKey = '';
      var itemsByKey = {};

      function formatMoney(n) {
        var v = Number(n);
        if (!isFinite(v)) return String(n == null ? '' : n);
        return '$' + Math.round(v).toLocaleString('zh-TW');
      }

      function escHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function historyItemKey(it) {
        if (!it) return '';
        if (it.sheet && it.row) return String(it.sheet) + '#' + String(it.row);
        return String(it.ingest_id || '');
      }

      function isDesktopDetail() {
        return window.matchMedia && window.matchMedia('(min-width: 900px)').matches;
      }

      function driveThumbUrl(url) {
        var m = String(url || '').match(/\/d\/([^/]+)/);
        if (m) return 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w200';
        return url;
      }

      function setStatus(text, kind) {
        var status = document.getElementById('historyStatus');
        status.textContent = text;
        status.classList.remove('is-ok', 'is-empty', 'is-error');
        status.classList.add(kind === 'error' ? 'is-error' : (kind === 'empty' ? 'is-empty' : 'is-ok'));
      }

      function clearSideDetail() {
        var ph = document.getElementById('historyDetailPlaceholder');
        var body = document.getElementById('historyDetailBody');
        if (ph) ph.classList.remove('hidden');
        if (body) {
          body.classList.add('hidden');
          body.innerHTML = '';
        }
      }

      function renderHistoryDetailFields(detail) {
        detail = detail || {};
        var rows = [
          ['類型', detail.type || '—'],
          ['交易日', detail.txn_date_display || detail.txn_date || '—'],
          ['新增時間', detail.recorded_at_display || detail.recorded_at || '—'],
          ['金額', formatMoney(detail.amount)],
          ['對象', detail.party_name || '—'],
          ['事由', detail.desc || '—'],
          ['案號', detail.project_no || '（未填）'],
          ['付款方式', detail.payment_method || '—']
        ];
        if (detail.edited_at_display || detail.edited_at) {
          rows.splice(3, 0, ['上次修改', detail.edited_at_display || detail.edited_at]);
        }
        if (detail.error_flagged) {
          var flagLabel = '已標註錯誤';
          if (detail.error_flagged_by) flagLabel += '（' + detail.error_flagged_by + '）';
          if (detail.error_flagged_at) {
            flagLabel += ' ' + String(detail.error_flagged_at).replace('T', ' ').slice(0, 16);
          }
          rows.splice(1, 0, ['狀態', flagLabel]);
        }
        if (detail.stores && detail.stores.length) {
          rows.push(['店別', detail.stores.map(function (s) {
            return s.store + (s.amount != null && s.amount !== '' ? ' ' + formatMoney(s.amount) : '');
          }).join('、')]);
        }
        if (detail.note) rows.push(['備註', detail.note]);
        var loc = (detail.sheet || '—') + ' 第' + (detail.row || '?') + '列';
        if (detail.ingest_id) loc += ' · ' + detail.ingest_id;
        rows.push(['位置', loc]);

        var dl = '<dl>';
        rows.forEach(function (pair) {
          dl += '<dt>' + escHtml(pair[0]) + '</dt><dd>' + escHtml(pair[1]) + '</dd>';
        });
        dl += '</dl>';
        return dl;
      }

      function sessionPerm() {
        return Number((sessionRef && sessionRef.auth && sessionRef.auth.permission) || 0);
      }

      function sessionCanEditDetail(detail) {
        if (!sessionRef || !sessionRef.auth) return false;
        if (detail && detail.can_edit === true) return true;
        if (detail && detail.can_edit === false) return false;
        // 老闆：修改記帳需權限大於 4（Yang=3 只能標註）
        return sessionPerm() > 4;
      }

      function sessionCanFlagDetail(detail) {
        if (!sessionRef || !sessionRef.auth) return false;
        if (detail && detail.can_flag === true) return true;
        if (detail && detail.can_flag === false) return false;
        if (detail && detail.error_flagged) return false;
        return sessionPerm() >= 3;
      }

      function sessionCanDeleteDetail(detail) {
        if (!sessionRef || !sessionRef.auth) return false;
        if (detail && detail.can_delete === true) return true;
        if (detail && detail.can_delete === false) return false;
        return sessionPerm() >= 4 && !!(detail && detail.error_flagged);
      }

      function fileToPhotoPayload(file) {
        return new Promise(function (resolve, reject) {
          var reader = new FileReader();
          reader.onload = function () {
            var dataUrl = String(reader.result || '');
            var comma = dataUrl.indexOf(',');
            var b64 = comma >= 0 ? dataUrl.slice(comma + 1) : dataUrl;
            resolve({
              dataBase64: b64,
              mimeType: file.type || 'image/jpeg',
              filename: file.name || 'edit.jpg'
            });
          };
          reader.onerror = function () { reject(reader.error || new Error('讀圖失敗')); };
          reader.readAsDataURL(file);
        });
      }

      function buildModerationActions(panel, summaryItem, detail) {
        var merged = Object.assign({}, summaryItem || {}, detail || {});
        var canEdit = sessionCanEditDetail(merged);
        var canFlag = sessionCanFlagDetail(merged);
        var canDelete = sessionCanDeleteDetail(merged);
        if (!canEdit && !canFlag && !canDelete) return;

        var actions = document.createElement('div');
        actions.className = 'hist-edit-actions';
        var modMsg = document.createElement('p');
        modMsg.className = 'hist-mod-msg';
        modMsg.setAttribute('data-role', 'mod-msg');

        function setModMsg(text, ok) {
          modMsg.textContent = text || '';
          modMsg.className = 'hist-mod-msg ' + (ok ? 'is-ok' : (text ? 'is-err' : ''));
        }

        function locOpts() {
          return {
            sheet: merged.sheet || (summaryItem && summaryItem.sheet),
            row: merged.row != null ? merged.row : (summaryItem && summaryItem.row),
            ingest_id: merged.ingest_id || (summaryItem && summaryItem.ingest_id)
          };
        }

        if (canFlag) {
          var flagBtn = document.createElement('button');
          flagBtn.type = 'button';
          flagBtn.className = 'btn-flag-warn';
          flagBtn.textContent = '標註錯誤';
          flagBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            if (!sessionRef || typeof AccountingApi.accountingLedgerFlag !== 'function') {
              setModMsg('標註功能尚未就緒', false);
              return;
            }
            if (!window.confirm('標註這筆為錯誤記帳？\n（權限 4 之後才能刪除已標註的帳）')) return;
            flagBtn.disabled = true;
            setModMsg('標註中…', true);
            AccountingApi.accountingLedgerFlag(sessionRef, locOpts()).then(function (data) {
              flagBtn.disabled = false;
              if (!data || !data.success) {
                setModMsg((data && data.message) || '標註失敗', false);
                return;
              }
              setModMsg(data.message || '已標註', true);
              var updated = data.item || Object.assign({}, merged, {
                error_flagged: true,
                can_flag: false,
                can_delete: sessionPerm() >= 4,
                can_edit: sessionPerm() > 4
              });
              var key = historyItemKey(summaryItem) || historyItemKey(updated);
              if (key && itemsByKey[key]) {

                });

      function saveHistoryEdit(panel, summaryItem, merged, form, editBtn) {
        var msg = form.querySelector('[data-role="msg"]');
        var saveBtn = form.querySelector('[data-act="save"]');
        function setMsg(text, ok) {
          if (!msg) return;
          msg.textContent = text || '';
          msg.className = 'hist-edit-msg ' + (ok ? 'is-ok' : 'is-err');
        }
        if (!sessionRef || typeof AccountingApi.accountingLedgerUpdate !== 'function') {
          setMsg('修改功能尚未就緒', false);
          return;
        }
        var fields = {
          txn_date: form.querySelector('[data-f="txn_date"]').value.trim(),
          amount: form.querySelector('[data-f="amount"]').value,
          party_name: form.querySelector('[data-f="party_name"]').value.trim(),
          item_desc: form.querySelector('[data-f="item_desc"]').value.trim(),
          project_no: form.querySelector('[data-f="project_no"]').value.trim(),
          payment_method: form.querySelector('[data-f="payment_method"]').value.trim(),
          store: form.querySelector('[data-f="store"]').value,
          note: form.querySelector('[data-f="note"]').value
        };
        if (!fields.txn_date) {
          setMsg('請填交易日', false);
          return;
        }
        if (!fields.amount || Number(fields.amount) <= 0) {
          setMsg('請填有效金額', false);
          return;
        }
        if (saveBtn) saveBtn.disabled = true;
        setMsg('儲存中…', true);

        var fileInput = form.querySelector('[data-f="photos"]');
        var files = fileInput && fileInput.files ? Array.prototype.slice.call(fileInput.files, 0) : [];
        var photoPromise = files.length
          ? Promise.all(files.map(fileToPhotoPayload))
          : Promise.resolve([]);

        photoPromise.then(function (photos) {
          return AccountingApi.accountingLedgerUpdate(sessionRef, {
            sheet: merged.sheet || (summaryItem && summaryItem.sheet),
            row: merged.row != null ? merged.row : (summaryItem && summaryItem.row),
            ingest_id: merged.ingest_id || (summaryItem && summaryItem.ingest_id),
            fields: fields,
            photos: photos
          });
        }).then(function (data) {
          if (saveBtn) saveBtn.disabled = false;
          if (!data || !data.success) {
            setMsg((data && data.message) || '修改失敗', false);
            return;
          }
          setMsg(data.message || '已修改', true);
          var updated = data.item || Object.assign({}, merged, fields, {
            sheet: data.sheet,
            row: data.row,
            edited_at: data.edited_at,
            edited_at_display: data.edited_at
              ? String(data.edited_at).replace('T', ' ').slice(0, 16)
              : '',
            recorded_at: data.recorded_at || merged.recorded_at,
            can_edit: true
          });
          if (updated.party_name || updated.item_desc) {
            updated.desc = updated.party_name && updated.item_desc
              ? (updated.party_name + '／' + updated.item_desc)
              : (updated.party_name || updated.item_desc || updated.desc);
          }
          var key = historyItemKey(summaryItem) || historyItemKey(updated);
          if (key && itemsByKey[key]) {
            Object.assign(itemsByKey[key], {
              amount: updated.amount,
              party_name: updated.party_name,
              desc: updated.desc,
              txn_date: updated.txn_date,
              txn_date_display: updated.txn_date_display || updated.txn_date,
              project_no: updated.project_no,
              payment_method: updated.payment_method,
              note: updated.note,
              sheet: updated.sheet,
              row: updated.row,
              edited_at: updated.edited_at,
              edited_at_display: updated.edited_at_display
            });
            // 換月搬列時更新 key
            if (data.relocated) {
              var newKey = historyItemKey(updated);
              if (newKey && newKey !== key) {
                itemsByKey[newKey] = itemsByKey[key];
                delete itemsByKey[key];
                openHistoryKey = newKey;
              }
            }
          }
          // 重新渲染詳情＋輕刷列表列
          fillHistoryDetailPanel(panel, itemsByKey[openHistoryKey] || updated, updated);
          try { loadLedgerHistory(); } catch (eReload) {}
        }).catch(function (err) {
          if (saveBtn) saveBtn.disabled = false;
          setMsg((err && err.message) || '修改失敗，請稍後再試', false);
        });
      }

      function renderHistoryAttachments(container, detail) {
        var urls = (detail && detail.attachment_urls) || [];
        if ((!urls || !urls.length) && detail && detail.attachments) {

      function fillHistoryDetailPanel(panel, summaryItem, detail) {
        panel.innerHTML = '';
        var status = document.createElement('p');
        status.className = 'hist-detail-status';

        panel.appendChild(status);

        var merged = Object.assign({}, summaryItem || {}, detail || {});

      function activeDetailPanel(rowEl) {
        if (isDesktopDetail()) {
          var ph = document.getElementById('historyDetailPlaceholder');
          var body = document.getElementById('historyDetailBody');
          if (ph) ph.classList.add('hidden');
          if (body) body.classList.remove('hidden');
          return body;
        }
        var panel = rowEl.querySelector('.hist-detail');
        if (!panel) {
          panel = document.createElement('div');
          panel.className = 'hist-detail';
          rowEl.appendChild(panel);
        }
        panel.classList.remove('hidden');
        return panel;
      }

      function loadHistoryDetailForItem(rowEl, it) {
        var panel = activeDetailPanel(rowEl);
        if (!panel) return;
        // 點列立刻用列表摘要（案號／金額／事由已在列表）；勿乾等詳情 API
        fillHistoryDetailPanel(panel, it, null);
        var status = panel.querySelector('.hist-detail-status');
        if (status) status.textContent = '載入詳情…';
        var reqKey = historyItemKey(it);

        function stillCurrent() {
          return openHistoryKey === reqKey && panel.isConnected;
        }

        function apply(detail) {
          if (!stillCurrent()) return;
          fillHistoryDetailPanel(panel, it, detail);
        }

        function loadAttachmentsSoft(baseDetail) {
          if (!stillCurrent()) return;
          if (!sessionRef || typeof AccountingLightbox === 'undefined' || !it.ingest_id) {
            apply(baseDetail || it);
            return;
          }
          if (baseDetail && baseDetail.attachment_urls && baseDetail.attachment_urls.length) {
            apply(baseDetail);
            return;
          }
          // 圖片集另載；失敗不噴錯誤回報、不擋已顯示的摘要
          AccountingLightbox.fetchAttachmentUrls(sessionRef, { ingest_id: it.ingest_id }).then(function (urls) {
            if (!stillCurrent()) return;
            apply(Object.assign({}, baseDetail || it, {
              attachment_urls: urls || [],
              has_attachments: !!(urls && urls.length)
            }));
          }).catch(function () {
            if (!stillCurrent()) return;
            apply(baseDetail || it);
            var st = panel.querySelector('.hist-detail-status');
            if (st) st.textContent = '詳情已顯示；圖片集讀不到時可稍後再點開。';
          });
        }

        if (!sessionRef || typeof AccountingApi.accountingLedgerDetail !== 'function') {
          loadAttachmentsSoft(it);
          return;
        }

        // lean 詳情：補完整備註／店別，不掃附件索引（15s；逾時軟失敗）
        AccountingApi.accountingLedgerDetail(sessionRef, {
          sheet: it.sheet,
          row: it.row,
          ingest_id: it.ingest_id,
          skip_attachments: true
        }).then(function (data) {
          if (!stillCurrent()) return;
          if (data && data.success && data.item) {
            loadAttachmentsSoft(data.item);
            return;
          }
          loadAttachmentsSoft(it);
          var st = panel.querySelector('.hist-detail-status');
          if (st && data && data.message) st.textContent = data.message;
        }).catch(function () {
          if (!stillCurrent()) return;
          loadAttachmentsSoft(it);
          var st = panel.querySelector('.hist-detail-status');
          if (st) st.textContent = '已用列表摘要顯示；完整備註稍後再試。';
        });
      }

      function toggleHistoryDetail(div, it) {

      /**
       * 列表只依新增時間（recorded_at）新→舊；無戳記排最後。
       * 絕不用 txn_date／date_iso／分頁名——那會看起來像依交易日排。
       */
      function sortHistoryByRecordedAtOnly(items) {
        var list = (items || []).slice();
        list.sort(function (a, b) {
          var ra = String((a && a.recorded_at) || '').trim();
          var rb = String((b && b.recorded_at) || '').trim();
          if (ra && rb) return rb.localeCompare(ra);
          if (ra && !rb) return -1;
          if (!ra && rb) return 1;
          // 無戳記：保持後端給的相對序（掃表寫入近似），不要改用交易日
          return 0;
        });
        return list;
      }

          div.addEventListener('click', function (e) {

            toggleHistoryDetail(div, it);

      var HISTORY_DEFAULT_DAYS = 7;
      var HISTORY_MAX_DAYS = 30;

      function toIsoLocal(d) {
        var y = d.getFullYear();
        var m = String(d.getMonth() + 1);
        var day = String(d.getDate());
        if (m.length < 2) m = '0' + m;
        if (day.length < 2) day = '0' + day;
        return y + '-' + m + '-' + day;
      }

      function addDaysIso(iso, delta) {
        var p = String(iso || '').split('-');
        if (p.length < 3) return '';
        var dt = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
        dt.setDate(dt.getDate() + delta);
        return toIsoLocal(dt);
      }

      function inclusiveDays(from, to) {
        var a = String(from || '').split('-');
        var b = String(to || '').split('-');
        if (a.length < 3 || b.length < 3) return 0;
        var da = new Date(parseInt(a[0], 10), parseInt(a[1], 10) - 1, parseInt(a[2], 10));
        var db = new Date(parseInt(b[0], 10), parseInt(b[1], 10) - 1, parseInt(b[2], 10));
        return Math.floor((db - da) / 86400000) + 1;
      }

      function historyWindowForDays(days) {
        var span = Math.max(1, Math.min(parseInt(days, 10) || HISTORY_DEFAULT_DAYS, HISTORY_MAX_DAYS));
        var to = toIsoLocal(new Date());
        var from = addDaysIso(to, -(span - 1));
        return { from: from, to: to, days: span };
      }

      function defaultHistoryWindow() {
        return historyWindowForDays(HISTORY_DEFAULT_DAYS);
      }

      function applyHistoryDates(days) {
        var w = historyWindowForDays(days == null ? HISTORY_DEFAULT_DAYS : days);
        document.getElementById('histDateFrom').value = w.from;
        document.getElementById('histDateTo').value = w.to;
        return w;
      }

      function applyDefaultHistoryDates() {
        return applyHistoryDates(HISTORY_DEFAULT_DAYS);
      }

      /** 暫緩強制僅限個人：預設關＝≥3 可看全部；開關為選用篩選 */
      function resetMineOnlyDefault() {
        document.getElementById('historyMineOnly').checked = false;
        syncMineToggleUi();
      }

      function clampHistoryDatesInInputs() {
        var dateFrom = (document.getElementById('histDateFrom').value || '').trim();
        var dateTo = (document.getElementById('histDateTo').value || '').trim();
        var w = defaultHistoryWindow();
        if (!dateTo) dateTo = w.to;
        if (!dateFrom) dateFrom = addDaysIso(dateTo, -(HISTORY_DEFAULT_DAYS - 1));
        if (dateFrom > dateTo) {
          var tmp = dateFrom;
          dateFrom = dateTo;
          dateTo = tmp;
        }
        if (inclusiveDays(dateFrom, dateTo) > HISTORY_MAX_DAYS) {
          dateFrom = addDaysIso(dateTo, -(HISTORY_MAX_DAYS - 1));
        }
        document.getElementById('histDateFrom').value = dateFrom;
        document.getElementById('histDateTo').value = dateTo;
        return { from: dateFrom, to: dateTo };
      }

      function syncMineToggleUi() {
        var on = !!document.getElementById('historyMineOnly').checked;
        var btn = document.getElementById('historyMineToggle');
        var state = document.getElementById('historyMineState');
        var sub = document.getElementById('historyMineSub');
        var hint = document.getElementById('pageModeHint');
        if (btn) {
          btn.classList.toggle('is-on', on);
          btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        }
        if (state) state.textContent = on ? '開' : '關';
        if (sub) {
          sub.textContent = on
            ? '開啟中：只顯示登入帳號本人記入的帳。關閉後回到區間內全部人。'
            : '關閉中：顯示區間內全部人記入的帳。需要時再開啟只看本人。';
        }
        if (hint) {
          hint.innerHTML = on
            ? '目前為<strong>只看我記的</strong>（選用篩選）＋近 7 天區間。列表<strong>只依新增時間（按下送出）</strong>新→舊，不是交易日。需權限 ≥3。'
            : '權限 ≥3 可查<strong>區間內全部人</strong>的帳。預設近 7 天；列表<strong>只依新增時間（按下送出）</strong>新→舊，不是交易日。「只看我記的」為選用篩選（暫不強制）。點一筆可看案號、圖片集。';
        }
      }

      function readHistoryFilters() {
        var dates = clampHistoryDatesInInputs();
        var type = (document.getElementById('histType').value || '').trim();
        var keyword = (document.getElementById('histKeyword').value || '').trim();
        var amountRaw = (document.getElementById('histAmount').value || '').trim();
        var mineOnly = !!document.getElementById('historyMineOnly').checked;
        // 不傳 months：分頁依交易日存放，掃幾個月由後端依記帳時間窗決定（避免近7天只掃1月漏倒填）
        var filters = {
          limit: 50,
          mine_only: mineOnly,
          date_from: dates.from,
          date_to: dates.to
        };
        if (type) filters.type = type;
        if (keyword) filters.keyword = keyword;
        if (amountRaw !== '') {
          var amt = parseInt(amountRaw, 10);
          if (!isNaN(amt)) filters.amount = amt;
        }
        return filters;
      }

      function clearHistoryFilters() {
        applyDefaultHistoryDates();
        document.getElementById('histType').value = '';
        document.getElementById('histKeyword').value = '';
        document.getElementById('histAmount').value = '';
        resetMineOnlyDefault();
      }

      function renderEmptyExpandActions(mineOnly, from, to) {
        var span = inclusiveDays(from, to);
        var actions = document.createElement('div');
        actions.className = 'hist-actions';
        actions.style.marginTop = '8px';
        if (span < HISTORY_MAX_DAYS) {
          var btn30 = document.createElement('button');
          btn30.type = 'button';
          btn30.className = 'btn-ghost btn-primary-hist';
          btn30.textContent = '改查近 ' + HISTORY_MAX_DAYS + ' 天';
          btn30.addEventListener('click', function () {
            applyHistoryDates(HISTORY_MAX_DAYS);
            loadLedgerHistory();
          });
          actions.appendChild(btn30);
        }
        if (mineOnly) {
          var btnAll = document.createElement('button');
          btnAll.type = 'button';
          btnAll.className = 'btn-ghost';
          btnAll.textContent = '開啟所有人紀錄';
          btnAll.addEventListener('click', function () {
            document.getElementById('historyMineOnly').checked = false;
            syncMineToggleUi();
            loadLedgerHistory();
          });
          actions.appendChild(btnAll);
        }
        var btnReset = document.createElement('button');
        btnReset.type = 'button';
        btnReset.className = 'btn-ghost';
        btnReset.textContent = '重設近 7 天';
        btnReset.addEventListener('click', function () {
          clearHistoryFilters();
          loadLedgerHistory();
        });
        actions.appendChild(btnReset);
        return actions;
      }

      function loadLedgerHistory() {
        setStatus('查詢中…', 'ok');
        document.getElementById('historyList').innerHTML = '';
        clearSideDetail();
        if (!sessionRef || typeof AccountingApi.accountingLedgerRecent !== 'function') {
          setStatus('尚無法載入歷史（請從主控台／LINE 登入後再試）。', 'error');
          return Promise.resolve();
        }
        var filters = readHistoryFilters();
        return AccountingApi.accountingLedgerRecent(sessionRef, filters).then(function (data) {
          if (!data || data.success === false) {
            setStatus((data && data.message) || '讀不到歷史記帳紀錄', 'error');
            document.getElementById('historyList').innerHTML = '';
            return;
          }
          var n = (data.items || []).length;
          var from = data.date_from || filters.date_from || '…';
          var to = data.date_to || filters.date_to || '…';
          // 空狀態標籤必須跟後端實際 mine_only 一致，避免誤寫「全部人／所有人」
          var mineOnly = data.mine_only !== undefined ? !!data.mine_only : !!filters.mine_only;
          var bits = [mineOnly ? '只看我記的' : '所有人紀錄', from + '～' + to];
          if (filters.type) bits.push(filters.type);
          if (filters.keyword) bits.push('「' + filters.keyword + '」');
          if (filters.amount != null) bits.push('$' + filters.amount);
          var listEl = document.getElementById('historyList');
          if (n) {
            setStatus('共 ' + n + ' 筆（依新增時間＝你送出的時間，新到舊；不是交易日） · ' + bits.join(' · '), 'ok');
            // 只依 recorded_at：後端已排；前端再防禦一次（LINE 舊 JS／誤排兜底）。禁止 txn_date。
            renderHistoryItems(sortHistoryByRecordedAtOnly(data.items || []));
          } else {
            var hint = (data.empty_hint && String(data.empty_hint).trim())
              || (mineOnly
                ? ('這段記帳時間沒有你送出的帳。可改查近 ' + HISTORY_MAX_DAYS + ' 天，或（需要時）開啟所有人紀錄。')
                : ('這段記帳時間沒有符合條件的帳。可改查近 ' + HISTORY_MAX_DAYS + ' 天，或改關鍵字後再查。'));
            setStatus(hint + '（' + bits.join(' · ') + '）', 'empty');
            listEl.innerHTML = '';
            listEl.appendChild(renderEmptyExpandActions(mineOnly, from, to));
          }
        }).catch(function (e) {
          var msg = (e && e.message) || '讀不到歷史記帳紀錄';
          if (/逾時|timeout|Abort|abort|等太久/i.test(msg)) {
            msg = '查詢逾時。請稍後再按「查詢」；若仍失敗請回報（正式站修復部署後會較快）。';
          }
          setStatus(msg, 'error');
          document.getElementById('historyList').innerHTML = '';
        });
      }

      function bindFilters() {
        document.getElementById('historyMineToggle').addEventListener('click', function () {
          var box = document.getElementById('historyMineOnly');
          box.checked = !box.checked;
          syncMineToggleUi();
          loadLedgerHistory();
        });
        document.getElementById('historyRefreshBtn').addEventListener('click', function () {
          loadLedgerHistory();
        });
        document.getElementById('historySearchBtn').addEventListener('click', function () {
          loadLedgerHistory();
        });
        document.getElementById('historyClearBtn').addEventListener('click', function () {
          clearHistoryFilters();
          loadLedgerHistory();
        });
        document.getElementById('historyExpand30Btn').addEventListener('click', function () {
          applyHistoryDates(HISTORY_MAX_DAYS);
          loadLedgerHistory();
        });
        document.getElementById('histKeyword').addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            loadLedgerHistory();
          }
        });
        if (window.matchMedia) {
          window.matchMedia('(min-width: 900px)').addEventListener('change', function () {
            if (!openHistoryKey) return;
            var it = itemsByKey[openHistoryKey];
            if (!it) return;
            var row = null;
            Array.prototype.forEach.call(document.querySelectorAll('.hist-item'), function (el) {
              if (el.dataset.key === openHistoryKey) row = el;
            });
            if (row) {
              clearRowSelection();
              row.classList.add('is-open');
              loadHistoryDetailForItem(row, it);
            }
          });
        }
      }

      (async function boot() {
        applyDefaultHistoryDates();
        resetMineOnlyDefault();
        bindFilters();
        await AccountingBoot.run({
          minPermission: AccountingApi.SUPERVISOR_MIN_PERMISSION,
          deniedMsg: '歷史記帳紀錄需主管權限（≥3）',
          preloadBootstrap: false,
          onReady: async function (sess) {
            sessionRef = sess;
            resetMineOnlyDefault();
            await loadLedgerHistory();
          }
        });
      })();
    })();
  </script>
</body>
</html>
