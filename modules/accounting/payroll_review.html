<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>薪資審核</title>
  <link rel="stylesheet" href="../../shared/css/accounting_layout.css?v=5" />
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="../../shared/js/operator_context.js?v=3"></script>
  <script src="../../shared/js/accounting_api.js?v=103"></script>
  <script src="../../shared/js/hub_ref_cache.js?v=2"></script>
  <script src="../../shared/js/accounting_list_cache.js?v=7"></script>
  <script src="../../shared/js/accounting_action_queue.js?v=1"></script>
  <script src="../../shared/js/accounting_ui.js?v=25"></script>
  <script src="../../shared/js/accounting_nav.js?v=2"></script>
  <script src="../../shared/js/accounting_boot.js?v=9"></script>
  <script src="../../shared/js/tax_withhold.js?v=1"></script>
  <script src="../../shared/js/payroll_bonus_categories.js?v=1"></script>
  <style>
    h2 { margin: 0 0 8px; }
    .sub { color: #555; font-size: 14px; line-height: 1.45; }
    .card { background: #fff; border-radius: 12px; padding: 14px; margin: 12px 0; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    label { display: block; margin-top: 8px; font-weight: 600; font-size: 14px; }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { padding: 10px 14px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-primary { background: #1a73e8; color: #fff; }
    .btn-ok { background: #34a853; color: #fff; }
    .btn-warn { background: #ea4335; color: #fff; }
    .btn-block { width: 100%; margin-top: 10px; padding: 12px; }
    .item { border: 1px solid #e8eaed; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: #e8f0fe; margin-right: 6px; }
    .tag.warn { background: #fce8e6; color: #c5221f; }
    .amount { font-size: 20px; font-weight: 700; color: #1a73e8; margin: 4px 0; }
    .bank { font-size: 13px; color: #444; margin-top: 6px; }
    .review-panel { margin-top: 12px; padding-top: 12px; border-top: 1px dashed #ddd; }
    #msg { color: #c5221f; font-size: 14px; margin: 8px 0; }
    #ok { color: #137333; font-size: 14px; margin: 8px 0; }
    .hidden { display: none; }
    #listLive { margin-left: 8px; font-weight: 600; color: #1a73e8; }
    .nav { margin-bottom: 12px; font-size: 14px; }
    .nav a { color: #1a73e8; text-decoration: none; }
    .item.is-anomaly { background: #fff8e6; border-color: #f9ab00; box-shadow: 0 0 0 1px #f9ab00 inset; }
    .item.is-normal-collapsed .review-panel,
    .item.is-normal-collapsed .att-calendar,
    .item.is-normal-collapsed .att-extra { display: none; }
    .att-line { font-size: 13px; margin: 6px 0; color: #333; }
    .att-line .att-warn { color: #b06000; font-weight: 600; }
    .att-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; font-size: 11px; }
    .att-cal-cell { border: 1px solid #e8eaed; border-radius: 6px; padding: 4px 2px; text-align: center; background: #fafafa; min-height: 36px; }
    .att-cal-cell.hl { background: #fce8e6; border-color: #ea4335; color: #c5221f; font-weight: 600; }
    .att-cal-cell.work { background: #e6f4ea; }
    .att-cal-cell.rest { background: #f1f3f4; color: #666; }
    .att-cal-cell.leave { background: #e8f0fe; }
    .att-gate { background: #fff8e6; border: 1px solid #f9ab00; border-radius: 8px; padding: 10px 12px; margin: 8px 0; font-size: 14px; color: #8a5a00; }
    .name-btn { background: none; border: none; padding: 0; font: inherit; font-weight: 700; color: #1a73e8; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body class="acct-page acct-page-form">
  <div id="loading">載入中…</div>
  <div id="app" class="hidden acct-main">
    <p class="nav"><a href="index.html">← 會計功能選單</a></p>
    <h2>薪資審核</h2>
    <p class="sub" id="userLine">—</p>
    <p class="sub">員工自審或主管代開審後會出現在這裡。核准後由財務在「薪資待匯款」決定薪轉與額外發放金額。</p>
    <div id="msg" role="alert"></div>
    <div id="ok" aria-live="polite"></div>

    <div class="card">
      <div class="row2">
        <div>
          <label>審核狀態</label>
          <select id="filterReview">
            <option value="pending_review" selected>待審</option>
            <option value="approved">已審（待匯款）</option>
            <option value="rejected">已退回</option>
            <option value="">全部</option>
          </select>
        </div>
        <div>
          <label>姓名／期別</label>
          <input id="filterKw" placeholder="例：張三、115/05" />
        </div>
      </div>
      <button type="button" class="btn btn-primary btn-block" id="reloadBtn" title="略過暫存，立刻向後端重抓最新清單">重新載入最新</button>
    </div>

    <div id="attGateBanner" class="att-gate hidden" role="status"></div>
    <div class="card">
      <h3 style="margin:0 0 8px">待審列表<span id="listLive" class="sub"></span></h3>
      <p class="sub" style="margin:0 0 8px">異常（黃底）置頂；點姓名展開當月日曆。每人先「確認出勤」，全員確認後才能核准。</p>
      <div id="list"></div>
      <p id="emptyMsg" class="sub hidden">目前沒有待審薪資。</p>
    </div>
  </div>
  <script>
    (function () {
      var session = null;
      var lastRenderedCacheKey = '';
      /** 本頁已核准／退回的 id：擋住 SWR 背景重抓把卡片又刷回待審 */
      var dismissedPendingIds = Object.create(null);
      var ui = AccountingUi.feedback();
      function setMsg(t) { ui.setMsg(t); }
      function setOk(t) { ui.setOk(t); }
      function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

      function bankLine(row) {
        if (row.bank_incomplete) return '<span class="tag warn">銀行帳戶不完整，請至員工資料維護</span>';
        var ac = String(row.account_no || '');
        var tail = ac.length > 4 ? ac.slice(-4) : ac;
        return '銀行 ' + esc(row.bank_code) + ' · 帳號末四碼 ' + esc(tail) + ' · ' + esc(row.account_name);
      }

      function lineItemsHtml(rows, sign) {
        if (!rows || !rows.length) return '<p class="sub">—</p>';
        return '<ul style="margin:4px 0;padding-left:18px;font-size:13px">' + rows.map(function (row) {
          var amt = parseInt(row.amount, 10) || 0;
          var note = row.note ? ' <span style="color:#777">（' + esc(row.note) + '）</span>' : '';
          var amtText = amt > 0 ? (sign + amt.toLocaleString('zh-TW')) : '—';
          return '<li style="margin:2px 0"><span>' + esc(row.label) + note + '</span> <strong>' + amtText + '</strong></li>';
        }).join('') + '</ul>';
      }

      function isEditableDeductionLabel(label) {
        var s = String(label || '');
        if (!s) return false;
        if (s.indexOf('其他扣款') >= 0) return false;
        return true;
      }

      function editableDeductionsHtml(deductions, prId) {
        if (!deductions || !deductions.length) return '<p class="sub">—</p>';
        return '<ul style="margin:4px 0;padding-left:0;list-style:none;font-size:13px">' + deductions.map(function (row, idx) {
          var amt = parseInt(row.amount, 10) || 0;
          var note = row.note ? '<span style="color:#777;display:block;font-size:12px">' + esc(row.note) + '</span>' : '';
          if (!isEditableDeductionLabel(row.label)) {
            var amtText = amt > 0 ? '−' + amt.toLocaleString('zh-TW') : '—';
            return '<li style="margin:4px 0;padding:6px 0;border-bottom:1px solid #f0f0f0"><span>' + esc(row.label) + '</span> <strong style="float:right">' + amtText + '</strong>' + note + '</li>';
          }
          return '<li style="margin:4px 0;padding:6px 0;border-bottom:1px solid #f0f0f0">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">' +
            '<span>' + esc(row.label) + '</span>' +
            '<span style="display:flex;align-items:center;gap:4px;white-space:nowrap">−' +
            '<input type="number" class="ded-line-input" min="0" step="1" ' +
            'data-pr="' + prId + '" data-idx="' + idx + '" data-orig="' + amt + '" data-label="' + esc(row.label) + '" ' +
            'value="' + amt + '" style="width:96px;padding:6px;border:1px solid #ccc;border-radius:6px;font-size:14px" />' +
            '</span></div>' + note + '</li>';
        }).join('') + '</ul>' +
          '<p class="sub" style="margin:4px 0 0;color:#666">減項有異議可直接改金額；實發會自動重算。請在審核備註寫原因。</p>';
      }

      function parseTaxWithholdFromRow(row) {
        var snap = row && (row.tax_withhold || row.taxWithhold);
        if (snap) return snap;
        try {
          var raw = row && row.stats_snapshot;
          if (typeof raw === 'string') raw = JSON.parse(raw || '{}');
          return (raw && raw.taxWithhold) || {};
        } catch (e) {
          return {};
        }
      }

      function bonusTaxExtras(prId, bonus) {
        var root = document.getElementById('pr-' + prId);
        if (!root || typeof TaxWithhold === 'undefined') return { bonusTax: 0, nhi: 0 };
        var insured = parseInt(root.getAttribute('data-insured'), 10) || 0;
        var ytd = parseInt(root.getAttribute('data-ytd-bonus'), 10) || 0;
        var bonusTax = TaxWithhold.calcBonusTax(bonus).tax || 0;
        var nhi = TaxWithhold.calcNhiSupplementary({
          bonusAmount: bonus,
          insuredSalaryLevel: insured,
          ytdBonusPaid: ytd
        }).premium || 0;
        return { bonusTax: bonusTax, nhi: nhi };
      }

      function recalcFinalAmount(prId) {
        var root = document.getElementById('pr-' + prId);
        if (!root) return;
        var est = parseInt(root.getAttribute('data-est'), 10) || 0;
        var bonusEl = document.getElementById('bonus-' + prId);
        var dedEl = document.getElementById('ded-' + prId);
        var finalEl = document.getElementById('est-display-' + prId);
        var taxHint = document.getElementById('tax-hint-' + prId);
        if (!finalEl) return;
        var bonus = Number(bonusEl && bonusEl.value) || 0;
        var otherDed = Number(dedEl && dedEl.value) || 0;
        var delta = 0;
        root.querySelectorAll('.ded-line-input').forEach(function (inp) {
          var orig = parseInt(inp.getAttribute('data-orig'), 10) || 0;
          var now = Math.max(0, parseInt(inp.value, 10) || 0);
          delta += (orig - now);
        });
        var extra = bonusTaxExtras(prId, bonus);
        if (taxHint) {
          if (extra.bonusTax > 0 || extra.nhi > 0) {
            taxHint.textContent = '獎金另扣：所得稅 ' + extra.bonusTax.toLocaleString('zh-TW') +
              ' ＋補充保費 ' + extra.nhi.toLocaleString('zh-TW');
            taxHint.classList.remove('hidden');
          } else {
            taxHint.textContent = '';
            taxHint.classList.add('hidden');
          }
        }
        finalEl.textContent = Math.max(0, est + delta + bonus - otherDed - extra.bonusTax - extra.nhi).toLocaleString('zh-TW');
      }

      function collectDeductionOverrides(prId) {
        var root = document.getElementById('pr-' + prId);
        if (!root) return [];
        var out = [];
        root.querySelectorAll('.ded-line-input').forEach(function (inp) {
          var orig = parseInt(inp.getAttribute('data-orig'), 10) || 0;
          var now = Math.max(0, parseInt(inp.value, 10) || 0);
          if (now === orig) return;
          out.push({
            label: inp.getAttribute('data-label') || '',
            original_amount: orig,
            amount: now,
            idx: parseInt(inp.getAttribute('data-idx'), 10)
          });
        });
        return out;
      }

      function projectRewardHtml(row) {
        var items = row.project_rewards || row.margin_bonus_drafts || [];
        if (!items.length) return '';
        var total = parseInt(row.project_reward_total, 10) || items.reduce(function (s, d) {
          return s + (parseInt(d.amount, 10) || 0);
        }, 0);
        var lis = items.map(function (d) {
          var start = d.start_date || '—';
          var close = d.close_date || '—';
          var note = d.note ? '（' + esc(d.note) + '）' : '';
          return '<li>案號 ' + esc(d.project_no) + '：' + (parseInt(d.amount,10)||0).toLocaleString('zh-TW') +
            ' 元 · 施工 ' + esc(start) + '～結案 ' + esc(close) + note + '</li>';
        }).join('');
        return '<div style="margin-top:8px;padding:8px;background:#fff8e8;border-radius:8px;border:1px solid #f0e0b8">' +
          '<p class="sub" style="margin:0 0 4px;font-weight:600;color:#8a5a00">專案報酬（合計 ' + total.toLocaleString('zh-TW') + ' 元，不併入本月薪資）</p>' +
          '<ul style="margin:0;padding-left:18px;font-size:13px">' + lis + '</ul></div>';
      }

      function attendanceCalendarHtml(ac, prId) {
        var days = (ac && ac.calendarDays) || [];
        if (!days.length) {
          return '<p class="sub att-extra">此單無逐日班表快照（舊單據）；請對照出勤儀表。新送審單會帶日曆。</p>';
        }
        var cells = days.map(function (d) {
          var dayNum = String(d.date || '').slice(-2);
          var cls = 'att-cal-cell ' + esc(d.kind || '');
          if (d.highlight) cls += ' hl';
          var tip = esc(d.status || d.kind || '');
          return '<div class="' + cls + '" title="' + tip + '"><div>' + esc(dayNum) + '</div><div style="font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
            tip + '</div></div>';
        }).join('');
        return '<div class="att-calendar hidden" id="cal-' + prId + '">' +
          '<p class="sub" style="margin:8px 0 4px;font-weight:600">當月出勤日曆（紅框＝異常日）</p>' +
          '<div class="att-cal-grid">' + cells + '</div></div>';
      }

      function attendanceBlockHtml(row) {
        var ac = row.attendance_check || {};
        var line = ac.summaryLine ||
          ('應上 ' + (ac.expectedWorkDays || 0) + '｜實上 ' + (ac.actualAttendanceDays || 0) +
            '｜假別天數 ' + (ac.leaveDays || 0) + '｜缺卡 ' + (ac.missingPunchDays || 0));
        var reasons = (ac.anomalyReasons || []).join('、');
        var confirmed = !!ac.confirmed;
        var confBtn = confirmed
          ? '<span class="tag" style="background:#e6f4ea;color:#137333">出勤已確認</span>'
          : '<button type="button" class="btn btn-primary" data-att-confirm="' + row.payroll_request_id + '">確認出勤</button>';
        return '<div class="att-line">' + esc(line) +
          (ac.isAnomalous ? ' <span class="att-warn">· 異常：' + esc(reasons || '需核對') + '</span>' : ' <span class="tag">正常</span>') +
          '</div>' +
          '<div class="att-extra" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0">' +
          confBtn +
          (confirmed && ac.confirmedBy ? '<span class="sub">確認人 ' + esc(ac.confirmedBy) + '</span>' : '') +
          '</div>' +
          attendanceCalendarHtml(ac, row.payroll_request_id);
      }

      function renderItem(row) {
        var div = document.createElement('div');
        var ac = row.attendance_check || {};
        var isAnom = !!ac.isAnomalous;
        div.className = 'item' + (isAnom ? ' is-anomaly' : ' is-normal-collapsed');
        div.id = 'pr-' + row.payroll_request_id;
        div.setAttribute('data-att-confirmed', ac.confirmed ? '1' : '0');
        var est = parseInt(row.estimated_net, 10) || 0;
        div.setAttribute('data-est', String(est));
        var tw = parseTaxWithholdFromRow(row);
        div.setAttribute('data-insured', String(parseInt(tw.insuredSalaryLevel, 10) || 0));
        div.setAttribute('data-ytd-bonus', String(parseInt(tw.ytdBonusPaid, 10) || 0));
        var ot = Number(row.overtime_hours) || 0;
        var remote = parseInt(row.remote_allowance, 10) || 0;
        var pb = row.payroll_breakdown || {};
        var additions = pb.additions || [];
        var deductions = pb.deductions || [];
        var companyCosts = pb.companyCosts || [];
        var companyCostTotal = parseInt(pb.companyCostTotal, 10) || companyCosts.reduce(function (s, x) {
          return s + (parseInt(x.amount, 10) || 0);
        }, 0);
        var selfTag = row.employee_self_reviewed === false
          ? '<span class="tag warn">主管代開</span>'
          : '<span class="tag">員工自審</span>';
        var breakdownBlock = '';
        if (additions.length || deductions.length || companyCosts.length) {
          var companyBlock = '';
          if (companyCosts.length) {
            companyBlock =
              '<div style="margin-top:8px;padding:8px;background:#f8fafc;border-radius:8px;border:1px solid #e2e8f0">' +
              '<p class="sub" style="font-weight:600;color:#334155;margin:0 0 4px">公司成本（雇主負擔・不影響實發）</p>' +
              lineItemsHtml(companyCosts, '') +
              '<p class="sub" style="text-align:right;margin:4px 0 0;font-weight:600">小計 ' +
              companyCostTotal.toLocaleString('zh-TW') + ' 元</p></div>';
          }
          breakdownBlock =
            '<div class="row2" style="margin-top:8px">' +
            '<div><p class="sub" style="font-weight:600;color:#137333;margin:0">加項</p>' + lineItemsHtml(additions, '+') + '</div>' +
            '<div><p class="sub" style="font-weight:600;color:#c5221f;margin:0">減項（可改）</p>' + editableDeductionsHtml(deductions, row.payroll_request_id) + '</div>' +
            '</div>' + companyBlock;
        }
        var approveDisabled = !ac.confirmed ? ' disabled title="請先確認出勤；且須全員確認後才能核准"' : '';
        div.innerHTML =
          '<div><button type="button" class="name-btn" data-toggle-cal="' + row.payroll_request_id + '">' + esc(row.employee_name) + '</button>' +
          ' <span class="tag">' + esc(row.period_label) + '</span> ' + selfTag +
          (isAnom ? ' <span class="tag warn">出勤異常</span>' : '') + '</div>' +
          attendanceBlockHtml(row) +
          '<p class="amount">試算實發 <span id="est-display-' + row.payroll_request_id + '">' + est.toLocaleString('zh-TW') + '</span> 元</p>' +
          '<p class="sub">期間 ' + esc(row.period_start) + '～' + esc(row.period_end) + ' · 發薪日 ' + esc(row.pay_date) + '</p>' +
          (ot > 0 ? '<p class="sub">加班 ' + ot + ' 小時</p>' : '') +
          (remote > 0 ? '<p class="sub">遠程津貼 ' + remote.toLocaleString('zh-TW') + ' 元</p>' : '') +
          (row.supplement_note ? '<p class="sub">補充／減項備註：' + esc(row.supplement_note) + '</p>' : '') +
          breakdownBlock +
          projectRewardHtml(row) +
          '<div class="bank">' + bankLine(row) + '</div>' +
          '<div class="review-panel">' +
          '<div class="row2">' +
          '<div><label>獎金類別</label><select id="bcat-' + row.payroll_request_id + '">' +
          ((typeof PayrollBonusCategories !== 'undefined')
            ? PayrollBonusCategories.optionsHtml('', window.__payrollBonusCategories)
            : '<option value="">選擇類別</option>') +
          '</select></div>' +
          '<div><label>獎金（元）</label><input type="number" id="bonus-' + row.payroll_request_id + '" class="recalc-final" min="0" step="1" value="0" /></div>' +
          '</div>' +
          '<div class="row2">' +
          '<div><label>其他扣款（元）</label><input type="number" id="ded-' + row.payroll_request_id + '" class="recalc-final" min="0" step="1" value="' + (parseInt(row.deduction,10)||0) + '" /></div>' +
          '<div><label>獎金備註</label><input type="text" id="bnote-' + row.payroll_request_id + '" placeholder="選填（勿填專案報酬）" value="" /></div>' +
          '</div>' +
          '<p id="tax-hint-' + row.payroll_request_id + '" class="sub hidden" style="color:#8a5a00;margin:6px 0 0"></p>' +
          '<label>審核備註</label><input type="text" id="note-' + row.payroll_request_id + '" placeholder="減項有改請寫原因" value="' + esc(row.supplement_note || '') + '" />' +
          '<p class="sub" style="margin-top:8px">薪轉／額外金額請至「薪資待匯款」調整。出勤核對只顯示警示，不自動加金額或加班。</p>' +
          '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">' +
          '<button type="button" class="btn btn-ok" data-approve="' + row.payroll_request_id + '"' + approveDisabled + '>核准</button>' +
          '<button type="button" class="btn btn-warn" data-reject="' + row.payroll_request_id + '">退回</button>' +
          '</div></div>';
        return div;
      }

      function renderReadOnlyItem(row) {
        var div = document.createElement('div');
        div.className = 'item';
        var amount = parseInt(row.final_amount, 10) || parseInt(row.estimated_net, 10) || 0;
        div.innerHTML =
          '<div><strong>' + esc(row.employee_name) + '</strong> <span class="tag">' + esc(row.period_label) + '</span> ' +
          '<span class="tag">' + esc(row.review_status) + '</span></div>' +
          '<p class="amount">$' + amount.toLocaleString('zh-TW') + '</p>' +
          (row.reject_reason ? '<p class="sub">退回原因：' + esc(row.reject_reason) + '</p>' : '') +
          (row.bonus_note ? '<p class="sub">備註：' + esc(row.bonus_note) + '</p>' : '');
        return div;
      }

      function listCacheKey() {
        return 'payroll_review:' + (document.getElementById('filterReview').value || 'pending_review') + ':' +
          document.getElementById('filterKw').value.trim();
      }

      function hasRenderedItems() {
        return !!document.querySelector('#list .item');
      }

      function setUpdating(on) {
        var el = document.getElementById('listLive');
        if (el) el.textContent = on ? '更新中…' : '';
      }

      var lastAttendanceGate = null;

      /** 蒐集尚未核准的審核欄位（確認出勤／標記異議後重繪時還原，避免草稿被洗掉） */
      function captureReviewDrafts_() {
        var out = Object.create(null);
        document.querySelectorAll('#list .item[id^="pr-"]').forEach(function (card) {
          var id = String(card.id || '').replace(/^pr-/, '');
          if (!id) return;
          var draft = { fields: {}, ded: [] };
          ['bonus-', 'bcat-', 'ded-', 'bnote-', 'note-'].forEach(function (prefix) {
            var el = document.getElementById(prefix + id);
            if (el) draft.fields[prefix] = el.value;
          });
          card.querySelectorAll('.ded-line-input').forEach(function (inp) {
            draft.ded.push({
              idx: inp.getAttribute('data-idx'),
              label: inp.getAttribute('data-label') || '',
              value: inp.value
            });
          });
          out[id] = draft;
        });
        return out;
      }

      function restoreReviewDrafts_(drafts) {
        if (!drafts) return;
        Object.keys(drafts).forEach(function (id) {
          var draft = drafts[id];
          if (!draft) return;
          Object.keys(draft.fields || {}).forEach(function (prefix) {
            var el = document.getElementById(prefix + id);
            if (el) el.value = draft.fields[prefix];
          });
          (draft.ded || []).forEach(function (d) {
            var inp = document.querySelector(
              '#pr-' + id + ' .ded-line-input[data-idx="' + String(d.idx) + '"]'
            );
            if (!inp && d.label) {
              inp = document.querySelector(
                '#pr-' + id + ' .ded-line-input[data-label="' + String(d.label).replace(/"/g, '\\"') + '"]'
              );
            }
            if (inp) inp.value = d.value;
          });
          var bonusEl = document.getElementById('bonus-' + id);
          if (bonusEl && typeof bonusEl.dispatchEvent === 'function') {
            bonusEl.dispatchEvent(new Event('input', { bubbles: true }));
          }
        });
      }

      function refreshAttendanceGateFromDom_() {
        var filterVal = document.getElementById('filterReview').value || 'pending_review';
        if (filterVal !== 'pending_review') {
          applyAttendanceGate(null, filterVal);
          return;
        }
        var cards = document.querySelectorAll('#list .item[id^="pr-"]');
        var unconfirmed = 0;
        cards.forEach(function (card) {
          if (card.getAttribute('data-att-confirmed') !== '1') unconfirmed += 1;
        });
        applyAttendanceGate({
          all_confirmed: unconfirmed === 0,
          unconfirmed_count: unconfirmed,
          message: unconfirmed > 0
            ? ('尚有 ' + unconfirmed + ' 人未確認出勤，全部確認後才能核准薪資')
            : ''
        }, filterVal);
      }

      function markAttendanceConfirmedInPlace_(prId, ac) {
        var card = document.getElementById('pr-' + prId);
        if (!card) return;
        card.setAttribute('data-att-confirmed', '1');
        var extra = card.querySelector('.att-extra');
        if (extra) {
          var by = (ac && ac.confirmedBy) ? String(ac.confirmedBy) : '';
          extra.innerHTML =
            '<span class="tag" style="background:#e6f4ea;color:#137333">出勤已確認</span>' +
            (by ? '<span class="sub">確認人 ' + esc(by) + '</span>' : '');
        }
        if (typeof AccountingListCache !== 'undefined') {
          AccountingListCache.patch(session, listCacheKey(), function (data) {
            if (!data || !data.items) return;
            data.items.forEach(function (row) {
              if (String(row.payroll_request_id) !== String(prId)) return;
              row.attendance_check = row.attendance_check || {};
              row.attendance_check.confirmed = true;
              if (ac) {
                row.attendance_check.confirmedAt = ac.confirmedAt || row.attendance_check.confirmedAt;
                row.attendance_check.confirmedBy = ac.confirmedBy || row.attendance_check.confirmedBy;
              }
            });
          });
        }
        refreshAttendanceGateFromDom_();
      }

      function applyAttendanceGate(gate, filterVal) {
        var banner = document.getElementById('attGateBanner');
        if (!banner) return;
        if (filterVal !== 'pending_review' || !gate) {
          banner.classList.add('hidden');
          lastAttendanceGate = null;
          return;
        }
        lastAttendanceGate = gate;
        if (gate.all_confirmed) {
          banner.classList.add('hidden');
          banner.textContent = '';
        } else {
          banner.textContent = gate.message || ('尚有 ' + (gate.unconfirmed_count || 0) + ' 人未確認出勤，全部確認後才能核准薪資');
          banner.classList.remove('hidden');
        }
        document.querySelectorAll('#list [data-approve]').forEach(function (btn) {
          var root = btn.closest('.item');
          var rowOk = root && root.getAttribute('data-att-confirmed') === '1';
          var allOk = !!gate.all_confirmed;
          btn.disabled = !(rowOk && allOk);
          btn.title = btn.disabled
            ? (allOk ? '請先確認此員出勤' : '尚有人未確認出勤，全部確認後才能核准')
            : '';
        });
      }

      function applyListData(data, keepExisting) {
        var list = document.getElementById('list');
        var emptyMsg = document.getElementById('emptyMsg');
        if (!data || !data.success) {
          var failMsg = (data && data.message) || '載入失敗，請再試';
          emptyMsg.classList.add('hidden');
          if (keepExisting && hasRenderedItems()) {
            setMsg(failMsg + '（仍顯示先前內容）');
            return;
          }
          setMsg(failMsg);
          list.innerHTML = '<p class="sub">載入失敗，請按「重新載入最新」再試。</p>';
          return;
        }
        setMsg('');
        list.innerHTML = '';
        if (data.bonus_categories && data.bonus_categories.length) {
          window.__payrollBonusCategories = data.bonus_categories;
        }
        var filterVal = document.getElementById('filterReview').value || 'pending_review';
        var items = data.items || [];
        items.forEach(function (row) {
          var rid = String(row.payroll_request_id || '');
          if (filterVal === 'pending_review' && dismissedPendingIds[rid]) return;
          if (filterVal === 'pending_review' && String(row.review_status) === '待審') {
            list.appendChild(renderItem(row));
          } else if (filterVal !== 'pending_review') {
            list.appendChild(renderReadOnlyItem(row));
          }
        });
        emptyMsg.classList.toggle('hidden', hasRenderedItems());
        emptyMsg.textContent = filterVal === 'pending_review' ? '目前沒有待審薪資。' : '目前沒有符合條件的薪資單。';
        applyAttendanceGate(data.attendance_confirm_gate, filterVal);
        lastRenderedCacheKey = listCacheKey();
      }

      async function loadList(force) {
        var run = async function () {
          setUpdating(true);
          try {
            if (force) dismissedPendingIds = Object.create(null);
            if (!force) setMsg('');
            setOk('');
            var peeked = null;
            var cacheKey = listCacheKey();
            if (!force && typeof AccountingListCache !== 'undefined') {
              peeked = AccountingListCache.peek(session, cacheKey);
              if (peeked && peeked.success) applyListData(peeked, false);
            }
            var canKeep = (cacheKey === lastRenderedCacheKey) && hasRenderedItems();
            if (!canKeep && !(peeked && peeked.success)) {
              document.getElementById('list').innerHTML = '<p class="sub">載入中…</p>';
              document.getElementById('emptyMsg').classList.add('hidden');
            }
            var filterVal = document.getElementById('filterReview').value || 'pending_review';
            var data;
            if (typeof AccountingListCache !== 'undefined') {
              data = await AccountingListCache.load(session, listCacheKey(), function () {
                return AccountingApi.payrollRequestList(session, {
                  status: filterVal,
                  keyword: document.getElementById('filterKw').value.trim()
                });
              }, {
                force: !!force,
                alwaysRevalidate: !force,
                onUpdate: function (fresh, err) {
                  setUpdating(false);
                  if (fresh && fresh.success) applyListData(fresh, true);
                  else if (err) setMsg((err.message || String(err)) + '（仍顯示先前內容，可再試）');
                  else applyListData(fresh, true);
                }
              });
            } else {
              data = await AccountingApi.payrollRequestList(session, {
                status: filterVal,
                keyword: document.getElementById('filterKw').value.trim()
              });
            }
            if (data) applyListData(data, hasRenderedItems() || !!(peeked && peeked.success));
          } catch (e) {
            applyListData({ success: false, message: e.message || String(e) }, true);
          } finally {
            setUpdating(false);
          }
        };
        var reloadBtn = document.getElementById('reloadBtn');
        return AccountingUi.runAsync(reloadBtn, {
          busyLabel: '載入中…',
          clear: false,
          toastOnOk: false,
          toastOnFail: false
        }, run).catch(function (e) {
          applyListData({ success: false, message: e.message || String(e) }, true);
        });
      }

      document.getElementById('list').addEventListener('input', function (e) {
        var t = e.target;
        if (!t) return;
        var prId = null;
        if (t.classList && t.classList.contains('ded-line-input')) {
          prId = t.getAttribute('data-pr');
        } else if (t.classList && t.classList.contains('recalc-final')) {
          var m = (t.id || '').match(/^(?:bonus|ded)-(.+)$/);
          prId = m && m[1];
        }
        if (prId) recalcFinalAmount(prId);
      });

      function isAlreadySettledReviewMsg_(msg) {
        var m = String(msg || '');
        return m === '此筆已審核過' ||
          m.indexOf('先前已核准') >= 0 ||
          m.indexOf('先前已退回') >= 0 ||
          m.indexOf('無法再核准') >= 0 ||
          m.indexOf('無法退回') >= 0;
      }

      function removeReviewedItem_(id) {
        var rid = String(id || '');
        if (rid) dismissedPendingIds[rid] = true;
        if (typeof AccountingListCache !== 'undefined') {
          AccountingListCache.patch(session, listCacheKey(), function (data) {
            if (!data || !data.items) return;
            data.items = data.items.filter(function (row) {
              return String(row.payroll_request_id) !== rid;
            });
          });
        }
        var el = document.getElementById('pr-' + rid);
        if (el) el.remove();
        if (!document.querySelector('#list .item')) {
          document.getElementById('emptyMsg').classList.remove('hidden');
        }
      }

      document.getElementById('list').addEventListener('click', async function (e) {
        var toggleId = e.target.getAttribute('data-toggle-cal');
        if (toggleId) {
          var card = document.getElementById('pr-' + toggleId);
          var cal = document.getElementById('cal-' + toggleId);
          if (card && card.classList.contains('is-normal-collapsed')) {
            card.classList.remove('is-normal-collapsed');
          } else if (card && !card.classList.contains('is-anomaly')) {
            card.classList.add('is-normal-collapsed');
          }
          if (cal) cal.classList.toggle('hidden');
          return;
        }
        var confirmId = e.target.getAttribute('data-att-confirm');
        if (confirmId) {
          var cBtn = e.target;
          await AccountingUi.runAsync(cBtn, {
            busyLabel: '確認中…',
            queue: true,
            queueId: 'payroll_att_confirm',
            itemId: confirmId
          }, async function () {
            var res = await AccountingApi.payrollAttendanceConfirm(session, {
              payroll_request_id: confirmId
            });
            if (!res.success) throw new Error(res.message || '確認失敗');
            setOk(res.message || '已確認出勤');
            // 就地更新確認狀態，保留其他卡片未存的加減項／備註草稿
            markAttendanceConfirmedInPlace_(confirmId, res.attendance_check || null);
          }).catch(function (err) {
            if (err && err.message) setMsg(err.message);
          });
          return;
        }
        var approveId = e.target.getAttribute('data-approve');
        var rejectId = e.target.getAttribute('data-reject');
        if (!approveId && !rejectId) return;
        if (approveId && lastAttendanceGate && !lastAttendanceGate.all_confirmed) {
          setMsg(lastAttendanceGate.message || '尚有人未確認出勤，全部確認後才能核准');
          return;
        }
        var id = approveId || rejectId;
        if (typeof AccountingActionQueue !== 'undefined' &&
            AccountingActionQueue.isPending('payroll_review', id)) return;
        var btn = e.target;
        await AccountingUi.runAsync(btn, {
          busyLabel: approveId ? '核准中…' : '退回中…',
          queue: true,
          queueId: 'payroll_review',
          itemId: id
        }, async function () {
          if (rejectId) {
            var reason = document.getElementById('note-' + id).value.trim();
            if (!reason) { setMsg('退回時請填寫審核備註'); throw new Error('退回時請填寫審核備註'); }
            var rj = await AccountingApi.payrollRequestReject(session, {
              payroll_request_id: id, reject_reason: reason
            });
            // 舊版後端可能回 success:false +「此筆已審核過」；新版冪等回 already_rejected
            if (!rj.success && !isAlreadySettledReviewMsg_(rj.message)) {
              throw new Error(rj.message || '退回失敗');
            }
            setOk(rj.message || (rj.already_rejected ? '此筆先前已退回' : '已退回'));
          } else {
            var overrides = collectDeductionOverrides(id);
            var noteVal = document.getElementById('note-' + id).value.trim();
            if (overrides.length && !noteVal) {
              setMsg('有調整減項時請在審核備註寫原因');
              throw new Error('有調整減項時請在審核備註寫原因');
            }
            if (overrides.length) {
              var adjLines = overrides.map(function (o) {
                return o.label + ' ' + o.original_amount + '→' + o.amount;
              }).join('；');
              if (noteVal.indexOf('減項調整') < 0) {
                noteVal = (noteVal ? noteVal + '；' : '') + '減項調整：' + adjLines;
              }
            }
            var bonusAmt = Number(document.getElementById('bonus-' + id).value) || 0;
            var bonusCatEl = document.getElementById('bcat-' + id);
            var bonusCat = bonusCatEl ? String(bonusCatEl.value || '').trim() : '';
            if (bonusAmt > 0 && !bonusCat) {
              setMsg('有填獎金金額時請選擇獎金類別');
              throw new Error('有填獎金金額時請選擇獎金類別');
            }
            var ap = await AccountingApi.payrollRequestApprove(session, {
              payroll_request_id: id,
              bonus_amount: bonusAmt,
              bonus_category: bonusCat,
              deduction: Number(document.getElementById('ded-' + id).value) || 0,
              bonus_note: document.getElementById('bnote-' + id).value.trim(),
              note: noteVal,
              deduction_overrides: overrides
            });
            // 舊版：success:false +「此筆已審核過」；新版：success + already_reviewed
            if (!ap.success && !isAlreadySettledReviewMsg_(ap.message)) {
              throw new Error(ap.message || '核准失敗');
            }
            setOk(ap.message || (ap.already_reviewed ? '此筆先前已核准' : '已核准，會計可至薪資待匯款匯出'));
          }
          removeReviewedItem_(id);
          // 退回後重算出勤閘：剩餘待審若已全確認，核准鈕應立刻可按
          refreshAttendanceGateFromDom_();
        }).catch(function (err) {
          if (err && err.message && err.message !== '此項目已在處理中') {
            if (isAlreadySettledReviewMsg_(err.message)) {
              removeReviewedItem_(id);
              refreshAttendanceGateFromDom_();
              setOk(err.message);
              return;
            }
            setMsg(err.message);
          }
        });
      });

      document.getElementById('reloadBtn').addEventListener('click', function () { loadList(true); });
      ['filterReview', 'filterKw'].forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('change', function () { loadList(false); });
        if (id === 'filterKw') {
          el.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') loadList(false);
          });
        }
      });

      AccountingBoot.run({
        minPermission: 5,
        deniedMsg: '此頁需主管權限（≥5）',
        onReady: async function (s) {
          session = s;
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('app').classList.remove('hidden');
          document.getElementById('userLine').textContent = (s.profile && s.profile.displayName) || '—';
          await loadList();
        }
      });
    })();
  </script>
</body>
