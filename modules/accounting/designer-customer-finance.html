<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>追加減與收款管理</title>
  <link rel="stylesheet" href="../../shared/css/accounting_layout.css?v=5" />
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="../../shared/js/operator_context.js?v=3"></script>
  <script src="../../shared/js/accounting_api.js?v=20261016-customer-menu"></script>
  <script src="../../shared/js/accounting_boot.js?v=9"></script>
  <script src="../../shared/js/hub_ref_cache.js?v=2"></script>
  <script src="../../shared/js/accounting_list_cache.js?v=5"></script>
  <script src="../../shared/js/customer_finance_ui.js?v=2"></script>
  <script src="../../shared/js/customer_finance_bind.js?v=20261016-customer-menu"></script>
  <style>
    h2 { margin: 0 0 8px; }
    .sub { color: #555; font-size: 14px; }
    .card { background: #fff; border-radius: 12px; padding: 14px; margin: 12px 0; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .project-card {
      display: block;
      border: 1px solid #dadce0;
      border-radius: 10px;
      padding: 12px 14px;
      margin: 8px 0;
      cursor: pointer;
      background: #fff;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, transform 0.1s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .project-card:hover {
      border-color: #1a73e8;
      box-shadow: 0 2px 8px rgba(26, 115, 232, 0.12);
      background: #f8fbff;
    }
    .project-card:active:not(.is-loading) {
      transform: scale(0.99);
      background: #e8f0fe;
    }
    .project-card.is-loading {
      opacity: 0.72;
      pointer-events: none;
      cursor: wait;
      border-color: #1a73e8;
      background: #f1f6fd;
    }
    .project-card .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .project-card .chevron { color: #1a73e8; font-size: 18px; line-height: 1.2; flex-shrink: 0; }
    .project-card .hint { margin-top: 6px; font-size: 13px; color: #555; }
    #overviewList.is-busy .project-card:not(.is-loading) { opacity: 0.55; pointer-events: none; }
    .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 6px; background: #e8f0fe; margin-right: 6px; }
    .tag.warn { background: #fef7e0; color: #b06000; }
    .tag.ok { background: #e6f4ea; color: #137333; }
    .btn { padding: 8px 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; margin: 4px 4px 4px 0; }
    .btn-primary { background: #1a73e8; color: #fff; }
    .btn-secondary { background: #e8eaed; color: #333; }
    .btn-danger { background: #fce8e6; color: #c5221f; }
    label { display: block; margin-top: 8px; font-weight: 600; font-size: 14px; }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; }
    .hidden { display: none; }
    .nav a { color: #1a73e8; text-decoration: none; font-size: 14px; }
    .tabs { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
    .tab { padding: 8px 12px; border-radius: 8px; background: #f1f3f4; cursor: pointer; font-size: 14px; }
    .tab.active { background: #1a73e8; color: #fff; }
    .tab.is-busy { opacity: 0.65; cursor: wait; pointer-events: none; }
    .audit-line { font-size: 12px; color: #555; border-left: 3px solid #ddd; padding-left: 8px; margin: 6px 0; }
    #msg { color: #c5221f; font-size: 14px; }
    #ok { color: #137333; font-size: 14px; }
    .todo-highlight { background: #fef7e0; border-radius: 8px; padding: 8px; margin-bottom: 8px; font-size: 13px; }
    .bind-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 13px; }
    .bind-row .mono { font-family: ui-monospace, monospace; font-size: 12px; color: #444; }
    .search-hit { padding: 8px; border: 1px solid #e0e0e0; border-radius: 8px; margin-top: 6px; cursor: pointer; }
    .search-hit:hover { background: #f8f9fa; }
    .search-hit small { color: #666; display: block; margin-top: 2px; }
    .warn-box { background: #fef7e0; border-radius: 8px; padding: 10px; margin: 8px 0; font-size: 13px; color: #b06000; line-height: 1.45; }
    .adj-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    .adj-table th, .adj-table td { border: 1px solid #e0e0e0; padding: 8px 6px; text-align: left; vertical-align: top; }
    .adj-table th { background: #f8f9fa; font-weight: 600; }
    .adj-table .num { text-align: right; white-space: nowrap; }
    .adj-table .neg { color: #c5221f; }
    .adj-table .actions { white-space: nowrap; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    @media (max-width: 520px) { .form-grid { grid-template-columns: 1fr; } }
    .form-hint { font-size: 12px; color: #666; margin-top: 2px; font-weight: 400; }
    .btn.is-busy { opacity: 0.75; cursor: wait; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body class="acct-page">
  <div id="loading">載入中…</div>
  <div id="app" class="hidden acct-main">
    <p class="nav"><a href="index.html">← 會計功能選單</a> · <a href="project_margin.html">案件毛利</a> · <a href="customer-finance-portal.html#staff_preview=1" target="_blank" rel="noopener">預覽客戶畫面</a> · <a href="../info/customer-richmenu-preview.html" target="_blank" rel="noopener">Rich Menu 預覽</a></p>
    <h2>追加減與收款管理</h2>
    <p class="sub" id="userLine">—</p>
    <div id="msg"></div>
    <div id="ok"></div>

    <div id="viewList">
      <div class="card">
        <label><input type="checkbox" id="showClosed" /> 顯示已結案</label>
        <button type="button" class="btn btn-secondary" id="reloadOverviewBtn" title="立刻向後端重抓案件列表">重新載入最新</button>
        <div id="todoBox"></div>
        <p class="sub hidden" id="overviewLive" aria-live="polite"></p>
        <div id="overviewList">載入中…</div>
      </div>
    </div>

    <div id="viewDetail" class="hidden">
      <p class="nav"><a href="#" id="backList">← 列表</a></p>
      <h3 id="detailTitle">—</h3>
      <div class="tabs">
        <span class="tab active" data-tab="adj">追加減</span>
        <span class="tab" data-tab="rec">收款</span>
        <span class="tab" data-tab="mat">選材</span>
        <span class="tab" data-tab="audit">稽核</span>
        <span class="tab" data-tab="bind">客戶綁定</span>
        <span class="tab" data-tab="esign">簽約注意</span>
        <span class="tab" data-tab="esignc">線上合約</span>
      </div>
      <div id="panelAdj" class="card"></div>
      <div id="panelRec" class="card hidden"></div>
      <div id="panelMat" class="card hidden"></div>
      <div id="panelAudit" class="card hidden"></div>
      <div id="panelBind" class="card hidden"></div>
      <div id="panelEsign" class="card hidden"></div>
      <div id="panelEsignc" class="card hidden"></div>
    </div>
  </div>
  <script>
  (function () {
    var session = null;
    var currentProject = '';
    var detailData = null;
    var activeTab = 'adj';
    var detailBusy = false;
    var lastOverviewItems = null;
    var lastTodosItems = null;
    var localMockMode = '';
    (function detectLocalMock_() {
      var host = window.location.hostname;
      if (host === '127.0.0.1' || host === 'localhost') {
        localMockMode = new URLSearchParams(window.location.search).get('mock') || '';
      }
    })();

    function $(id) { return document.getElementById(id); }
    function friendlyApiError(t) {
      var msg = String(t || '');
      if (!msg) return '';
      if (msg.indexOf('columns in the data does not match') >= 0 || msg.indexOf('欄數與範圍') >= 0) {
        return '後端試算表欄位設定異常（資料 5 欄、範圍 24 欄），追加減／收款功能暫時無法使用。請聯繫管理員部署 accounting-gas 修補。';
      }
      return msg;
    }
    function showMsg(t) { $('msg').textContent = friendlyApiError(t); $('ok').textContent = ''; }
    function showOk(t) { $('ok').textContent = t || ''; $('msg').textContent = ''; }
    function escapeHtml(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    }
    function setOverviewLive(text) {
      var el = $('overviewLive');
      if (!el) return;
      if (text) {
        el.textContent = text;
        el.classList.remove('hidden');
      } else {
        el.textContent = '';
        el.classList.add('hidden');
      }
    }
    function bindRetryOverview() {
      var btn = $('btnRetryOverview');
      if (btn) btn.onclick = function () {
        loadOverview();
        loadTodos();
      };
    }
    async function fetchOverview_() {
      if (localMockMode === 'fail') {
        return { success: false, message: '（本機模擬）案件列表讀取失敗' };
      }
      if (localMockMode === 'empty') return { success: true, items: [] };
      return AccountingApi.cfOverview(session, $('showClosed').checked);
    }
    async function fetchTodos_() {
      if (localMockMode === 'fail') {
        return { success: false, message: '（本機模擬）待辦讀取失敗' };
      }
      if (localMockMode === 'empty') return { success: true, items: [] };
      return AccountingApi.cfTodos(session, true);
    }

    function statusLabel(st) {
      var map = {
        draft: '草稿', pending_customer: '待客戶確認', content_confirmed: '待簽名',
        pending_company: '待公司確認', company_confirmed: '已生效', void: '作廢',
        pending_signatures: '待雙簽', customer_stage1: '客戶已確認①', customer_confirmed: '客戶已確認②'
      };
      return map[st] || st;
    }

    function setOverviewBusy(on, loadingPno) {
      $('overviewList').classList.toggle('is-busy', !!on);
      $('overviewList').querySelectorAll('.project-card').forEach(function (el) {
        var isTarget = loadingPno && el.getAttribute('data-pno') === loadingPno;
        el.classList.toggle('is-loading', !!on && isTarget);
        if (on && isTarget) el.setAttribute('aria-busy', 'true');
        else el.removeAttribute('aria-busy');
      });
    }

    function bindOverviewCards() {
      $('overviewList').querySelectorAll('.project-card').forEach(function (el) {
        el.onclick = function () {
          if (detailBusy) return;
          openDetail(el.getAttribute('data-pno'));
        };
      });
    }

    function renderOverviewItems(items) {
      var html = (items || []).map(function (p) {
        var badges = '';
        if (p.pending_customer_adj) badges += '<span class="tag warn">客戶待確認 ' + p.pending_customer_adj + '</span>';
        if (p.pending_company_adj) badges += '<span class="tag warn">待公司確認 ' + p.pending_company_adj + '</span>';
        if (p.pending_cash_sign) badges += '<span class="tag warn">現金待簽 ' + p.pending_cash_sign + '</span>';
        if (p.pending_income_review) badges += '<span class="tag warn">收入待審 ' + p.pending_income_review + '</span>';
        return '<div class="project-card" role="button" tabindex="0" data-pno="' + escapeHtml(p.project_no) + '">' +
          '<div class="card-head"><div><strong>' + escapeHtml(p.project_no) + '</strong> ' + escapeHtml(p.client_name || '') +
          (p.is_closed ? ' <span class="tag">已結案</span>' : '') + '</div>' +
          '<span class="chevron" aria-hidden="true">›</span></div>' +
          '<div class="hint">' + badges + '已收確認 $' + (p.receipts_confirmed_total || 0) + '</div></div>';
      }).join('') || '<p>尚無案件</p>';
      $('overviewList').innerHTML = html;
      bindOverviewCards();
    }

    function showOverviewError(message) {
      setOverviewLive('');
      var msg = friendlyApiError(message) || '案件列表載入失敗';
      var keep = lastOverviewItems && lastOverviewItems.length;
      if (keep) {
        showMsg(msg + '。仍顯示先前內容，請再試。');
        setOverviewLive('更新失敗，可按「重新載入最新」');
        return;
      }
      $('overviewList').innerHTML =
        '<p>案件列表載入失敗。' + escapeHtml(msg) + '</p>' +
        '<button type="button" class="btn btn-secondary" id="btnRetryOverview">再試一次</button>';
      bindRetryOverview();
    }

    function renderTodosItems(items) {
      if (!(items || []).length) {
        $('todoBox').innerHTML = '';
        return;
      }
      $('todoBox').innerHTML = items.slice(0, 5).map(function (t) {
        return '<div class="todo-highlight">待辦：' + escapeHtml(t.type) + ' · 案號 ' + escapeHtml(t.project_no) +
          ' <a href="#" data-pno="' + escapeHtml(t.project_no) + '">查看</a></div>';
      }).join('');
      $('todoBox').querySelectorAll('a').forEach(function (a) {
        a.onclick = function (e) {
          e.preventDefault();
          if (detailBusy) return;
          openDetail(a.getAttribute('data-pno'));
        };
      });
    }

    function showTodosError(message) {
      var msg = friendlyApiError(message) || '待辦載入失敗';
      if (lastTodosItems && lastTodosItems.length) {
        showMsg(msg + '。待辦仍顯示先前內容。');
        return;
      }
      $('todoBox').innerHTML =
        '<div class="todo-highlight">待辦載入失敗：' + escapeHtml(msg) +
        ' <a href="#" id="retryTodos">再試一次</a></div>';
      var retry = $('retryTodos');
      if (retry) retry.onclick = function (e) {
        e.preventDefault();
        loadTodos();
      };
    }

    async function loadOverview() {
      showMsg('');
      setOverviewLive('載入案件列表中…');
      if (!lastOverviewItems || !lastOverviewItems.length) {
        $('overviewList').innerHTML = '<p>載入案件列表中…</p>';
      }
      try {
        var res = await fetchOverview_();
        if (!res || !res.success) {
          showOverviewError((res && res.message) || '案件列表載入失敗');
          return;
        }
        lastOverviewItems = res.items || [];
        renderOverviewItems(lastOverviewItems);
        setOverviewLive('');
      } catch (e) {
        showOverviewError((e && e.message) || '案件列表載入失敗');
      }
    }

    async function loadTodos() {
      try {
        var res = await fetchTodos_();
        if (!res || !res.success) {
          showTodosError((res && res.message) || '待辦載入失敗');
          return;
        }
        lastTodosItems = res.items || [];
        renderTodosItems(lastTodosItems);
      } catch (e) {
        showTodosError((e && e.message) || '待辦載入失敗');
      }
    }

    function mergeCreatedAdj(adj) {
      if (!detailData || !adj) return false;
      detailData.adjustments = detailData.adjustments || [];
      detailData.adjustments.push(adj);
      detailData.adjustments.sort(function (a, b) {
        var na = parseInt(a.item_no, 10);
        var nb = parseInt(b.item_no, 10);
        if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
        return String(a.created_at || '').localeCompare(String(b.created_at || ''));
      });
      renderPanels();
      return true;
    }

    function mergeCreatedRec(rec) {
      if (!detailData || !rec) return false;
      detailData.receipts = detailData.receipts || [];
      detailData.receipts.push(rec);
      renderPanels();
      return true;
    }

    async function openDetail(pno) {
      if (detailBusy) return;
      detailBusy = true;
      currentProject = pno;
      showMsg('');
      setOverviewBusy(true, pno);
      try {
        var res = await AccountingApi.cfDetail(session, pno);
        if (!res.success) { showMsg(res.message); return; }
        detailData = res;
        $('viewList').classList.add('hidden');
        $('viewDetail').classList.remove('hidden');
        $('detailTitle').textContent = '案號 ' + pno + ' ' + ((res.site && res.site.site_name) || '');
        var previewHref = 'customer-finance-portal.html#staff_preview=1&project_no=' + encodeURIComponent(pno);
        var previewLink = document.getElementById('previewClientLink');
        if (!previewLink) {
          previewLink = document.createElement('p');
          previewLink.className = 'nav';
          previewLink.id = 'previewClientLink';
          $('detailTitle').insertAdjacentElement('afterend', previewLink);
        }
        previewLink.innerHTML = '<a href="' + previewHref + '" target="_blank" rel="noopener">以客戶畫面預覽此案</a>';
        renderPanels();
      } finally {
        detailBusy = false;
        setOverviewBusy(false);
      }
    }

    function renderPanels() {
      renderAdjPanel();
      renderRecPanel();
      renderMatPanel();
      renderAuditPanel();
      renderBindPanel();
      renderEsignPanel();
      renderEsignContractPanel();
      document.querySelectorAll('.tab').forEach(function (t) {
        t.classList.toggle('active', t.getAttribute('data-tab') === activeTab);
      });
      $('panelAdj').classList.toggle('hidden', activeTab !== 'adj');
      $('panelRec').classList.toggle('hidden', activeTab !== 'rec');
      $('panelMat').classList.toggle('hidden', activeTab !== 'mat');
      $('panelAudit').classList.toggle('hidden', activeTab !== 'audit');
      $('panelBind').classList.toggle('hidden', activeTab !== 'bind');
      $('panelEsign').classList.toggle('hidden', activeTab !== 'esign');
      $('panelEsignc').classList.toggle('hidden', activeTab !== 'esignc');
    }

    function renderEsignPanel() {
      var pno = currentProject || '';
      var panel = $('panelEsign');
      if (!panel) return;
      var clientLink = location.origin + '/modules/projects/esign-notice.html?project_no=' + encodeURIComponent(pno);
      panel.innerHTML =
        '<h4>簽約注意事項</h4>' +
        '<p class="form-hint">客戶逐條確認＋手寫簽名。系統不做主動推播；請同事用官方 LINE「回覆」把連結傳給客戶。</p>' +
        '<p id="esignStatusLine" class="sub">狀態載入中…</p>' +
        '<p style="margin:10px 0;word-break:break-all;font-size:13px" id="esignLinkText">' + escapeHtml(clientLink) + '</p>' +
        '<p style="margin:12px 0">' +
        '<button type="button" class="btn btn-secondary" id="btnEsignCopy">複製客戶連結</button> ' +
        '<button type="button" class="btn btn-secondary" id="btnEsignRefresh">重新整理狀態</button> ' +
        '<a class="btn btn-primary" id="btnEsignPreview" href="../projects/esign-notice.html?project_no=' + encodeURIComponent(pno) + '&staff_preview=1" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none">預覽客戶畫面</a> ' +
        '<button type="button" class="btn btn-secondary" id="btnEsignPrint">列印已簽版本</button>' +
        '</p>' +
        '<p class="form-hint">正式開關預設關閉；測試案號需後端白名單。已簽內容會鎖定，不隨之後改版變動。</p>';

      function setStatusText(t) {
        var line = $('esignStatusLine');
        if (line) line.textContent = t;
      }
      async function refreshStatus() {
        setStatusText('狀態載入中…');
        try {
          if (localMockMode) {
            setStatusText('本機模擬：未連後端（狀態未知）');
            return;
          }
          var res = await AccountingApi.esignNoticeStatus(session, pno);
          if (!res || !res.success) {
            setStatusText((res && res.message) || '狀態讀取失敗');
            return;
          }
          var flag = res.feature_enabled ? '正式開放中' : (res.project_allowed ? '測試案可用（正式開關仍關）' : '正式開關關閉且非測試案');
          setStatusText('狀態：' + (res.status_label || res.status || '—') + '｜' + flag);
          if (res.client_link) {
            var linkEl = $('esignLinkText');
            if (linkEl) linkEl.textContent = res.client_link;
          }
        } catch (e) {
          setStatusText((e && e.message) || '狀態讀取失敗');
        }
      }
      var copyBtn = $('btnEsignCopy');
      if (copyBtn) copyBtn.onclick = function () {
        var text = ($('esignLinkText') && $('esignLinkText').textContent) || clientLink;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            showOk('已複製客戶連結');
          }).catch(function () {
            window.prompt('請手動複製：', text);
          });
        } else {
          window.prompt('請手動複製：', text);
        }
      };
      var refreshBtn = $('btnEsignRefresh');
      if (refreshBtn) refreshBtn.onclick = refreshStatus;
      var printBtn = $('btnEsignPrint');
      if (printBtn) printBtn.onclick = async function () {
        try {
          if (localMockMode) { showMsg('本機模擬無法列印'); return; }
          var res = await AccountingApi.esignNoticePrint(session, pno);
          if (!res || !res.success) { showMsg((res && res.message) || '列印資料讀取失敗'); return; }
          var w = window.open('', '_blank');
          if (!w) { showMsg('瀏覽器阻擋彈窗，請允許後再試'); return; }
          var p = res.print || {};
          var base = location.origin + '/modules/projects/';
          var items = (p.items || []).map(function (it) {
            var ack = (p.ack_times && p.ack_times[String(it.id)]) || '—';
            var imgs = (it.images || []).filter(function (img) { return img && img.src; }).map(function (img) {
              var src = String(img.src);
              if (!/^https?:\/\//i.test(src) && src.charAt(0) !== '/') src = base + src.replace(/^\.\//, '');
              var alt = img.alt || img.caption || '';
              return '<img src="' + escapeHtml(src) + '" alt="' + escapeHtml(alt) + '" style="max-width:220px;margin:4px 6px 4px 0;vertical-align:top"/>' +
                '<div style="font-size:12px;color:#555">' + escapeHtml(alt) + '</div>';
            }).join('');
            return '<div style="margin:0 0 10px"><strong>第 ' + it.id + ' 條' +
              (it.title ? '｜' + escapeHtml(it.title) : '') + '</strong><div>' +

    function downloadPdfBase64(filename, b64) {
      var bin = atob(b64);
      var len = bin.length;
      var bytes = new Uint8Array(len);
      for (var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
      var blob = new Blob([bytes], { type: 'application/pdf' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename || '追加減.pdf';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    }

    function bindActionButtons(root) {
      root.querySelectorAll('[data-act]').forEach(function (btn) {
        btn.onclick = function () {
          var id = btn.getAttribute('data-id');
          var act = btn.getAttribute('data-act');
          var voidReason = '';
          if (act === 'adj-void') {
            voidReason = prompt('作廢原因（可留空）') || '';
          } else if (act === 'rec-void') {
            voidReason = prompt('作廢原因') || '';
          }
          CustomerFinanceUi.runBtnAsync(btn, async function () {
            var res;
            if (act === 'adj-submit') res = await AccountingApi.cfAdjSubmit(session, id);
            else if (act === 'adj-withdraw') res = await AccountingApi.cfAdjWithdraw(session, id);
            else if (act === 'adj-company') res = await AccountingApi.cfAdjCompanyConfirm(session, id);
            else if (act === 'adj-pdf') {
              res = await AccountingApi.cfAdjExportPdf(session, id);
              if (res.success && res.pdf_base64) {
                downloadPdfBase64(res.filename, res.pdf_base64);
                showOk('PDF 已下載');
                return;
              }
            }
            else if (act === 'adj-void') res = await AccountingApi.cfAdjVoid(session, id, voidReason);
            else if (act === 'rec-submit') res = await AccountingApi.cfRecSubmit(session, id);
            else if (act === 'rec-sign-d') res = await AccountingApi.cfRecSignDesigner(session, id);
            else if (act === 'rec-void') res = await AccountingApi.cfRecVoid(session, id, voidReason);
            if (!res) return;
            if (!res.success) showMsg(res.message);
            else { showOk('完成'); await openDetail(currentProject); await loadTodos(); }
          }, { busyLabel: '處理中…', lockRoot: root });
        };
      });
    }

    var tabBusy = false;
    document.querySelectorAll('.tab').forEach(function (t) {
      t.onclick = function () {
        var next = t.getAttribute('data-tab');
        if (tabBusy || next === activeTab) return;
        tabBusy = true;
        document.querySelectorAll('.tab').forEach(function (el) {
          el.classList.add('is-busy');
        });
        activeTab = next;
        try {
          renderPanels();
        } finally {
          tabBusy = false;
          document.querySelectorAll('.tab').forEach(function (el) {
            el.classList.remove('is-busy');
          });
        }
      };
    });
    $('backList').onclick = function (e) {
      e.preventDefault();
      $('viewDetail').classList.add('hidden');
      $('viewList').classList.remove('hidden');
      loadOverview();
      loadTodos();
    };
    $('showClosed').onchange = loadOverview;
    if ($('reloadOverviewBtn')) {
      $('reloadOverviewBtn').onclick = function () {
        lastOverviewItems = null;
        lastTodosItems = null;
        loadOverview();
        loadTodos();
      };
    }

    if (localMockMode) {
      session = {
        auth: { permission: 5, display_name: '本機模擬', user_id: 'local-mock' },
        profile: { displayName: '本機模擬' },
        devBypass: true
      };
      $('loading').classList.add('hidden');
      $('app').classList.remove('hidden');
      $('userLine').textContent = '本機模擬 · 不連後端';
      Promise.all([loadTodos(), loadOverview()]);
    } else {
      AccountingBoot.run({
        minPermission: 2,
        deniedMsg: AccountingApi.CUSTOMER_FINANCE_DENIED_MSG,
        initSession: function () { return AccountingApi.initCustomerFinanceSession(); },
        onReady: async function (sess) {
          session = sess;
          var q = new URLSearchParams(location.search);
          await Promise.all([loadTodos(), loadOverview()]);
          if (q.get('project_no')) {
            if (q.get('tab') === 'mat') activeTab = 'mat';
            openDetail(q.get('project_no'));
          }
        }
      });
    }
  })();
  </script>
</body>
</html>
