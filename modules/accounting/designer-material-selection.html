<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>選材管理</title>
  <link rel="stylesheet" href="../../shared/css/accounting_layout.css?v=5" />
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="../../shared/js/operator_context.js?v=1"></script>
  <script src="../../shared/js/accounting_api.js?v=43"></script>
  <style>
    body { max-width: 720px; margin: 0 auto; padding: 16px; font-family: system-ui, sans-serif; }
    h2 { margin: 0 0 12px; font-size: 20px; }
    .card { background: #fff; border-radius: 12px; padding: 14px; margin: 12px 0; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 6px; background: #e8f0fe; color: #174ea6; }
    .tag-void { background: #fce8e6; color: #c5221f; }
    .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; font-size: 15px; margin-top: 8px; cursor: pointer; }
    .btn-primary { background: #06c755; color: #fff; }
    .btn-secondary { background: #e8eaed; color: #333; }
    .btn-danger { background: #fce8e6; color: #c5221f; }
    .btn-sm { display: inline-block; width: auto; padding: 6px 14px; font-size: 13px; margin: 4px 4px 0 0; }
    .btn:disabled { opacity: 0.6; cursor: wait; }
    select, input, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; box-sizing: border-box; margin-top: 6px; }
    textarea { min-height: 60px; resize: vertical; }
    label { display: block; font-weight: 600; font-size: 14px; margin-top: 12px; }
    #msg { color: #c5221f; font-size: 14px; margin: 8px 0; }
    .hidden { display: none; }
    .mat-item { padding: 10px 0; border-bottom: 1px solid #eee; }
    .mat-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; margin: 4px 4px 0 0; }
    .audit-row { font-size: 12px; color: #555; padding: 4px 0; border-bottom: 1px solid #f0f0f0; }
  </style>
</head>
<body>
  <div id="loading">載入中…</div>
  <div id="app" class="hidden">
    <h2>選材管理（設計師）</h2>
    <div id="msg"></div>

    <div class="card">
      <label>選擇案號</label>
      <select id="projectSelect"><option value="">—</option></select>
    </div>

    <!-- 列表視圖 -->
    <div id="listView">
      <button class="btn btn-primary" id="btnAdd">＋ 新增選材</button>
      <div id="matList" style="margin-top:12px;">請先選擇案號</div>
      <div class="card" id="auditSection" style="margin-top:16px;">
        <h3 style="margin:0 0 8px;font-size:15px;">變更歷程</h3>
        <div id="auditList">—</div>
      </div>
    </div>

    <!-- 新增／編輯表單 -->
    <div id="formView" class="hidden">
      <button class="btn btn-secondary" id="btnBackToList">← 返回列表</button>
      <div class="card">
        <h3 id="formTitle" style="margin:0 0 8px">新增選材</h3>
        <input type="hidden" id="fMaterialId" />
        <label>分類</label>
        <input id="fCategory" placeholder="如：磁磚、木地板、油漆" />
        <label>品名 / 型號</label>
        <input id="fItemName" />
        <label>規格</label>
        <textarea id="fSpec" placeholder="尺寸、顏色、花色等"></textarea>
        <label>單位</label>
        <input id="fUnit" placeholder="坪、片、組…" />
        <label>數量</label>
        <input id="fQuantity" />
        <label>備註</label>
        <textarea id="fNote"></textarea>
        <label>照片（最多 3 張）</label>
        <input type="file" id="fPhotos" accept="image/*" multiple />
        <div id="fPhotoPreview" style="margin-top:8px;"></div>
        <button class="btn btn-primary" id="btnSave">儲存</button>
      </div>
    </div>
  </div>

  <script>
  (function () {
    var session = null;
    function $(id) { return document.getElementById(id); }
    function showMsg(t) { $('msg').textContent = t || ''; }

    async function boot() {
      try {
        session = await AccountingApi.initSession({ minPermission: 2 });
        if (!session) return;
        $('loading').classList.add('hidden');
        $('app').classList.remove('hidden');
        await loadProjectOptions();
      } catch (e) {
        $('loading').textContent = e.message || '載入失敗';
      }
    }

    async function loadProjectOptions() {
      try {
        var overview = await AccountingApi.cfOverview(session, true);
        if (!overview.success) return;
        var sel = $('projectSelect');
        var projects = overview.projects || [];
        sel.innerHTML = '<option value="">— 選擇案號 —</option>' +
          projects.map(function (p) {
            return '<option value="' + p.project_no + '">' + p.project_no + ' ' + (p.site_name || '') + '</option>';
          }).join('');
      } catch (e) {
        showMsg('案號載入失敗：' + e.message);
      }
    }

    $('projectSelect').onchange = function () {
      if (this.value) {
        loadList();
        loadAudit();
      }
    };

    async function loadList() {
      var pno = $('projectSelect').value;
      if (!pno) return;
      $('matList').innerHTML = '載入中…';
      try {
        var res = await AccountingApi.materialDesignerList(session, pno);
        if (!res.success) { $('matList').innerHTML = res.message || '載入失敗'; return; }
        if (!res.items || !res.items.length) { $('matList').innerHTML = '<p>尚無選材紀錄</p>'; return; }
        $('matList').innerHTML = res.items.map(function (m) {
          var isVoid = m.status === 'void';
          var photos = (m.photo_urls || '').split(',').filter(Boolean);
          var photoHtml = photos.map(function (u) {
            return '<img src="' + u + '" />';
          }).join('');
          var btns = '';
          if (!isVoid) {
            btns = '<button class="btn btn-sm btn-secondary" onclick="window._editMaterial(\'' + m.material_id + '\')">編輯</button>' +
              '<button class="btn btn-sm btn-danger" onclick="window._voidMaterial(\'' + m.material_id + '\')">作廢</button>';
          }
          return '<div class="mat-item">' +
            '<span class="tag' + (isVoid ? ' tag-void' : '') + '">' + (isVoid ? '已作廢' : m.category || '—') + '</span> ' +
            '<strong>' + (m.item_name || '—') + '</strong>' +
            ' <span style="font-size:12px;color:#999">v' + (m.version || 1) + '</span><br/>' +
            (m.spec ? '<span style="font-size:13px;color:#555">規格：' + m.spec + '</span><br/>' : '') +
            (m.quantity || m.unit ? '<span style="font-size:13px;color:#555">' + (m.quantity || '') + ' ' + (m.unit || '') + '</span><br/>' : '') +
            (m.note ? '<span style="font-size:13px;color:#888">備註：' + m.note + '</span><br/>' : '') +
            (photoHtml ? '<div>' + photoHtml + '</div>' : '') +
            btns + '</div>';
        }).join('');
      } catch (e) {
        $('matList').innerHTML = '載入錯誤：' + e.message;
      }
    }

    async function loadAudit() {
      var pno = $('projectSelect').value;
      if (!pno) return;
      try {
        var res = await AccountingApi.materialAuditLog(session, { project_no: pno });
        if (!res.success || !res.logs || !res.logs.length) {
          $('auditList').innerHTML = '（尚無變更紀錄）';
          return;
        }
        $('auditList').innerHTML = res.logs.slice().reverse().map(function (log) {
          return '<div class="audit-row">' +
            '<strong>' + log.action + '</strong> · ' + (log.actor_name || '—') +
            ' · ' + (log.occurred_at || '') +
            (log.diff_summary ? '<br/>' + log.diff_summary : '') +
            '</div>';
        }).join('');
      } catch (e) {
        $('auditList').innerHTML = '載入失敗';
      }
    }

    /* ── 新增 ── */
    $('btnAdd').onclick = function () {
      if (!$('projectSelect').value) { showMsg('請先選擇案號'); return; }
      clearForm();
      $('formTitle').textContent = '新增選材';
      $('listView').classList.add('hidden');
      $('formView').classList.remove('hidden');
    };
    $('btnBackToList').onclick = function () {
      $('formView').classList.add('hidden');
      $('listView').classList.remove('hidden');
    };

    function clearForm() {
      $('fMaterialId').value = '';
      $('fCategory').value = '';
      $('fItemName').value = '';
      $('fSpec').value = '';
      $('fUnit').value = '';
      $('fQuantity').value = '';
      $('fNote').value = '';
      $('fPhotos').value = '';
      $('fPhotoPreview').innerHTML = '';
    }

    /* ── 編輯 ── */
    window._editMaterial = async function (mid) {
      var pno = $('projectSelect').value;
      var res = await AccountingApi.materialDesignerList(session, pno);
      if (!res.success) { showMsg(res.message); return; }
      var m = (res.items || []).find(function (x) { return x.material_id === mid; });
      if (!m) { showMsg('找不到紀錄'); return; }
      $('fMaterialId').value = m.material_id;
      $('fCategory').value = m.category || '';
      $('fItemName').value = m.item_name || '';
      $('fSpec').value = m.spec || '';
      $('fUnit').value = m.unit || '';
      $('fQuantity').value = m.quantity || '';
      $('fNote').value = m.note || '';
      $('fPhotos').value = '';
      var existPhotos = (m.photo_urls || '').split(',').filter(Boolean);
      $('fPhotoPreview').innerHTML = existPhotos.map(function (u) {
        return '<img src="' + u + '" style="width:60px;height:60px;object-fit:cover;border-radius:6px;margin:4px;" />';
      }).join('');
      $('formTitle').textContent = '修改選材';
      $('listView').classList.add('hidden');
      $('formView').classList.remove('hidden');
    };

    /* ── 作廢 ── */
    window._voidMaterial = async function (mid) {
      if (!confirm('確定要作廢此選材？作廢後客戶端將不再顯示。')) return;
      showMsg('');
      var res = await AccountingApi.materialVoid(session, mid);
      if (!res.success) { showMsg(res.message); return; }
      loadList();
      loadAudit();
    };

    /* ── 儲存 ── */
    $('btnSave').onclick = async function () {
      var btn = $('btnSave');
      btn.disabled = true;
      showMsg('');
      try {
        var mid = $('fMaterialId').value;
        var payload = {
          project_no: $('projectSelect').value,
          category: $('fCategory').value,
          item_name: $('fItemName').value,
          spec: $('fSpec').value,
          unit: $('fUnit').value,
          quantity: $('fQuantity').value,
          note: $('fNote').value
        };
        var res;
        if (mid) {
          payload.material_id = mid;
          res = await AccountingApi.materialUpdate(session, payload);
        } else {
          res = await AccountingApi.materialCreate(session, payload);
          if (res.success) mid = res.material_id;
        }
        if (!res.success) { showMsg(res.message); return; }

        var files = $('fPhotos').files;
        if (files && files.length > 0) {
          var photos = [];
          for (var i = 0; i < Math.min(files.length, 3); i++) {
            photos.push(await readFileAsBase64_(files[i]));
          }
          var upRes = await AccountingApi.materialUploadPhoto(session, {
            material_id: mid,
            project_no: $('projectSelect').value,
            photos: photos
          });
          if (!upRes.success) showMsg('選材已儲存，但照片上傳失敗：' + upRes.message);
        }

        $('formView').classList.add('hidden');
        $('listView').classList.remove('hidden');
        loadList();
        loadAudit();
      } finally {
        btn.disabled = false;
      }
    };

    function readFileAsBase64_(file) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function () {
          var base64 = reader.result.split(',')[1];
          resolve({ data_base64: base64, mime_type: file.type || 'image/jpeg', filename: file.name });
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    boot();
  })();
  </script>
</body>
</html>
