<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>單據與存檔</title>
  <link rel="stylesheet" href="../../shared/css/accounting_layout.css?v=5" />
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="../../shared/js/accounting_master_data.js?v=19"></script>
  <script src="../../shared/js/operator_context.js?v=3"></script>
  <script src="../../shared/js/accounting_api.js?v=58"></script>
  <script src="../../shared/js/accounting_cache.js?v=32"></script>
  <script src="../../shared/js/accounting_ui.js?v=23"></script>
  <script src="../../shared/js/accounting_nav.js?v=2"></script>
  <script src="../../shared/js/accounting_boot.js?v=9"></script>
  <style>
    h2 { margin: 0; font-size: 22px; font-weight: 700; color: #202124; }
    .page-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; margin-bottom: 6px; }
    .status-live {
      font-size: 13px; font-weight: 600; color: #1a73e8;
      padding: 2px 8px; border-radius: 6px; background: #e8f0fe;
    }
    .status-live.idle { color: #5f6368; background: transparent; padding: 0; font-weight: 500; }
    .sub { color: #5f6368; font-size: 14px; line-height: 1.5; margin: 0 0 8px; }
    .hint {
      margin: 0 0 12px; padding: 10px 12px; border-radius: 8px;
      background: #f8f9fa; border-left: 3px solid #1a73e8;
      font-size: 13px; color: #3c4043; line-height: 1.45;
    }
    .card {
      background: #fff; border-radius: 10px; padding: 12px 14px; margin: 10px 0;
      border: 1px solid #e8eaed; box-shadow: none;
    }
    .filters { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: end; }
    .filters .field { flex: 1 1 140px; min-width: 120px; }
    .filters .field-btn { flex: 0 0 auto; }
    label { display: block; margin: 0; font-weight: 600; font-size: 13px; color: #3c4043; }
    select, input {
      width: 100%; padding: 10px 12px; margin-top: 4px; box-sizing: border-box;
      border: 1px solid #dadce0; border-radius: 8px; font-size: 16px; background: #fff;
    }
    select:focus, input:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,.2); }
    .btn {
      padding: 10px 14px; border: none; border-radius: 8px; font-weight: 600;
      cursor: pointer; font-size: 14px; min-height: 44px;
    }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-primary { background: #1a73e8; color: #fff; }
    .btn-ghost { background: #f1f3f4; color: #202124; }
    .btn-danger { background: #c5221f; color: #fff; }
    .btn-cat {
      background: #f1f3f4; color: #202124; min-width: 4.8em; min-height: 44px;
      padding: 10px 12px; font-size: 15px;
    }
    .btn-cat.pay { background: #e6f4ea; color: #137333; }
    .btn-cat.drop { background: #fce8e6; color: #c5221f; }
    .item {
      display: grid; grid-template-columns: 72px 1fr; gap: 10px 12px;
      border: 1px solid #e8eaed; border-radius: 10px; padding: 12px;
      margin-bottom: 10px; background: #fff; align-items: start;
    }
    .item.unclaimed { border-color: #f9ab00; background: #fffbf0; }
    .item.removing { opacity: .45; pointer-events: none; }
    .item-main { min-width: 0; grid-column: 2; }
    .item-media {
      grid-column: 1; grid-row: 1 / span 2; width: 72px; height: 72px;
      border-radius: 8px; overflow: hidden; background: #f1f3f4;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; color: #5f6368; font-size: 11px; font-weight: 600;
      border: none; padding: 0; cursor: pointer;
    }
    .item-media img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .item-media.pdf { background: #e8eaed; }
    .item-body { grid-column: 1 / -1; }
    .headline { font-size: 16px; font-weight: 700; color: #202124; line-height: 1.3; }
    .meta-row { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .tag {
      display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 6px;
      background: #e8f0fe; color: #174ea6;
    }
    .tag.warn { background: #fef7e0; color: #b06000; }
    .time-line { margin: 4px 0 0; font-size: 13px; color: #5f6368; }
    .mono {
      margin: 2px 0 0; font-family: ui-monospace, monospace;
      font-size: 12px; color: #80868b; word-break: break-all;
    }
    .actions { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .claim-row { margin-top: 8px; display: none; }
    .item.unclaimed .claim-row { display: block; }
    #msg { color: #c5221f; font-size: 14px; margin: 8px 0; }
    #ok { color: #137333; font-size: 14px; margin: 8px 0; }
    .nav { margin-bottom: 12px; font-size: 14px; }
    .nav a { color: #1a73e8; text-decoration: none; }
    .list-summary { margin: 0 0 10px; font-size: 14px; color: #5f6368; }
    /* 廢棄確認：預設焦點在「取消」 */
    .dlg-mask {
      position: fixed; inset: 0; background: rgba(32,33,36,.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 80; padding: 16px; box-sizing: border-box;
    }
    /* 必須蓋過 .dlg-mask 的 display:flex，否則「隱藏」仍會擋住整頁點擊 */
    .hidden,
    .dlg-mask.hidden { display: none !important; }
    .dlg {
      background: #fff; border-radius: 12px; padding: 18px 16px 14px;
      max-width: 360px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,.18);
    }
    .dlg h3 { margin: 0 0 8px; font-size: 17px; }
    .dlg p { margin: 0 0 14px; font-size: 14px; color: #3c4043; line-height: 1.45; }
    .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .dlg-actions .btn { flex: 1; }
    .seg { display: flex; gap: 6px; margin: 10px 0 12px; }
    .seg button {
      flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px;
      background: #fff; font-weight: 600; cursor: pointer; min-height: 44px; font-size: 15px;
    }
    .seg button.active { background: #e8f0fe; border-color: #1a73e8; color: #1a73e8; }
    .drop-zone {
      margin-top: 8px; padding: 20px 14px; border: 2px dashed #b0b8c4; border-radius: 12px;
      background: #f8fafc; text-align: center; cursor: pointer;
    }
    .drop-zone:hover, .drop-zone.drag-over { border-color: #1a73e8; background: #e8f0fe; }
    .drop-zone p { margin: 0; font-size: 15px; color: #333; }
    .drop-zone .hint { margin-top: 6px; font-size: 13px; color: #666; line-height: 1.45; }
    .drop-zone input[type="file"] { display: none; }
    .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .photo-tile { border: 1px solid #ddd; border-radius: 8px; padding: 6px; background: #fafafa; text-align: center; }
    .photo-tile img { width: 100%; height: 72px; object-fit: cover; border-radius: 4px; }
    .photo-tile .file-thumb {
      width: 100%; height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      border-radius: 4px; background: #eef2f7; color: #444; font-size: 12px; padding: 4px; box-sizing: border-box; word-break: break-all;
    }
    .photo-tile .del { border: none; background: none; color: #c5221f; font-size: 11px; cursor: pointer; margin-top: 2px; }
    .archive-item { border-bottom: 1px solid #eee; padding: 10px 0; }
    .archive-item:last-child { border-bottom: none; }
    .archive-item-meta { font-size: 12px; color: #666; margin-top: 4px; }
    .btn-warn { background: #fce8e6; color: #c5221f; border: 1px solid #f5c6c2; padding: 6px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; margin-top: 6px; }
    .vendor-filter-label { font-size: 13px; font-weight: 600; color: #555; margin-top: 8px; }
  </style>
</head>
<body class="acct-page acct-page-form">
  <div id="loading">載入中…</div>
  <div id="app" class="hidden acct-main">
    <p class="nav acct-shell-hide"><a href="index.html">← 會計功能選單</a></p>
    <div class="page-head">
      <h2>單據與存檔</h2>
      <span id="liveStatus" class="status-live" aria-live="polite">更新中…</span>
    </div>
    <p class="sub" id="userLine">—</p>
    <div class="seg" id="workTabSeg" role="tablist">
      <button type="button" data-tab="review" class="active">待審單據</button>
      <button type="button" data-tab="archive">手動存檔</button>
    </div>
    <p class="hint" id="reviewHint">
      點五類之一即可；「請款」會開待付款申請並帶附件（請盡快完成載入）。
      <br />標錯了？切上方「已分類」再點一次分類即可。廢棄會再問一次確認。
    </p>
    <p class="hint hidden" id="archiveHint">
      報價、合約、型錄等：選廠商後上傳，會進該廠資料夾。不必走請款審核。
      新廠商請先到「廠商名冊」建檔。
    </p>
    <div id="msg" role="alert"></div>
    <div id="ok" aria-live="polite"></div>

    <div id="reviewPanel">
    <div class="card">
      <div class="filters">
        <div class="field">
          <label for="filterStatus">狀態</label>
          <select id="filterStatus">
            <option value="open" selected>待處理（待審＋待認領）</option>
            <option value="待審">待審</option>
            <option value="待認領">待認領</option>
            <option value="已分類">已分類</option>
          </select>
        </div>
        <div class="field">
          <label for="filterKw">關鍵字</label>
          <input id="filterKw" placeholder="廠商名／檔名／來源" />
        </div>
        <div class="field-btn">
          <label>&nbsp;</label>
          <button type="button" class="btn btn-primary" id="reloadBtn">重新載入</button>
        </div>
      </div>
    </div>

    <div class="card">
      <p class="list-summary" id="listSummary">更新中…</p>
      <div id="list"></div>
    </div>
    </div>

    <div id="archivePanel" class="hidden">
      <div class="card">
        <label class="vendor-filter-label" for="filterVendorTrade">① 工項分類</label>
        <select id="filterVendorTrade"><option value="">請選工項分類</option></select>
        <label class="vendor-filter-label" for="pickVendorSelect">② 廠商</label>
        <select id="pickVendorSelect" disabled><option value="">請先選工項分類</option></select>
        <label class="vendor-filter-label" for="archiveDocType">檔案類型</label>
        <select id="archiveDocType"></select>
        <label class="vendor-filter-label" for="archiveProjectNo">案號（選填）</label>
        <input type="text" id="archiveProjectNo" placeholder="例：752" />
        <label class="vendor-filter-label" for="archiveTitle">備註（選填）</label>
        <input type="text" id="archiveTitle" placeholder="例：第三版報價、含安裝費" />
        <p class="sub" id="photoCountLine" style="margin:10px 0 0">已 0 / 30 個</p>
        <div class="drop-zone" id="dropZone" role="button" tabindex="0" aria-label="加入檔案">
          <p>拖曳檔案到這裡，或點一下選擇</p>
          <p class="hint">支援圖片、PDF、Word、Excel；手機可拍照、相簿或選檔案；單檔最多 10 MB</p>
          <input type="file" id="photoInput" accept="*/*" multiple />
        </div>
        <div class="photo-grid" id="photoGrid"></div>
        <button type="button" class="btn btn-primary" id="archiveSubmitBtn" disabled style="width:100%;margin-top:10px">上傳至廠商資料夾</button>
      </div>
      <div class="card">
        <p class="list-summary">最近上傳（此廠商）</p>
        <div id="archiveList">請先選擇廠商</div>
      </div>
    </div>
  </div>

  <div id="dropDlg" class="dlg-mask hidden" role="dialog" aria-modal="true" aria-labelledby="dropDlgTitle">
    <div class="dlg">
      <h3 id="dropDlgTitle">確定標為廢棄？</h3>
      <p>會從待處理移出。若只是標錯，請改切「已分類」再重標，不必廢棄。</p>
      <div class="dlg-actions">
        <button type="button" class="btn btn-ghost" id="dropCancelBtn" autofocus>取消</button>
        <button type="button" class="btn btn-danger" id="dropOkBtn">確定廢棄</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var CACHE_KEY = 'acct_quick_review_list_v1';
      var session = null;
      var items = [];
      var vendors = [];
      var busyId = '';
      var pendingDrop = null;
      var refreshTimer = null;
      var reloadBusy = false;
      var workTab = 'review';
      var archivePhotos = [];
      var archiveBusy = false;
      var canArchiveDelete = false;
      var MAX_PHOTOS_ARCHIVE = 30;
      var MAX_BYTES = 10 * 1024 * 1024;
      var BLOCKED_EXT = { exe: 1, bat: 1, cmd: 1, com: 1, msi: 1, scr: 1, ps1: 1, vbs: 1, js: 1, jar: 1 };

      function setMsg(t) {
        document.getElementById('msg').textContent = t || '';
        if (t) document.getElementById('ok').textContent = '';
      }
      function setOk(t) {
        document.getElementById('ok').textContent = t || '';
        if (t) document.getElementById('msg').textContent = '';
      }
      function setLive(text, refreshing) {
        var el = document.getElementById('liveStatus');
        el.textContent = text || '';
        el.classList.toggle('idle', !refreshing);
        el.classList.toggle('hidden', !text);
      }
      function showApp() {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
      }
      /** 後端未上快審 action 時，把「未知的 action」翻成人話 */
      function humanApiMsg(raw) {
        var t = String(raw || '');
        if (/未知的\s*action|unknown\s*action/i.test(t) ||
            (/quick_review_/i.test(t) && /未知|unknown|not\s*found|unsupported/i.test(t))) {
          return '後端尚未部署「單據快審」，目前無法載入或分類。畫面可先操作篩選／重新載入；要真的分類請先部署 accounting-gas（含 quick_review_*）。';
        }
        return t;
      }
      function showLoadFailedEmpty(detail) {
        if (items.length) return;
        document.getElementById('listSummary').textContent = '無法載入清單';
        document.getElementById('list').innerHTML =
          '<p class="sub">' + esc(detail || '請稍後再試。') + '</p>';
      }

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function cacheRead() {
        try {
          var raw = sessionStorage.getItem(CACHE_KEY);
          if (!raw) return null;
          return JSON.parse(raw);
        } catch (e) { return null; }
      }
      function cacheWrite(list, filterStatus) {
        try {
          sessionStorage.setItem(CACHE_KEY, JSON.stringify({
            at: Date.now(),
            status: filterStatus || 'open',
            items: list || []
          }));
        } catch (e) {}
      }

      function fileExt(name) {
        var n = String(name || '').toLowerCase();
        var dot = n.lastIndexOf('.');
        return dot > 0 ? n.slice(dot + 1) : '';
      }
      function isAllowedFile(file) {
        if (!file) return false;
        var ext = fileExt(file.name);
        if (ext && BLOCKED_EXT[ext]) return false;
        return true;
      }
      function guessMime(file) {
        var t = String((file && file.type) || '').toLowerCase();
        if (t) return t;
        var n = String((file && file.name) || '').toLowerCase();
        if (n.slice(-4) === '.pdf') return 'application/pdf';
        if (n.slice(-5) === '.docx') return 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
        if (n.slice(-4) === '.doc') return 'application/msword';
        if (n.slice(-5) === '.xlsx') return 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
        if (n.slice(-4) === '.xls') return 'application/vnd.ms-excel';
        return 'application/octet-stream';
      }
      function fileLabel(file) {
        var n = String((file && file.name) || '');
        return n.length > 28 ? n.slice(0, 12) + '…' + n.slice(-12) : n;
      }
      function uid() {
        return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }
      function fillArchiveDocTypes() {
        var sel = document.getElementById('archiveDocType');
        if (!sel || sel.options.length) return;
        (typeof AccountingMasterData !== 'undefined' ? (AccountingMasterData.vendor_doc_types || []) : []).forEach(function (t) {
          var opt = document.createElement('option');
          opt.value = t;
          opt.textContent = t;
          sel.appendChild(opt);
        });
      }
      function fillVendorTradeFilter() {
        var sel = document.getElementById('filterVendorTrade');
        if (!sel) return;
        var prev = sel.value;
        var cats = (typeof AccountingMasterData !== 'undefined' && AccountingMasterData.vendor_trade_categories)
          ? AccountingMasterData.vendor_trade_categories.slice()
          : [];
        sel.innerHTML = '<option value="">請選工項分類</option>';
        cats.forEach(function (c) {
          var opt = document.createElement('option');
          opt.value = c;
          opt.textContent = c;
          sel.appendChild(opt);
        });
        if (prev && Array.prototype.some.call(sel.options, function (o) { return o.value === prev; })) {
          sel.value = prev;
        }
      }
      function getFilteredVendors() {
        var trade = document.getElementById('filterVendorTrade').value;
        var list = vendors || [];
        if (!trade) return list;
        return list.filter(function (v) {
          var tc = (typeof AccountingMasterData !== 'undefined' && AccountingMasterData.normalizeVendorTradeCategory)
            ? AccountingMasterData.normalizeVendorTradeCategory(v.trade_category)
            : String(v.trade_category || '').trim();
          return tc === trade;
        });
      }
      function fillVendorDropdown() {
        var sel = document.getElementById('pickVendorSelect');
        var tradeSel = document.getElementById('filterVendorTrade');
        if (!sel) return;
        var prev = sel.value;
        var trade = tradeSel ? tradeSel.value : '';
        sel.innerHTML = '';
        if (!trade) {
          sel.disabled = true;
          var ph = document.createElement('option');
          ph.value = '';
          ph.textContent = '請先選工項分類';
          sel.appendChild(ph);
          return;
        }
        sel.disabled = false;
        var empty = document.createElement('option');
        empty.value = '';
        empty.textContent = '請選廠商';
        sel.appendChild(empty);
        getFilteredVendors().slice().sort(function (a, b) {
          return String(a.name || '').localeCompare(String(b.name || ''), 'zh-Hant');
        }).forEach(function (v) {
          var opt = document.createElement('option');
          opt.value = v.vendor_id;
          opt.textContent = v.name || v.vendor_id;
          sel.appendChild(opt);
        });
        if (prev && Array.prototype.some.call(sel.options, function (o) { return o.value === prev; })) {
          sel.value = prev;
        }
      }
      function updateArchiveUploadUi() {
        document.getElementById('photoCountLine').textContent =
          '已 ' + archivePhotos.length + ' / ' + MAX_PHOTOS_ARCHIVE + ' 個';
        var vid = document.getElementById('pickVendorSelect').value;
        document.getElementById('archiveSubmitBtn').disabled =
          archiveBusy || archivePhotos.length < 1 || !vid;
      }
      function renderArchivePhotos() {
        var grid = document.getElementById('photoGrid');
        grid.innerHTML = '';
        archivePhotos.forEach(function (p) {
          var tile = document.createElement('div');
          tile.className = 'photo-tile';
          var isImg = String(p.mimeType || '').indexOf('image/') === 0;
          if (isImg) {
            tile.innerHTML = '<img alt="預覽" /><button type="button" class="del">刪除</button>';
            tile.querySelector('img').src = 'data:' + p.mimeType + ';base64,' + p.dataBase64;
          } else {
            tile.innerHTML = '<div class="file-thumb"><strong>' +
              esc((fileExt(p.filename) || '檔').toUpperCase()) + '</strong></div>' +
              '<button type="button" class="del">刪除</button>';
          }
          tile.querySelector('.del').onclick = function () {
            archivePhotos = archivePhotos.filter(function (x) { return x.photo_id !== p.photo_id; });
            renderArchivePhotos();
          };
          grid.appendChild(tile);
        });
        updateArchiveUploadUi();
      }
      function readFileB64(file) {
        return new Promise(function (resolve, reject) {
          if (!isAllowedFile(file)) {
            reject(new Error('不支援的檔案類型：' + file.name));
            return;
          }
          if (file.size > MAX_BYTES) {
            reject(new Error('單檔不可超過 10 MB：' + file.name));
            return;
          }
          var mimeType = guessMime(file);
          var r = new FileReader();
          r.onload = function () {
            resolve({
              photo_id: uid(),
              filename: file.name,
              mimeType: mimeType,
              dataBase64: r.result.split(',')[1]
            });
          };
          r.onerror = reject;
          r.readAsDataURL(file);
        });
      }
      async function addArchiveFiles(fileList) {
        setMsg('');
        for (var i = 0; i < fileList.length; i++) {
          if (archivePhotos.length >= MAX_PHOTOS_ARCHIVE) {
            setMsg('最多 ' + MAX_PHOTOS_ARCHIVE + ' 個檔案');
            break;
          }
          try {
            var p = await readFileB64(fileList[i]);
            if (p) archivePhotos.push(p);
          } catch (e) {
            setMsg(e.message || String(e));
          }
        }
        renderArchivePhotos();
        document.getElementById('photoInput').value = '';
      }
      function renderArchiveList(rows) {
        var box = document.getElementById('archiveList');
        var vendorId = document.getElementById('pickVendorSelect').value;
        if (!vendorId) {
          box.textContent = '請先選擇廠商';
          return;
        }
        if (!rows.length) {
          box.textContent = '尚無紀錄';
          return;
        }
        box.innerHTML = '';
        rows.forEach(function (r) {
          var div = document.createElement('div');
          div.className = 'archive-item';
          var parts = [r.doc_type || '—'];
          if (r.project_no) parts.push('案' + r.project_no);
          if (r.title) parts.push(r.title);
          div.innerHTML =
            '<div><a href="' + esc(r.drive_url || '#') + '" target="_blank" rel="noopener">' +
            esc(r.filename || '開啟檔案') + '</a></div>' +
            '<div class="archive-item-meta">' + esc(parts.join(' · ')) +
            (r.uploaded_at ? ' · ' + esc(r.uploaded_at) : '') + '</div>';
          if (canArchiveDelete && r.vendor_doc_id) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn-warn';
            btn.textContent = '刪除檔案';
            btn.addEventListener('click', function () { deleteArchiveDoc(r.vendor_doc_id, btn); });
            div.appendChild(btn);
          }
          box.appendChild(div);
        });
      }
      async function loadArchiveList() {
        var vendorId = document.getElementById('pickVendorSelect').value;
        if (!vendorId) {
          renderArchiveList([]);
          return;
        }
        var data = await AccountingApi.vendorDocList(session, {
          vendor_id: vendorId,
          page_size: 20
        });
        if (!data.success) {
          document.getElementById('archiveList').textContent = data.message || '無法載入列表';
          return;
        }
        renderArchiveList(data.data || []);
      }
      async function deleteArchiveDoc(vendorDocId, btn) {
        if (!confirm('確定刪除此檔案？\n\n檔案會移入雲端硬碟垃圾桶，30 天內可還原。')) return;
        btn.disabled = true;
        try {
          var data = await AccountingApi.vendorDocDeactivate(session, vendorDocId);
          if (!data.success) throw new Error(data.message || '刪除失敗');
          setOk(data.message || '已刪除');
          await loadArchiveList();
        } catch (e) {
          setMsg(e.message || '刪除失敗');
          btn.disabled = false;
        }
      }
      async function submitArchive() {
        if (archiveBusy) return;
        var vendorId = document.getElementById('pickVendorSelect').value;
        var trade = document.getElementById('filterVendorTrade').value;
        if (!trade) { setMsg('請先選工項分類'); return; }
        if (!vendorId) { setMsg('請從下拉選擇廠商'); return; }
        if (!archivePhotos.length) { setMsg('請選擇至少一個檔案'); return; }
        if (!document.getElementById('archiveDocType').value) { setMsg('請選檔案類型'); return; }
        var btn = document.getElementById('archiveSubmitBtn');
        archiveBusy = true;
        updateArchiveUploadUi();
        btn.textContent = '上傳中…';
        AccountingUi.action('上傳至廠商資料夾', 'start');
        try {
          var data = await AccountingApi.vendorDocSubmit(session, {
            vendor_id: vendorId,
            doc_type: document.getElementById('archiveDocType').value,
            project_no: document.getElementById('archiveProjectNo').value.trim(),
            order_no: '',
            title: document.getElementById('archiveTitle').value.trim(),
            files: archivePhotos.map(function (p) {
              return { filename: p.filename, mimeType: p.mimeType, dataBase64: p.dataBase64 };
            })
          });
          if (!data.success) throw new Error(data.message || '上傳失敗');
          var folderNote = (data.folder && data.folder.drive_folder_url)
            ? ' · 已存進廠商資料夾'
            : '';
          setOk((data.message || '上傳成功') + folderNote);
          archivePhotos = [];
          renderArchivePhotos();
          await loadArchiveList();
          AccountingUi.action('上傳至廠商資料夾', 'ok');
        } catch (e) {
          setMsg(e.message || '上傳失敗');
          AccountingUi.action('上傳至廠商資料夾', 'fail');
        } finally {
          archiveBusy = false;
          btn.textContent = '上傳至廠商資料夾';
          updateArchiveUploadUi();
        }
      }
      function setWorkTab(tab, fromUser) {
        workTab = tab === 'archive' ? 'archive' : 'review';
        document.querySelectorAll('#workTabSeg button').forEach(function (btn) {
          btn.classList.toggle('active', btn.getAttribute('data-tab') === workTab);
        });
        document.getElementById('reviewPanel').classList.toggle('hidden', workTab === 'archive');
        document.getElementById('archivePanel').classList.toggle('hidden', workTab !== 'archive');
        document.getElementById('reviewHint').classList.toggle('hidden', workTab === 'archive');
        document.getElementById('archiveHint').classList.toggle('hidden', workTab !== 'archive');
        if (fromUser) AccountingUi.tap(workTab === 'archive' ? '手動存檔' : '待審單據');
        if (workTab === 'archive') {
          fillArchiveDocTypes();
          fillVendorTradeFilter();
          fillVendorDropdown();
          loadArchiveList().catch(function () {});
        }
      }

      function vendorOptionsHtml(selectedId) {
        var opts = ['<option value="">— 選擇廠商 —</option>'];
        vendors.forEach(function (v) {
          var id = v.vendor_id || '';
          if (!id) return;
          var sel = id === selectedId ? ' selected' : '';
          opts.push('<option value="' + esc(id) + '"' + sel + '>' + esc(v.name || id) + '</option>');
        });
        return opts.join('');
      }

      function shortTime(s) {
        var t = String(s || '');
        if (t.length >= 16) return t.slice(5, 16).replace('T', ' ');
        return t;
      }

      function mediaHtml(it) {
        var isPdf = String(it.mime_type || '').toLowerCase().indexOf('pdf') >= 0 ||
          String(it.filename || '').toLowerCase().indexOf('.pdf') >= 0;
        var openUrl = it.drive_url || '';
        if (it.drive_file_id && !isPdf) {
          var thumb = 'https://drive.google.com/thumbnail?id=' +
            encodeURIComponent(it.drive_file_id) + '&sz=w200';
          return (
            '<button type="button" class="item-media" data-open="' + esc(openUrl) + '" title="開啟原圖">' +
              '<img src="' + esc(thumb) + '" alt="" loading="lazy" decoding="async" width="72" height="72" />' +
            '</button>'
          );
        }
        return (
          '<button type="button" class="item-media pdf" data-open="' + esc(openUrl) + '" title="開啟檔案">' +
            (isPdf ? 'PDF' : '檔案') +
          '</button>'
        );
      }

      function renderList() {
        var box = document.getElementById('list');
        var summary = document.getElementById('listSummary');
        if (!items.length) {
          summary.textContent = '目前沒有符合條件的單據。';
          box.innerHTML = '<p class="sub">傳圖後會出現在這裡。</p>';
          return;
        }
        summary.textContent = '共 ' + items.length + ' 筆（分類後會立刻從清單移除）';
        box.innerHTML = items.map(function (it) {
          var unclaimed = it.status === '待認領';
          return (
            '<div class="item' + (unclaimed ? ' unclaimed' : '') + '" data-id="' + esc(it.quick_review_id) + '">' +
              mediaHtml(it) +
              '<div class="item-main">' +
                '<div class="headline">' + esc(it.vendor_name || '（未對廠商）') + '</div>' +
                '<div class="meta-row">' +
                  '<span class="tag' + (unclaimed ? ' warn' : '') + '">' + esc(it.status || '') + '</span>' +
                  (it.category ? ('<span class="tag">' + esc(it.category) + '</span>') : '') +
                  '<span class="tag">' + esc(it.source || '') + '</span>' +
                '</div>' +
                '<p class="time-line">' + esc(shortTime(it.created_at)) +
                  (it.created_by ? (' · ' + esc(it.created_by)) : '') + '</p>' +
                '<p class="mono">' + esc(it.filename || '') + '</p>' +
              '</div>' +
              '<div class="item-body">' +
                '<div class="claim-row">' +
                  '<label>認領廠商（待認領必選）</label>' +
                  '<select class="claim-vendor">' + vendorOptionsHtml(it.vendor_id || '') + '</select>' +
                '</div>' +
                '<div class="actions" data-actions>' +
                  '<button type="button" class="btn btn-cat pay" data-cat="請款">請款</button>' +
                  '<button type="button" class="btn btn-cat" data-cat="報價">報價</button>' +
                  '<button type="button" class="btn btn-cat" data-cat="出貨">出貨</button>' +
                  '<button type="button" class="btn btn-cat" data-cat="其他">其他</button>' +
                  '<button type="button" class="btn btn-cat drop" data-cat="廢棄">廢棄</button>' +
                '</div>' +
              '</div>' +
            '</div>'
          );
        }).join('');
      }

      function openDropConfirm(itemEl, btn) {
        pendingDrop = { itemEl: itemEl, btn: btn };
        document.getElementById('dropDlg').classList.remove('hidden');
        var cancel = document.getElementById('dropCancelBtn');
        if (cancel) cancel.focus();
      }
      function closeDropConfirm() {
        pendingDrop = null;
        document.getElementById('dropDlg').classList.add('hidden');
      }

      async function reload(opts) {
        var silent = opts && opts.silent;
        if (reloadBusy) return;
        reloadBusy = true;
        setMsg('');
        if (!silent) setOk('');
        setLive('更新中…', true);
        document.getElementById('listSummary').textContent =
          items.length ? ('共 ' + items.length + ' 筆（更新中…）') : '更新中…';
        AccountingUi.action('載入快審清單', 'start');
        try {
          var status = document.getElementById('filterStatus').value;
          var data = await AccountingApi.quickReviewList(session, {
            status: status,
            keyword: document.getElementById('filterKw').value.trim()
          });
          if (!data.success) {
            var failMsg = humanApiMsg(data.message || '載入失敗');
            setMsg(failMsg);
            setLive('載入失敗', false);
            showLoadFailedEmpty(failMsg);
            AccountingUi.action('載入快審清單', 'fail');
            return;
          }
          items = data.items || [];
          cacheWrite(items, status);
          renderList();
          setLive('已更新', false);
          if (refreshTimer) clearTimeout(refreshTimer);
          refreshTimer = setTimeout(function () { setLive('', false); }, 1600);
          AccountingUi.action('載入快審清單', 'ok');
        } catch (e) {
          var errMsg = humanApiMsg(e.message || String(e));
          if (/abort|timeout|逾時/i.test(errMsg)) {
            errMsg = '載入逾時，請再按「重新載入」。若持續失敗，可能是後端尚未部署快審。';
          }
          setMsg(errMsg);
          setLive('載入失敗', false);
          showLoadFailedEmpty(errMsg);
          AccountingUi.action('載入快審清單', 'fail');
        } finally {
          reloadBusy = false;
        }
      }

      function resolveVendorId(itemEl, row) {
        var vendorId = '';
        var claimSel = itemEl.querySelector('.claim-vendor');
        if (claimSel) vendorId = claimSel.value || '';
        if (row && row.vendor_id && !vendorId) vendorId = row.vendor_id;
        return vendorId;
      }

      async function classify(itemEl, category, btn) {
        var id = itemEl.getAttribute('data-id');
        if (!id || busyId) return;
        var row = items.filter(function (x) { return x.quick_review_id === id; })[0];
        var vendorId = resolveVendorId(itemEl, row);
        var unclaimed = row && row.status === '待認領';
        if ((category === '請款' || unclaimed) && !vendorId) {
          setMsg(unclaimed ? '待認領請先選擇廠商再分類' : '請款前請先選擇廠商');
          return;
        }
        busyId = id;
        var buttons = itemEl.querySelectorAll('[data-cat]');
        buttons.forEach(function (b) { b.disabled = true; });
        if (btn) btn.textContent = '處理中…';
        setMsg('');
        setOk('');

        var prevItems = items.slice();
        var filterStatus = document.getElementById('filterStatus').value;
        var leaveList = filterStatus === 'open' || filterStatus === '待審' || filterStatus === '待認領';
        if (leaveList) {
          itemEl.classList.add('removing');
          items = items.filter(function (x) { return x.quick_review_id !== id; });
          document.getElementById('listSummary').textContent =
            items.length ? ('共 ' + items.length + ' 筆（分類後會立刻從清單移除）') : '目前沒有符合條件的單據。';
        }

        AccountingUi.action('快審分類 ' + category, 'start');
        try {
          var data = await AccountingApi.quickReviewClassify(session, {
            quick_review_id: id,
            category: category,
            vendor_id: vendorId
          });
          if (!data.success) {
            items = prevItems;
            renderList();
            setMsg(humanApiMsg(data.message || '分類失敗'));
            AccountingUi.action('快審分類 ' + category, 'fail');
            return;
          }
          setOk('已標為「' + category + '」');
          AccountingUi.action('快審分類 ' + category, 'ok');
          cacheWrite(items, filterStatus);
          if (category === '請款' && data.payment_url) {
            var href = data.payment_url;
            try {
              var u = new URL(href, window.location.href);
              href = u.pathname.replace(/^.*\/modules\/accounting\//, '') + u.search;
            } catch (eUrl) {
              href = 'payment_request.html?mode=payment&from=quick_review' +
                (data.pending_token ? ('&pending=' + encodeURIComponent(data.pending_token)) : '') +
                (vendorId ? ('&vendor_id=' + encodeURIComponent(vendorId)) : '');
            }
            setOk('已標為請款，前往待付款申請（請盡快完成載入）…');
            window.location.href = href;
            return;
          }
          if (!leaveList) {
            if (row) {
              row.status = '已分類';
              row.category = category;
            }
            renderList();
          } else if (!items.length) {
            renderList();
          } else {
            itemEl.remove();
          }
        } catch (e) {
          items = prevItems;
          renderList();
          setMsg(humanApiMsg(e.message || String(e)));
          AccountingUi.action('快審分類 ' + category, 'fail');
        } finally {
          busyId = '';
        }
      }

      document.getElementById('list').addEventListener('click', function (ev) {
        var openBtn = ev.target.closest('[data-open]');
        if (openBtn) {
          var url = openBtn.getAttribute('data-open');
          if (url) window.open(url, '_blank', 'noopener');
          return;
        }
        var btn = ev.target.closest('[data-cat]');
        if (!btn) return;
        var item = ev.target.closest('.item');
        if (!item) return;
        var cat = btn.getAttribute('data-cat');
        if (cat === '廢棄') {
          openDropConfirm(item, btn);
          return;
        }
        classify(item, cat, btn);
      });

      document.getElementById('dropCancelBtn').addEventListener('click', closeDropConfirm);
      document.getElementById('dropOkBtn').addEventListener('click', function () {
        if (!pendingDrop) { closeDropConfirm(); return; }
        var itemEl = pendingDrop.itemEl;
        var btn = pendingDrop.btn;
        closeDropConfirm();
        classify(itemEl, '廢棄', btn);
      });
      document.getElementById('dropDlg').addEventListener('click', function (ev) {
        if (ev.target === document.getElementById('dropDlg')) closeDropConfirm();
      });

      document.getElementById('reloadBtn').addEventListener('click', function () { reload(); });
      document.getElementById('filterStatus').addEventListener('change', function () { reload(); });
      document.getElementById('workTabSeg').addEventListener('click', function (e) {
        var btn = e.target.closest('[data-tab]');
        if (!btn) return;
        setWorkTab(btn.getAttribute('data-tab'), true);
      });
      document.getElementById('filterVendorTrade').addEventListener('change', function () {
        fillVendorDropdown();
        loadArchiveList().catch(function () {});
        updateArchiveUploadUi();
      });
      document.getElementById('pickVendorSelect').addEventListener('change', function () {
        loadArchiveList().catch(function () {});
        updateArchiveUploadUi();
      });
      document.getElementById('archiveSubmitBtn').addEventListener('click', function () { submitArchive(); });
      document.getElementById('photoInput').addEventListener('change', function (e) {
        addArchiveFiles(e.target.files || []);
      });
      var dropZone = document.getElementById('dropZone');
      dropZone.addEventListener('click', function (e) {
        if (e.target && e.target.id === 'photoInput') return;
        document.getElementById('photoInput').click();
      });
      dropZone.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          document.getElementById('photoInput').click();
        }
      });
      ['dragenter', 'dragover'].forEach(function (ev) {
        dropZone.addEventListener(ev, function (e) {
          e.preventDefault();
          dropZone.classList.add('drag-over');
        });
      });
      dropZone.addEventListener('dragleave', function () { dropZone.classList.remove('drag-over'); });
      dropZone.addEventListener('drop', function (e) {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        addArchiveFiles(e.dataTransfer.files || []);
      });

      var kwTimer = null;
      document.getElementById('filterKw').addEventListener('input', function () {
        if (kwTimer) clearTimeout(kwTimer);
        kwTimer = setTimeout(function () { reload({ silent: true }); }, 400);
      });

      (async function boot() {
        if (typeof AccountingUi !== 'undefined' && AccountingUi.init) {
          AccountingUi.init();
          // 本頁用 #msg／#ok 當常駐說明；不要被 UI 套件藏掉
          ['msg', 'ok'].forEach(function (id) {
            var el = document.getElementById(id);
            if (el) el.classList.remove('acct-ui-hide-legacy');
          });
        }
        if (typeof AccountingNav !== 'undefined') AccountingNav.init();
        try {
          AccountingUi.action('開啟單據與存檔', 'start');
          session = await AccountingApi.initSession({
            minPermission: AccountingApi.INGEST_MIN_PERMISSION
          });
          if (!session) return;
          canArchiveDelete = (session.auth.permission || 0) >= AccountingApi.MIN_PERMISSION;
          document.getElementById('userLine').textContent =
            (session.auth.display_name || session.profile.displayName) +
            ' · 權限 ' + session.auth.permission +
            (session.fromHub ? ' · 主控台' : (session.devBypass ? ' · 測試模式（無登入）' : ''));
          fillArchiveDocTypes();
          fillVendorTradeFilter();
          var tabQ = '';
          try { tabQ = new URLSearchParams(window.location.search).get('tab') || ''; } catch (eTab) {}
          setWorkTab(tabQ === 'archive' ? 'archive' : 'review', false);
          // 先出殼：不要等主檔／清單，避免整頁卡在「載入中」
          showApp();
          setLive('更新中…', true);
          var cached = cacheRead();
          var curStatus = document.getElementById('filterStatus').value;
          if (cached && cached.items && cached.status === curStatus) {
            items = cached.items;
            renderList();
            setLive('更新中…', true);
          }
          // 先載清單；主檔（廠商）背景補，避免跟清單搶連線拖慢
          await reload({ silent: !!(cached && cached.items && cached.items.length) });
          if (typeof AccountingCache !== 'undefined') {
            try {
              vendors = AccountingCache.vendors(session) || AccountingCache.peekVendors() || [];
              if (vendors.length) fillVendorDropdown();
              if (!vendors.length && AccountingCache.needsStaffBootstrap(session)) {
                AccountingCache.load(session, false).then(function () {
                  vendors = AccountingCache.vendors(session) || [];
                  if (vendors.length && items.length) renderList();
                  fillVendorDropdown();
                }).catch(function () {});
              }
            } catch (eCache) {}
          }
          AccountingUi.action('開啟單據與存檔', 'ok');
        } catch (e) {
          document.getElementById('loading').textContent = humanApiMsg(e.message || String(e));
          document.getElementById('loading').classList.remove('hidden');
          AccountingUi.action('開啟單據與存檔', 'fail');
        }
      })();
    })();
  </script>
</body>
</html>
