<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>款項進度</title>
  <link rel="stylesheet" href="../../shared/css/accounting_layout.css?v=5" />
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="../../shared/js/operator_context.js?v=3"></script>
  <script src="../../shared/js/accounting_api.js?v=59"></script>
  <script src="../../shared/js/hub_ref_cache.js?v=2"></script>
  <script src="../../shared/js/accounting_list_cache.js?v=5"></script>
  <script src="../../shared/js/accounting_ui.js?v=25"></script>
  <script src="../../shared/js/accounting_nav.js?v=2"></script>
  <script src="../../shared/js/accounting_boot.js?v=9"></script>
  <style>
    h2 { margin: 0 0 8px; }
    h3 { margin: 16px 0 8px; font-size: 15px; color: #333; }
    .sub { color: #555; font-size: 14px; }
    .card { background: #fff; border-radius: 12px; padding: 14px; margin: 12px 0; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .item { border-bottom: 1px solid #eee; padding: 12px 0; }
    .item:last-child { border-bottom: none; }
    .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: #e8f0fe; margin-right: 6px; margin-top: 4px; }
    .tag.warn { background: #fef7e0; color: #b06000; }
    .tag.ok { background: #e6f4ea; color: #137333; }
    .tag.bad { background: #fce8e6; color: #c5221f; }
    .photos a { display: inline-block; font-size: 13px; margin-right: 8px; color: #1a73e8; }
    #msg { color: #c5221f; font-size: 14px; font-weight: 600; }
    .list-status { font-size: 13px; font-weight: 600; color: #1a73e8; margin-left: 8px; }
    .list-status.err { color: #c5221f; }
    .hidden { display: none; }
    .nav { margin-bottom: 12px; font-size: 14px; }
    .nav a { color: #1a73e8; text-decoration: none; }
    .empty { color: #888; font-size: 14px; padding: 8px 0; }
    .btn { padding: 10px 14px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-primary { background: #1a73e8; color: #fff; }
    .btn-block { width: 100%; margin: 10px 0; padding: 12px; }
  </style>
</head>
<body class="acct-page acct-page-form">
  <div id="loading">載入中…</div>
  <div id="app" class="hidden acct-main">
    <p class="nav"><a href="index.html">← 會計功能選單</a></p>
    <h2>款項進度 <span id="listStatus" class="list-status hidden"></span></h2>
    <p class="sub" id="userLine">—</p>
    <div id="msg"></div>
    <button type="button" class="btn btn-primary btn-block" id="reloadBtn">重新整理</button>
    <div id="list"></div>
  </div>
  <script>
    (function () {
      var session = null;
      var lastSuccessData = null;
      var STAGE_ORDER = ['請款待審', '待匯款', '已匯款', '已退回', '收支紀錄'];
      var STAGE_LABEL = {
        '請款待審': '待審核',
        '待匯款': '待匯款',
        '已匯款': '已匯款',
        '已退回': '已退回',
        '收支紀錄': '其他收支'
      };

      function humanErr(e) {
        return (e && e.message) || String(e) || '載入失敗，請再試';
      }
      function setMsg(t) {
        var el = document.getElementById('msg');
        if (el) el.textContent = t || '';
        if (t) AccountingUi.notify('err', t);
      }
      function setListStatus(text, isErr) {
        var el = document.getElementById('listStatus');
        if (!el) return;
        el.textContent = text || '';
        el.classList.toggle('hidden', !text);
        el.classList.toggle('err', !!isErr);
      }
      function bindRetry(btn) {
        if (!btn) return;
        btn.addEventListener('click', function () { loadList(true); });
      }
      function showApp() {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
      }
      function tagClass(stage) {
        if (stage === '請款待審' || stage === '待匯款') return 'tag warn';
        if (stage === '已匯款') return 'tag ok';
        if (stage === '已退回') return 'tag bad';
        return 'tag';
      }
      function renderPhotos(urls) {
        if (!urls || !urls.length) return '';
        var html = '<div class="photos">';
        urls.forEach(function (u, i) {
          html += '<a href="' + u + '" target="_blank" rel="noopener">附件' + (i + 1) + '</a>';
        });
        return html + '</div>';
      }
      function renderItem(it) {
        var amt = Number(it.amount || 0).toLocaleString();
        var meta = (it.txn_date || '') +
          (it.project_no ? ' · 案號 ' + it.project_no : '') +
          (it.store ? ' · ' + it.store : '') +
          ' · $' + amt;
        var tags = '<span class="' + tagClass(it.stage) + '">' + (STAGE_LABEL[it.stage] || it.stage) + '</span>';
        if (it.review_status && it.stage !== '收支紀錄') {
          tags += '<span class="tag">' + it.review_status + '</span>';
        }
        if (it.payment_status && it.stage !== '收支紀錄') {
          tags += '<span class="tag">' + it.payment_status + '</span>';
        }
        var reject = it.reject_reason
          ? '<div class="sub" style="color:#c5221f">' + it.reject_reason + '</div>'
          : '';
        return '<div class="item">' +
          '<div><strong>' + (it.summary || '—') + '</strong></div>' +
          '<div class="sub">' + meta + '</div>' +
          '<div>' + tags + '</div>' +
          reject +
          renderPhotos(it.attachment_urls) +
          '</div>';
      }
      function renderOkItems(data) {
        var box = document.getElementById('list');
        box.innerHTML = '';
        if (data.vendor && data.vendor.name) {
          var head = document.createElement('p');
          head.className = 'sub';
          head.textContent = '廠商：' + data.vendor.name;
          box.appendChild(head);
        }
        var items = data.items || [];
        if (!items.length) {
          var empty = document.createElement('div');
          empty.className = 'card empty';
          empty.textContent = '目前沒有符合的款項紀錄';
          box.appendChild(empty);
          return;
        }
        var groups = {};
        items.forEach(function (it) {
          var st = it.stage || '收支紀錄';
          if (!groups[st]) groups[st] = [];
          groups[st].push(it);
        });
        STAGE_ORDER.forEach(function (stage) {
          var list = groups[stage];
          if (!list || !list.length) return;
          var card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = '<h3>' + (STAGE_LABEL[stage] || stage) + '（' + list.length + '）</h3>';
          list.forEach(function (it) {
            card.innerHTML += renderItem(it);
          });
          box.appendChild(card);
        });
      }
      function renderFail(message, keepItems) {
        var msg = message || '載入失敗，請再試';
        setMsg(msg);
        setListStatus('讀不到', true);
        var box = document.getElementById('list');
        var retryBtn = document.createElement('button');
        retryBtn.type = 'button';
        retryBtn.className = 'btn btn-primary';
        retryBtn.textContent = '再試一次';
        bindRetry(retryBtn);
        if (keepItems && lastSuccessData && (lastSuccessData.items || []).length) {
          renderOkItems(lastSuccessData);
          var banner = document.createElement('div');
          banner.className = 'card';
          var p = document.createElement('p');
          p.className = 'sub';
          p.style.color = '#c5221f';
          p.style.margin = '0 0 8px';
          p.textContent = msg + '（仍顯示先前內容）';
          banner.appendChild(p);
          banner.appendChild(retryBtn);
          box.insertBefore(banner, box.firstChild);
          return;
        }
        box.innerHTML = '';
        var card = document.createElement('div');
        card.className = 'card';
        var p2 = document.createElement('p');
        p2.style.margin = '0 0 10px';
        p2.textContent = msg;
        card.appendChild(p2);
        card.appendChild(retryBtn);
        box.appendChild(card);
      }
      function applySuccess(data) {
        lastSuccessData = data;
        setMsg('');
        setListStatus('');
        renderOkItems(data);
      }
      async function fetchStatusOnce() {
        var data = await AccountingApi.vendorPaymentStatus(session);
        if (!data || !data.success) {
          throw new Error((data && data.message) || '查詢失敗，請再試');
        }
        return data;
      }
      async function fetchStatusRetry() {
        try {
          return await fetchStatusOnce();
        } catch (e1) {
          return await fetchStatusOnce();
        }
      }
      async function loadList(force) {
        var peeked = (typeof AccountingListCache !== 'undefined')
          ? AccountingListCache.peek(session, 'vendor_status') : null;
        if (peeked && peeked.success) {
          lastSuccessData = peeked;
          renderOkItems(peeked);
          setListStatus(force ? '強制更新中…' : '更新中…', false);
        } else {
          var box = document.getElementById('list');
          if (!box.innerHTML) {
            box.innerHTML = '<div class="card empty">載入中…</div>';
          }
          setListStatus('載入中…', false);
        }
        var useForce = !!force || !!(peeked && !peeked.success);
        try {
          var data;
          if (typeof AccountingListCache !== 'undefined') {
            data = await AccountingListCache.load(session, 'vendor_status', fetchStatusRetry, {
              force: useForce,
              onUpdate: function (fresh, err) {
                if (fresh && fresh.success) applySuccess(fresh);
                else if (err) renderFail(humanErr(err), true);
              }
            });
          } else {
            data = await fetchStatusRetry();
          }
          if (data && data.success) applySuccess(data);
          else renderFail((data && data.message) || '查詢失敗，請再試', !!lastSuccessData);
        } catch (e) {
          renderFail(humanErr(e), !!lastSuccessData);
        }
      }
      document.getElementById('reloadBtn').addEventListener('click', function () {
        var btn = document.getElementById('reloadBtn');
        AccountingUi.runAsync(btn, { busyLabel: '載入中…', clear: false }, function () {
          return loadList(true);
        }).catch(function (e) {
          renderFail(humanErr(e), !!lastSuccessData);
        });
      });
      (async function boot() {
        await AccountingBoot.run({
          minPermission: 0,
          deniedMsg: '需已登記廠商或財務權限（≥4）',
          initSession: async function () {
            var s = await AccountingApi.initPaymentRequestSession();
            if (!s) return null;
            var isVendor = String(s.auth.status || '') === '廠商';
            var isStaff = (s.auth.permission || 0) >= AccountingApi.MIN_PERMISSION;
            if (!isVendor && !isStaff) {
              throw new Error('需已登記廠商或財務權限（≥4）');
            }
            return s;
          },
          onReady: async function (sess) {
            session = sess;
            var isVendor = String(sess.auth.status || '') === '廠商';
            var isStaff = (sess.auth.permission || 0) >= AccountingApi.MIN_PERMISSION;
            if (!isVendor && !isStaff) {
              AccountingBoot.setLoading('需已登記廠商或財務權限（≥4）');
              return;
            }
            try {
              await loadList(false);
            } catch (e) {
              renderFail(humanErr(e), !!lastSuccessData);
            }
          }
        });
      })();
    })();
  </script>
</body>
</html>
