<script>
const CASE_IDS=[700,658,645,640,639,630,621,611,608,600,596,591,589,587,583,578,567,552,551,548,544,523,517,513,507,493,479,441,439,404,398,392,386,339,318,315,301,293,292,291,288,284,243,232,223,209,202,195,193,157,150,149,145,144];
const grid=document.getElementById('case-grid');
const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function fallbackTitle(id){return `添心設計完工案例 #${id}`}
function cardShell(id){const a=document.createElement('a');a.className='card loading';a.href=`${id}.html`;a.innerHTML=`<div class="placeholder"></div><div class="body"><div class="id">#${id}</div><h2>${fallbackTitle(id)}</h2><p>載入案件摘要中…</p></div>`;return a}
async function hydrateCard(id,card){
  try{
    const r=await fetch(`${id}.html`,{cache:'force-cache'});if(!r.ok)throw new Error(r.status);
    const html=await r.text(),doc=new DOMParser().parseFromString(html,'text/html');
    const og=(p)=>doc.querySelector(`meta[property="${p}"]`)?.content||'';
    const meta=(n)=>doc.querySelector(`meta[name="${n}"]`)?.content||'';
    const title=og('og:title')||doc.querySelector('title')?.textContent||fallbackTitle(id);
    const desc=og('og:description')||meta('description')||'查看本案完整空間重點與官方 YouTube 完工影片。';
    const image=og('og:image')||doc.querySelector('meta[name="twitter:image"]')?.content||'';
    card.classList.remove('loading');
    card.innerHTML=`${image?`<img src="${esc(image)}" alt="${esc(title)}" loading="lazy">`:'<div class="placeholder"></div>'}<div class="body"><div class="id">#${id}</div><h2>${esc(title.replace(/\s*[-｜|]\s*添心.*$/,''))}</h2><p>${esc(desc)}</p></div>`;
  }catch(e){card.classList.remove('loading');card.innerHTML=`<div class="placeholder"></div><div class="body"><div class="id">#${id}</div><h2>${fallbackTitle(id)}</h2><p>查看本案完整空間重點與官方影片。</p></div>`}
}
const cards=CASE_IDS.map(id=>{const c=cardShell(id);grid.appendChild(c);return [id,c]});
const run=async()=>{for(let i=0;i<cards.length;i+=6){await Promise.all(cards.slice(i,i+6).map(([id,c])=>hydrateCard(id,c)))}};run();
const itemList=CASE_IDS.map((id,i)=>({"@type":"ListItem",position:i+1,url:`https://info.tanxin.space/modules/info/cases/${id}.html`,name:`案例 #${id}`}));
document.getElementById('case-schema').textContent=JSON.stringify({"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://tanxin.space/#organization",name:"添心室內裝修設計",url:"https://tanxin.space/"},{"@type":"CollectionPage","@id":"https://info.tanxin.space/modules/info/cases/#page",url:"https://info.tanxin.space/modules/info/cases/",name:"添心設計完工案例",description:"添心設計 54 個公開完工案例列表。",isPartOf:{"@id":"https://tanxin.space/#organization"},mainEntity:{"@type":"ItemList",numberOfItems:54,itemListElement:itemList}},{"@type":"BreadcrumbList",itemListElement:[{"@type":"ListItem",position:1,name:"添心設計",item:"https://tanxin.space/"},{"@type":"ListItem",position:2,name:"室內裝修常見問題",item:"https://info.tanxin.space/modules/info/SQAQ2.html"},{"@type":"ListItem",position:3,name:"完工案例",item:"https://info.tanxin.space/modules/info/cases/"}]}]});
</script>
