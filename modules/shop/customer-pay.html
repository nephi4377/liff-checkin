<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>訂單付款</title>
  <style>
    body { margin: 0; font-family: "Noto Sans TC", "PingFang TC", sans-serif; background: #f5f3f0; color: #222; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.1rem; }
    .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 14px; }
    .ono { font-weight: 700; font-size: 1.05rem; }
    .amt { font-size: 1.4rem; font-weight: 700; color: #c62828; margin: 10px 0; }
    .note { font-size: 13px; color: #666; line-height: 1.5; }
    .expire { font-size: 12px; color: #9a3412; margin-top: 10px; }
    button { width: 100%; margin-top: 14px; padding: 12px; border: none; border-radius: 8px; background: #c62828; color: #fff; font-weight: 700; font-size: 15px; }
    .sub { font-size: 12px; color: #888; margin-top: 10px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>需付款</h1>
    <div class="card" id="box">載入中…</div>
  </div>
  <script type="module">
    import { CONFIG } from '../../shared/js/config.js';
    window.CONFIG = CONFIG;
  </script>
  <script src="../../shared/js/shop_api.js"></script>
  <script>
    var params = new URLSearchParams(location.search);
    var orderNo = params.get('order') || 'TXS-10001';
    ShopApi.getOrder({}, orderNo).then(function (res) {
      var box = document.getElementById('box');
      if (!res.success) { box.textContent = res.message || '找不到訂單'; return; }
      var o = res.data.order;
      var ex = res.data.expire || ShopApi.expireInfo(o);
      if (o.status === 'paid') {
        box.innerHTML = '<div class="ono">訂單編號 ' + o.order_number + '</div><p>此單已由店員標記為已付款。</p>';
        return;
      }
      box.innerHTML =
        '<div class="ono">訂單編號 ' + o.order_number + '</div>' +
        '<div class="amt">NT$ ' + Number(o.total).toLocaleString('zh-TW') + '</div>' +
        '<p class="note">' + (o.items_summary || '') + '</p>' +
        (ex.expires ? '<div class="expire">' + ex.message + '</div>' : '') +
        '<button type="button" id="btnPay">在 LINE 完成付款（示意）</button>' +
        '<p class="sub">付完後狀態不會自動變成已付款；店員會在後台「標記已付款」。請保留訂單編號。</p>';
      document.getElementById('btnPay').onclick = function () {
        alert('示意：此處接 LINE 內金流。付完請等候店員標記已付款（訂單編號 ' + o.order_number + '）。');
      };
    });
  </script>
</body>
</html>
