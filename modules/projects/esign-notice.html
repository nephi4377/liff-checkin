<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>簽約注意事項</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    /* 與客戶財務 portal 同一客戶 LIFF */
    var ESIGN_NOTICE_LIFF_ID = '2007974938-d2y1uA1G';
  </script>
  <style>
    :root {
      --ink: #1c2430;
      --muted: #5b6675;
      --line: #d7dde6;
      --bg: #eef2f6;
      --card: #ffffff;
      --accent: #2f6f7e;
      --accent-dark: #245864;
      --warn: #8a5a16;
      --danger: #a33b32;
      --ok: #2f6b46;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: "Noto Sans TC", "PingFang TC", "Hiragino Sans GB", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 110% 70% at 100% -10%, rgba(47, 111, 126, 0.12), transparent 55%),
        radial-gradient(ellipse 90% 50% at -15% 80%, rgba(143, 168, 183, 0.16), transparent 50%),
        linear-gradient(165deg, #eef2f6 0%, #e7edf3 55%, #e2e9f0 100%);
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 1rem 1rem 5rem; }
    .hero {
      padding: 1rem 1.1rem 1.05rem;
      border-radius: 0.85rem;
      background: linear-gradient(145deg, rgba(255,255,255,0.98), rgba(246,249,251,0.94));
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: 0 10px 36px -18px rgba(28,36,48,0.28);
      margin-bottom: 1rem;
    }
    .hero h1 { margin: 0; font-size: 1.25rem; letter-spacing: 0.02em; }
    .hero .sub { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.9rem; line-height: 1.45; }
    .badge {
      display: inline-block;
      margin-top: 0.55rem;
      font-size: 0.78rem;
      color: var(--accent-dark);
      background: rgba(47,111,126,0.1);
      border: 1px solid rgba(47,111,126,0.18);
      padding: 0.2rem 0.55rem;
      border-radius: 0.4rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 0.85rem;
      padding: 1rem 1.05rem;
      box-shadow: 0 8px 28px -20px rgba(28,36,48,0.35);
    }
    .progress {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.85rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .progress strong { color: var(--ink); }
    .item-title {
      font-size: 1.02rem;
      font-weight: 700;
      margin: 0 0 0.55rem;
    }
    .item-body {
      white-space: pre-wrap;
      line-height: 1.65;
      font-size: 0.98rem;
    }
    .img-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
      margin-top: 0.85rem;
    }
    @media (max-width: 420px) {
      .img-grid { grid-template-columns: 1fr; }
    }
    .img-ph {
      border: 1px dashed #b7c2ce;
      border-radius: 0.55rem;
      min-height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0.6rem;
      color: var(--muted);
      font-size: 0.82rem;
      background: #f7fafc;
    }
    .img-ph img { max-width: 100%; border-radius: 0.4rem; }
    .fee-stack { display: grid; gap: 0.7rem; margin-top: 0.85rem; }
    .fee-card {
      border: 1px solid var(--line);
      border-radius: 0.7rem;
      padding: 0.75rem 0.8rem;
      background: #f8fafb;
    }
    .fee-card h4 { margin: 0 0 0.35rem; font-size: 0.95rem; }
    .fee-card p { margin: 0.25rem 0; font-size: 0.88rem; line-height: 1.45; color: #334155; }
    .fee-card .label { color: var(--muted); font-size: 0.78rem; }
    .extra-sec { margin-top: 0.9rem; }
    .extra-sec h4 { margin: 0 0 0.35rem; font-size: 0.95rem; }
    .extra-sec ul { margin: 0; padding-left: 1.1rem; }
    .extra-sec li { margin: 0.25rem 0; line-height: 1.45; font-size: 0.9rem; }
    .actions {
      display: flex;
      gap: 0.55rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    button, .btn {
      appearance: none;
      border: 0;
      border-radius: 0.55rem;
      padding: 0.72rem 1rem;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    button:disabled, .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-secondary { background: #e8eef2; color: var(--ink); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    .msg { margin: 0.75rem 0; color: var(--danger); font-size: 0.92rem; }
    .ok { color: var(--ok); }
    .sign-box { margin-top: 0.85rem; }
    #signCanvas {
      width: 100%;
      height: 180px;
      border: 1px solid #c5ced8;
      border-radius: 0.65rem;
      background: #fff;
      touch-action: none;
      display: block;
    }
    .locked-banner {
      background: rgba(47,107,70,0.08);
      border: 1px solid rgba(47,107,70,0.2);
      color: var(--ok);
      border-radius: 0.65rem;
      padding: 0.7rem 0.85rem;
      margin-bottom: 0.85rem;
      font-size: 0.92rem;
    }
    .boot { padding: 2rem 1rem; text-align: center; color: var(--muted); }
    @media print {
      body { background: #fff; }
      .no-print { display: none !important; }
      .wrap { max-width: none; padding: 0; }
      .card, .hero { box-shadow: none; border-color: #ccc; }
      .print-only { display: block !important; }
    }
    .print-only { display: none; }
    .print-sheet { font-size: 12px; line-height: 1.5; }
    .print-sheet h2 { font-size: 16px; margin: 0 0 8px; }
    .print-item { margin: 0 0 10px; page-break-inside: avoid; }
    .print-sig { max-width: 280px; border: 1px solid #999; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="boot" class="boot">載入中…</div>
    <div id="app" class="hidden" style="display:none">
      <header class="hero">
        <h1>簽約注意事項</h1>
        <p class="sub" id="heroSub">請逐條閱讀並按「我了解」。全部完成後手寫簽名送出。</p>
        <span class="badge" id="versionBadge">版本 —</span>
      </header>
      <div id="msg" class="msg" role="status"></div>
      <div id="lockedBanner" class="locked-banner hidden" style="display:none"></div>

      <section id="stepCard" class="card">
        <div class="progress">
          <span>第 <strong id="stepNum">1</strong> / 18 條</span>
          <span id="statusLabel">未開啟</span>
        </div>
        <h2 class="item-title" id="itemTitle"></h2>
        <div class="item-body" id="itemBody"></div>
        <div id="itemImages" class="img-grid"></div>
        <div id="itemFees" class="fee-stack"></div>
        <div id="itemExtras"></div>
        <div class="actions no-print">
          <button type="button" class="btn-ghost" id="btnPrev">上一條</button>
          <button type="button" class="btn-primary" id="btnAck">我了解</button>
        </div>
      </section>

      <section id="signCard" class="card" style="display:none;margin-top:1rem">
        <h2 class="item-title">對於以上說明已經清楚了解</h2>
        <p class="sub" style="color:var(--muted);margin:0 0 0.6rem;font-size:0.92rem">請在下方用手寫簽名（可清除重簽）。送出後將鎖定，無法再改。</p>
        <div class="sign-box">
          <canvas id="signCanvas"></canvas>
        </div>
        <div class="actions no-print">
          <button type="button" class="btn-secondary" id="btnClearSign">清除</button>
          <button type="button" class="btn-ghost" id="btnBackItems">回上一條</button>
          <button type="button" class="btn-primary" id="btnSubmit">送出簽名</button>
        </div>
      </section>

      <section id="doneCard" class="card" style="display:none;margin-top:1rem">
        <h2 class="item-title">已完成簽名</h2>
        <p id="doneMeta" style="color:var(--muted);font-size:0.92rem;line-height:1.5"></p>
        <div class="actions no-print">
          <button type="button" class="btn-primary" id="btnPrint">列印／匯出</button>
          <button type="button" class="btn-secondary" id="btnReview">查看條文</button>
        </div>
      </section>

      <section id="printArea" class="print-only print-sheet card" style="margin-top:1rem"></section>
    </div>
  </div>

  <script type="module" src="./js/esign-notice-main.js"></script>
</body>
</html>
