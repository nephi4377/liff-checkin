<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>線上報價編輯</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- 勿載 shared/js/config.js（ES module）；AccountingApi 已內建 GAS URL -->
  <script src="/shared/js/accounting_api.js?v=quote-editor-3-api"></script>
  <script src="/modules/projects/js/quote-editor-sanitize.js?v=quote-editor-3"></script>
  <script src="/modules/projects/js/quote-editor-local.js?v=quote-editor-3"></script>
  <style>
    :root {
      --ink: #1c2430;
      --muted: #5b6675;
      --line: #d7dde6;
      --bg: #eef2f6;
      --card: #ffffff;
      --accent: #2f6f7e;
      --danger: #a33b32;
      --ok: #2f6b46;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", "Hiragino Sans GB", "WenQuanYi Micro Hei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 110% 70% at 100% -10%, rgba(47, 111, 126, 0.12), transparent 55%),
        linear-gradient(165deg, #eef2f6 0%, #e7edf3 55%, #e2e9f0 100%);
      min-height: 100vh;
    }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    h1 { font-size: 1.35rem; margin: 0 0 0.35rem; }
    .sub { color: var(--muted); font-size: 0.92rem; margin: 0 0 1rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 0.75rem;
      padding: 0.9rem 1rem;
      margin: 0 0 0.85rem;
    }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 0.4rem 0; }
    label { font-size: 0.9rem; color: var(--muted); }
    input, select, textarea {
      font: inherit;
      padding: 0.45rem 0.55rem;
      border: 1px solid var(--line);
      border-radius: 0.45rem;
      min-width: 7rem;
    }
    textarea { width: 100%; min-height: 2.4rem; }
    button, .btn {
      font: inherit;
      border: 0;
      border-radius: 0.45rem;
      padding: 0.5rem 0.85rem;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button.secondary { background: #5b6675; }
    button.ghost { background: #e8eef1; color: var(--ink); }
    button:disabled { opacity: 0.55; cursor: wait; }
    .status { min-height: 1.4rem; font-size: 0.9rem; color: var(--muted); }
    .status.err { color: var(--danger); }
    .status.ok { color: var(--ok); }
    .zone-title { font-weight: 600; margin: 0 0 0.5rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th, td { text-align: left; padding: 0.35rem 0.3rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    tr.addon td:first-child { padding-left: 1.2rem; }
    tr.trade-head td { background: #f4f7f9; font-size: 0.88rem; }
    .totals { font-size: 0.95rem; line-height: 1.55; }
    .hint { font-size: 0.82rem; color: var(--muted); }
    .catalog-list { max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 0.45rem; }
    .catalog-list button {
      display: block; width: 100%; text-align: left; background: #fff; color: var(--ink);
      border-bottom: 1px solid var(--line); border-radius: 0; padding: 0.55rem 0.65rem;
    }
    .catalog-list button:hover { background: #f3f7f8; }
    .edit-grid { display: grid; grid-template-columns: 1.2fr 1fr 5rem 5rem 6rem; gap: 0.35rem; }
    .sheet-host { position: relative; }
    .sheet-wrap { overflow-x: auto; }
    table.sheet { min-width: 1040px; }
    table.sheet .item-cell { min-width: 14rem; }
    table.sheet th, table.sheet td { padding: 0; vertical-align: middle; }
    table.sheet th { padding: 0.4rem; font-size: 0.82rem; white-space: nowrap; background: #f7fafb; }
    table.sheet input, table.sheet select {
      width: 100%;
      min-width: 0;
      border: 0;
      background: transparent;
      border-radius: 0;
      padding: 0.5rem 0.4rem;
    }
    table.sheet tr.addon .item-cell { box-shadow: inset 3px 0 0 #c5d5da; }
    table.sheet tr.addon .item-cell input { padding-left: 1.2rem; }
    table.sheet tr:focus-within { background: #f3f8f8; }
    table.sheet td.row-actions, table.sheet th.row-actions {
      position: sticky;
      right: 0;
      background: #fff;
      white-space: nowrap;
      padding: 0.15rem 0.25rem;
    }
    table.sheet tr:focus-within td.row-actions { background: #f3f8f8; }
    .row-actions button, .suggest button, .btn-undo {
      background: #e8eef1;
      color: var(--ink);
      min-width: 2.1rem;
      min-height: 2.1rem;
      padding: 0.2rem 0.45rem;
      margin: 0 0.08rem;
      font-size: 0.78rem;
    }
    .suggest {
      position: absolute;
      z-index: 6;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 0.45rem;
      box-shadow: 0 8px 20px rgba(28, 36, 48, 0.12);
      max-height: 220px;
      overflow: auto;
      min-width: 16rem;
    }
    .suggest button { display: block; width: 100%; text-align: left; border-radius: 0; margin: 0; }
    .suggest button:hover { background: #f3f7f8; }
    .trade-sum { margin-top: 0.45rem; }
    @media (max-width: 720px) {
      .edit-grid { grid-template-columns: 1fr 1fr; }
      .wrap { padding: 0.75rem 0.6rem 2.5rem; }
      h1 { font-size: 1.2rem; }
      table.sheet td.row-actions, table.sheet th.row-actions { position: static; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>線上報價</h1>
    <p class="sub" id="headerSub">案號載入中…</p>
    <p class="status" id="statusLine" aria-live="polite"></p>

    <div class="card">
      <div class="row">
        <label>新增空間</label>
        <input id="zoneName" placeholder="例如：客廳" />
        <button type="button" id="btnAddZone">加入空間</button>
      </div>
      <p class="hint">直接點下面表格的格子打字。工種、單位用選的；品名可打，也可從標準計價點一筆帶入單位和單價，之後仍可改。抽屜、拉籃按該櫃的「＋加購」，名稱、數量、單價可自填。改價要寫原因。格子會自動暫存。成本與廠商價不會出現在客人頁或列印；客人頁也不顯示單價。</p>
    </div>

    <div id="zonesBox"></div>

    <div class="card">
      <div class="zone-title">已收扣費</div>
      <div class="row">
        <label>丈量費</label>
        <input id="feeMeasure" type="number" min="0" step="1" value="0" style="width:7rem" />
        <label>啟動金</label>
        <input id="feeStartup" type="number" min="0" step="1" value="0" style="width:7rem" />
        <label>規劃費</label>
        <input id="feePlanning" type="number" min="0" step="1" value="0" style="width:7rem" />
      </div>
      <div class="row">
        <label>報價日期</label>
        <input id="quoteDate" type="date" style="width:10rem" />
        <button type="button" class="secondary" id="btnSaveFees">儲存扣費</button>
      </div>
    </div>

    <div class="card totals" id="totalsBox">合計載入中…</div>

    <div class="card">
      <div class="zone-title">版本紀錄</div>
      <div id="versionsBox" class="hint">尚無版本</div>
      <div class="row" style="margin-top:0.6rem">
        <input id="versionNote" placeholder="版本備註（選填）" style="flex:1;min-width:12rem" />
        <button type="button" id="btnSend">送出給客人</button>
        <button type="button" class="secondary" id="btnNewVersion">開新版本</button>
      </div>
    </div>

    <div class="card row">
      <button type="button" class="secondary" id="btnPreflight">送出前檢查</button>
      <button type="button" class="secondary" id="btnPrint">列印預覽（無單價／無成本）</button>
      <button type="button" class="secondary" id="btnRefresh">重新載入</button>
    </div>
    <pre id="preflightBox" class="card hint" hidden></pre>
  </div>
  <script src="/modules/projects/js/quote-editor-grid.js?v=quote-sheet-2"></script>
  <script src="/modules/projects/js/quote-editor-grid-ui.js?v=quote-sheet-2"></script>
  <script src="/modules/projects/js/quote-editor-main.js?v=quote-sheet-2"></script>
</body>
</html>
