<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>線上報價編輯</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- 勿載 shared/js/config.js（ES module）；AccountingApi 已內建 GAS URL -->
  <!-- 先讀本分頁員工身分；入口判斷擋在共用登入前面，沒身分不跳 LINE -->
  <script src="/shared/js/operator_context.js?v=3"></script>
  <script src="/shared/js/accounting_api.js?v=quote-editor-3-api"></script>
  <script src="/modules/projects/js/quote-editor-entry.js?v=1"></script>
  <script src="/modules/projects/js/quote-editor-sanitize.js?v=quote-editor-3"></script>
  <script src="/modules/projects/js/quote-editor-local.js?v=quote-editor-3"></script>
  <style>
    :root {
      --ink: #1c2430;
      --muted: #5b6675;
      --line: #d7dde6;
      --bg: #eef2f6;
      --card: #ffffff;
      --accent: #2f6f7e;
      --danger: #a33b32;
      --ok: #2f6b46;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", "Hiragino Sans GB", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 110% 70% at 100% -10%, rgba(47, 111, 126, 0.12), transparent 55%),
        linear-gradient(165deg, #eef2f6 0%, #e7edf3 55%, #e2e9f0 100%);
      min-height: 100vh;
    }
    .wrap { max-width: 960px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    h1 { font-size: 1.35rem; margin: 0 0 0.35rem; }
    .sub { color: var(--muted); font-size: 0.92rem; margin: 0 0 1rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 0.75rem;
      padding: 0.9rem 1rem;
      margin: 0 0 0.85rem;
    }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 0.4rem 0; }
    label { font-size: 0.9rem; color: var(--muted); }
    input, select, textarea {
      font: inherit;
      padding: 0.45rem 0.55rem;
      border: 1px solid var(--line);
      border-radius: 0.45rem;
      min-width: 7rem;
    }
    textarea { width: 100%; min-height: 2.4rem; }
    button, .btn {
      font: inherit;
      border: 0;
      border-radius: 0.45rem;
      padding: 0.5rem 0.85rem;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button.secondary { background: #5b6675; }
    button.ghost { background: #e8eef1; color: var(--ink); }
    button:disabled { opacity: 0.55; cursor: wait; }
    .status { min-height: 1.4rem; font-size: 0.9rem; color: var(--muted); }
    .status.err { color: var(--danger); }
    .status.ok { color: var(--ok); }
    .zone-title { font-weight: 600; margin: 0 0 0.5rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th, td { text-align: left; padding: 0.35rem 0.3rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    tr.addon td:first-child { padding-left: 1.2rem; }
    tr.trade-head td { background: #f4f7f9; font-size: 0.88rem; }
    .totals { font-size: 0.95rem; line-height: 1.55; }
    .hint { font-size: 0.82rem; color: var(--muted); }
    .catalog-list { max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 0.45rem; }
    .catalog-list button {
      display: block; width: 100%; text-align: left; background: #fff; color: var(--ink);
      border-bottom: 1px solid var(--line); border-radius: 0; padding: 0.55rem 0.65rem;
    }
    .catalog-list button:hover { background: #f3f7f8; }
    .edit-grid { display: grid; grid-template-columns: 1.2fr 1fr 5rem 5rem 6rem; gap: 0.35rem; }
    @media (max-width: 720px) {
      .edit-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>線上報價</h1>
    <p class="sub" id="headerSub">案號載入中…</p>
    <p class="status" id="statusLine" aria-live="polite"></p>

    <div class="card">
      <div class="row">
        <label>新增空間</label>
        <input id="zoneName" placeholder="例如：客廳" />
        <button type="button" id="btnAddZone">加入空間</button>
      </div>
      <p class="hint">先選工種再挑價目；名稱／說明／數量／單位可改；改價要寫原因。抽屜／拉籃請先按櫃子「掛附加」再點價目；另有「自填附加」手打特殊五金。成本與廠商價不會出現在客人頁或列印；客人頁也不顯示單價。</p>
    </div>

    <div class="card">
      <div class="row">
        <label>加入到空間</label>
        <select id="zoneSelect"></select>
        <label>工種</label>
        <select id="tradeSelect"><option value="">先選工種…</option></select>
        <input id="catalogQ" placeholder="在此工種搜尋" />
        <button type="button" class="secondary" id="btnSearch">搜尋價目</button>
        <button type="button" class="ghost" id="btnAddCustom">新增自訂項</button>
      </div>
      <div class="row">
        <label>數量</label>
        <input id="qty" type="number" min="0" max="9999" step="0.1" value="1.5" style="width:6rem" />
        <label>改價（選填）</label>
        <input id="overridePrice" type="number" placeholder="沿用表價" style="width:7rem" />
        <input id="overrideReason" placeholder="改價原因（有改價必填）" style="flex:1;min-width:12rem" />
      </div>
      <div id="customBox" class="card" hidden style="background:#f7fafb;margin:0.5rem 0 0">
        <div class="zone-title">自訂項／特殊五金自填</div>
        <div class="row">
          <input id="customItem" placeholder="名稱" style="flex:1" />
          <input id="customUnit" placeholder="單位" style="width:5rem" />
          <input id="customQty" type="number" min="0" max="9999" step="0.1" value="1" style="width:5rem" />
          <input id="customPrice" type="number" min="0" placeholder="單價" style="width:7rem" />
        </div>
        <div class="row">
          <input id="customNote" placeholder="說明（規格／材質／色號）" style="flex:1" />
          <select id="customParent"><option value="">掛在空間（主項）</option></select>
          <button type="button" id="btnSaveCustom">儲存自填</button>
        </div>
      </div>
      <div id="catalogBox" class="catalog-list" hidden></div>
    </div>

    <div id="zonesBox"></div>

    <div class="card">
      <div class="zone-title">已收扣費</div>
      <div class="row">
        <label>丈量費</label>
        <input id="feeMeasure" type="number" min="0" step="1" value="0" style="width:7rem" />
        <label>啟動金</label>
        <input id="feeStartup" type="number" min="0" step="1" value="0" style="width:7rem" />
        <label>規劃費</label>
        <input id="feePlanning" type="number" min="0" step="1" value="0" style="width:7rem" />
      </div>
      <div class="row">
        <label>報價日期</label>
        <input id="quoteDate" type="date" style="width:10rem" />
        <button type="button" class="secondary" id="btnSaveFees">儲存扣費</button>
      </div>
    </div>

    <div class="card totals" id="totalsBox">合計載入中…</div>

    <div class="card">
      <div class="zone-title">版本紀錄</div>
      <div id="versionsBox" class="hint">尚無版本</div>
      <div class="row" style="margin-top:0.6rem">
        <input id="versionNote" placeholder="版本備註（選填）" style="flex:1;min-width:12rem" />
        <button type="button" id="btnSend">送出給客人</button>
        <button type="button" class="secondary" id="btnNewVersion">開新版本</button>
      </div>
    </div>

    <div class="card row">
      <button type="button" class="secondary" id="btnPreflight">送出前檢查</button>
      <button type="button" class="secondary" id="btnPrint">列印預覽（無單價／無成本）</button>
      <button type="button" class="secondary" id="btnRefresh">重新載入</button>
    </div>
    <pre id="preflightBox" class="card hint" hidden></pre>
  </div>
  <script src="/modules/projects/js/quote-editor-main.js?v=quote-editor-3"></script>
</body>
</html>
