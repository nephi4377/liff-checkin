<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SketchUp 渲染工作室｜添心設計</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <div id="loading" class="loading">載入中…</div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div>
        <h1>SketchUp 渲染工作室</h1>
        <p id="userLine" class="sub">—</p>
      </div>
      <div class="topbar-actions">
        <button type="button" id="btnAdd" class="btn btn-secondary">＋ 加入圖片</button>
        <input type="file" id="fileInput" accept="image/*" multiple hidden />
      </div>
    </header>

    <section class="controls card" id="controlsPanel">
      <div class="control-block mode-block">
        <label class="block-label">渲染模式</label>
        <div class="mode-radios">
          <label class="inline-check"><input type="radio" name="renderMode" value="fidelity" checked /> 保真（只加光線質感）</label>
          <label class="inline-check"><input type="radio" name="renderMode" value="enhance" /> 風格美化</label>
          <label class="inline-check"><input type="radio" name="renderMode" value="creative" /> 自由發揮</label>
        </div>
      </div>
      <div class="control-block preserve-block">
        <label class="block-label">這些不要動 <span class="hint">（預設全勾；要改請取消並寫在補充說明）</span></label>
        <div class="preserve-chips">
          <label class="inline-check"><input type="checkbox" id="preserveCeiling" checked /> 天花類型</label>
          <label class="inline-check"><input type="checkbox" id="preserveBeam" checked /> 樑柱顏色</label>
          <label class="inline-check"><input type="checkbox" id="preserveWall" checked /> 牆面油漆</label>
          <label class="inline-check"><input type="checkbox" id="preserveLines" checked /> 線條／開口</label>
          <label class="inline-check"><input type="checkbox" id="preserveLayout" checked /> 家具擺位（不要增減）</label>
        </div>
      </div>
      <div id="analyzeSummary" class="analyze-summary hidden" aria-live="polite"></div>
      <div class="prompt-scope">
        <label class="inline-check">
          <input type="checkbox" id="useCustomPrompt" />
          此圖自訂 Prompt
        </label>
        <span id="promptScopeHint" class="hint">未勾選：全部圖片沿用下方全域設定</span>
      </div>
      <div class="control-row">
        <label>空間類型</label>
        <input type="text" id="roomTypeInput" placeholder="客廳、主臥、廚房…（可留空）" />
      </div>
      <div class="control-row">
        <label>設計風格</label>
        <select id="styleSelect"></select>
      </div>
      <div class="control-row">
        <label>整體光線</label>
        <select id="lightingSelect"></select>
      </div>
      <div class="control-block">
        <label>燈光來源標籤 <span class="hint">（可多選＝允許的燈種；未勾選的不要畫。數量預設不加）</span></label>
        <div id="lightTagChips" class="chips"></div>
        <div id="lightCustomWrap" class="control-row hidden">
          <label>其他燈具描述</label>
          <input type="text" id="lightCustomNote" placeholder="例：餐廳三頭吊燈、床頭兩盞壁燈…" />
        </div>
        <label class="inline-check">
          <input type="checkbox" id="allowAddLights" />
          允許加燈（含增加盞數；未勾選則禁止自行加燈）
        </label>
      </div>
      <div class="control-block">
        <label>櫃體／門片 <span class="hint">配色優先延用原圖；櫃體多為同色，門片可跳色但禁止亂換。材質名稱可選填</span></label>
        <div class="control-row">
          <label>櫃體材質</label>
          <input type="text" id="cabinetBodyMaterial" placeholder="例：灰橡木皮、白色美耐板（可留空＝跟原圖）" />
        </div>
        <div class="control-row">
          <label>門片材質</label>
          <input type="text" id="cabinetDoorMaterial" placeholder="例：同櫃體、黑玻、跳色烤漆（可留空）" />
        </div>
      </div>
      <div class="control-block">
        <label>指定某處顏色 <span class="hint">未指定時天花與牆同色、單色（忽略 SketchUp 視角色差）</span></label>
        <div class="color-note-row">
          <input type="text" id="colorNotePlace" placeholder="例如：沙發背牆、天花板" />
          <input type="color" id="colorNotePicker" value="#e8e0d4" />
          <button type="button" id="btnAddColorNote" class="btn btn-secondary">加入</button>
        </div>
        <div id="colorNoteChips" class="chips"></div>
      </div>
      <div class="control-row">
        <label>補充說明</label>
        <textarea id="extraNotes" rows="2" placeholder="例：加強中島下方燈帶、客廳落地窗自然光…"></textarea>
      </div>
      <div class="control-actions">
        <button type="button" id="btnAnalyze" class="btn btn-secondary">分析這張圖</button>
        <button type="button" id="btnRenderFidelity" class="btn btn-primary">只加光線質感</button>
        <button type="button" id="btnRenderStyled" class="btn btn-secondary">依下方設定美化</button>
        <button type="button" id="btnRenderAll" class="btn btn-primary">批次渲染全部</button>
      </div>
      <p id="statusMsg" class="status-msg"></p>
      <p id="sendNowLine" class="send-now-line">這次送出：尚未選圖</p>
      <details class="dev-panel">
        <summary>進階／測試設定</summary>
        <div class="control-row">
          <label>GAS URL</label>
          <input type="text" id="gasUrlInput" placeholder="accounting-gas Web App /exec" />
        </div>
        <label class="inline-check">
          <input type="checkbox" id="devBypassInput" />
          開發 bypass（本機測試）
        </label>
        <div class="control-row">
          <label>ingest secret</label>
          <input type="password" id="ingestSecretInput" placeholder="（可選）" />
        </div>
      </details>
    </section>

    <section class="send-card card" id="sendCard">
      <div class="send-head">
        <div>
          <label class="block-label">這次送出哪一張去改</label>
          <p class="hint">先選圖，再開畫筆放大標示；沒畫的地方會盡量維持。</p>
        </div>
        <div class="send-tools">
          <button type="button" id="btnPaint" class="btn btn-secondary">畫筆標示</button>
          <button type="button" id="btnClearMarkup" class="btn btn-secondary">清除筆跡</button>
        </div>
      </div>
      <div id="sendSourceChips" class="chips send-chips"></div>
      <div class="send-stage" id="sendStage">
        <div class="placeholder">請先加入圖片</div>
      </div>
    </section>

    <section class="compare-wrap">
      <div class="compare card">
        <div class="compare-pane">
          <div class="pane-label">原圖</div>
          <div class="pane-media" id="paneOriginal">
            <div class="placeholder">請加入 SketchUp 截圖</div>
          </div>
        </div>
        <div class="compare-pane">
          <div class="pane-label">渲染結果</div>
          <div class="pane-media" id="paneRendered">
            <div class="placeholder" id="renderPlaceholder">選擇圖片後按「渲染」</div>
          </div>
        </div>
      </div>
    </section>

    <section class="filmstrip card">
      <div class="filmstrip-head">
        <span>圖片列表</span>
        <span id="filmMeta" class="hint"></span>
      </div>
      <div id="thumbRow" class="thumb-row"></div>
      <div id="versionRow" class="version-row hidden">
        <span class="version-label">此圖版本</span>
        <div id="versionThumbs" class="version-thumbs"></div>
      </div>
    </section>
  </div>

  <div id="paintLightbox" class="paint-lb hidden" aria-hidden="true">
    <div class="paint-lb-bar">
      <strong>標示要改的地方</strong>
      <label class="paint-tool">粗細
        <input type="range" id="brushSize" min="2" max="28" value="6" />
        <span id="brushSizeLabel">6</span>
      </label>
      <label class="paint-tool">顏色
        <input type="color" id="brushColor" value="#ff4d4f" />
      </label>
      <button type="button" id="btnBrushPen" class="btn btn-secondary active">筆</button>
      <button type="button" id="btnBrushEraser" class="btn btn-secondary">擦</button>
      <button type="button" id="btnBrushUndo" class="btn btn-secondary">上一步</button>
      <button type="button" id="btnClearMarkupLb" class="btn btn-secondary">清除</button>
      <button type="button" id="btnPaintDone" class="btn btn-primary">完成</button>
    </div>
    <div id="paintLbStage" class="paint-lb-stage"></div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
