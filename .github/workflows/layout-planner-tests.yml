# LayoutPlanner Vitest + Playwright（僅 PR / 手動；不部署、不碰 Pages）
name: LayoutPlanner tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layout-planner-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  unit-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: modules/InteriorDesigned

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: modules/InteriorDesigned/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Vitest unit tests
        run: npm run test:unit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Noto CJK fonts (visual regression)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Playwright e2e
        run: npm run test:e2e
        env:
          CI: true
          LP_E2E_ARTIFACTS: ${{ runner.temp }}/lp-artifacts
