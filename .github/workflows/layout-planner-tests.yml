# 前端 PR 測試：LayoutPlanner（Vitest + Playwright）與主控台 smoke（mock GAS）
name: Frontend PR tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-pr-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  layout-planner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: modules/InteriorDesigned

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: modules/InteriorDesigned/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Vitest unit tests
        run: npm run test:unit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Noto CJK fonts (visual regression)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Playwright e2e
        run: npm run test:e2e
        env:
          CI: true

  console-e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Hub / project-console smoke (mocked GAS)
        run: npm run test:console-e2e
        env:
          CI: true
