name: Record Pages deployment result
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: pages-deployment-result
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const run=context.payload.workflow_run;
            if(run.head_branch!=='main' || run.head_repository.full_name!==owner+'/'+repo)return;
            const main=await github.rest.repos.getBranch({owner,repo,branch:'main'});
            if(run.head_sha!==main.data.commit.sha)return;
            const branch='deployment-status/pages';
            try{await github.rest.git.getRef({owner,repo,ref:'heads/'+branch});}
            catch(error){if(error.status!==404)throw error;await github.rest.git.createRef({owner,repo,ref:'refs/heads/'+branch,sha:run.head_sha});}
            let previousSha;
            try{previousSha=(await github.rest.repos.getContent({owner,repo,path:'deployment-status.json',ref:branch})).data.sha;}
            catch(error){if(error.status!==404)throw error;}
            const receipt={component:'pages',source_sha:run.head_sha,conclusion:run.conclusion,run_url:run.html_url,recorded_at:new Date().toISOString()};
            await github.rest.repos.createOrUpdateFileContents({owner,repo,branch,path:'deployment-status.json',
              message:'Record actual Pages deployment '+run.head_sha.slice(0,7),
              content:Buffer.from(JSON.stringify(receipt,null,2)+'\n').toString('base64'),...(previousSha?{sha:previousSha}:{})});
