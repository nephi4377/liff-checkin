name: RTDB quotations rules and auth merge tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rtdb-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Vitest firebase auth merge
        run: npm run test:rtdb-auth-merge

      - name: RTDB rules emulator tests
        run: npm run test:rtdb-rules

      - name: RTDB legacy-public rules compat (new frontend)
        run: npm run test:rtdb-rules-legacy

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: BudgetWeb auth E2E (local + githack)
        run: npm run test:budget-web-e2e
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHACK_SHA: ${{ github.sha }}
          RTDB_E2E_ARTIFACTS: ${{ runner.temp }}/rtdb-e2e

  layout-planner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: modules/InteriorDesigned
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: modules/InteriorDesigned/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm run test:e2e
        env:
          CI: true
          LP_E2E_ARTIFACTS: ${{ runner.temp }}/lp-artifacts
