name: Employee todo tests

on:
  pull_request:
    paths:
      - 'employee-todo-src/**'
      - 'employee-todo/**'
      - '.github/workflows/employee-todo-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vitest-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: employee-todo-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: employee-todo-src/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
