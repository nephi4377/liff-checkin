name: Publish customer portal Pages
on:
  push:
    branches: [main]
    paths:
      - 'modules/accounting/customer-finance-portal.html'
      - '.github/workflows/publish-customer-portal.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: customer-portal-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            let conclusion = 'failure';
            let diagnostic = '';
            let buildUrl = '';
            try {
              const pages = await github.rest.repos.getPages({owner, repo});
              core.info('Pages source: ' + JSON.stringify(pages.data.source) + ', build type: ' + pages.data.build_type);
              if (pages.data.build_type === 'workflow') throw new Error('Pages uses a custom workflow; refusing to change site settings');
              if (pages.data.source?.branch !== 'main' || pages.data.source?.path !== '/') {
                throw new Error('Pages source is not main at repository root; refusing to change site settings');
              }
              // Explicitly request a build: some authenticated Git pushes do not schedule Pages builds.
              await github.rest.repos.requestPagesBuild({owner, repo});
              for (let attempt = 0; attempt < 48; attempt++) {
                const response = await github.rest.repos.getLatestPagesBuild({owner, repo});
                const build = response.data;
                buildUrl = build.url;
                if (build.commit === context.sha && build.status === 'built') {
                  conclusion = 'success';
                  break;
                }
                if (build.commit === context.sha && build.status === 'errored') throw new Error(build.error?.message || 'Pages build failed');
                await new Promise(resolve => setTimeout(resolve, 15000));
              }
              if (conclusion !== 'success') throw new Error('Timed out waiting for the selected Pages commit');
            } catch (error) {
              diagnostic = error.message;
              core.error(diagnostic);
            }
            const branch = 'deployment-status/pages';
            try {
              await github.rest.git.getRef({owner, repo, ref:'heads/' + branch});
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({owner, repo, ref:'refs/heads/' + branch, sha:context.sha});
            }
            let previousSha;
            try {
              const response = await github.rest.repos.getContent({owner, repo, path:'deployment-status.json', ref:branch});
              previousSha = response.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const receipt = {component:'pages', source_sha:context.sha, conclusion, diagnostic, build_url:buildUrl,
              run_url:'https://github.com/' + owner + '/' + repo + '/actions/runs/' + context.runId,
              recorded_at:new Date().toISOString()};
            await github.rest.repos.createOrUpdateFileContents({owner, repo, branch, path:'deployment-status.json',
              message:'Record Pages publication ' + context.sha.slice(0,7),
              content:Buffer.from(JSON.stringify(receipt,null,2) + '\n').toString('base64'),
              ...(previousSha ? {sha:previousSha} : {})});
            if (conclusion !== 'success') core.setFailed(diagnostic);
